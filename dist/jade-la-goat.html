<title>Jade la Goat</title>
<meta name="description" content="Le QG de révision de Jade — BTS Collaborateur juriste notarial : fiches, quiz, flashcards, jeux et cas pratiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : coque d'app — barre haute collante, colonne de lecture (760px) et schémas plus larges, barre d'onglets en bas sur téléphone.
   Direction : « cire violette sur papier de nuit » — le sceau du notaire comme signature visuelle. */
:root{
  color-scheme: dark;
  --bg:#0B0911;
  --bg-2:#110D19;
  --surface:#16121F;
  --surface-2:#1E1829;
  --surface-3:#272036;
  --line:#2C2439;
  --line-2:#3A3049;
  --fg:#F2EEF8;
  --muted:#A69EB8;
  --faint:#716985;
  --accent:#A283FF;
  --accent-strong:#7C4DFF;
  --accent-deep:#4A1DB5;
  --accent-ink:#0E0A16;
  --accent-soft:rgba(162,131,255,.13);
  --accent-line:rgba(162,131,255,.38);
  --glow:rgba(124,77,255,.42);
  --good:#62D6A6; --good-soft:rgba(98,214,166,.14);
  --bad:#FF8199;  --bad-soft:rgba(255,129,153,.14);
  --warn:#F1C36E; --warn-soft:rgba(241,195,110,.13);
  --paper:#F4F0F9; --paper-ink:#1A1424;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --il-sky:#1B1530; --il-ground:#231C34; --il-wall:#ECE6F5; --il-roof:#7C4DFF; --il-dark:#0E0A16; --il-green:#3E7C67; --il-leaf:#5FB38F; --il-wheat:#E3C477; --il-line:#4B3F63;

  --font-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --font-body:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --fs-xs:.76rem; --fs-s:.88rem; --fs-m:1rem; --fs-l:1.15rem; --fs-xl:1.45rem; --fs-2xl:clamp(1.7rem,4.6vw,2.3rem); --fs-3xl:clamp(2.2rem,7vw,3.4rem);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --top-h:60px;
  --tab-h:66px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#F7F4FB; --bg-2:#EFEAF6; --surface:#FFFFFF; --surface-2:#F2EDF9; --surface-3:#E8E0F4;
    --line:#E3DBEE; --line-2:#D3C8E3; --fg:#17121F; --muted:#5E5672; --faint:#8C849E;
    --accent:#6B3BEA; --accent-strong:#5A28DA; --accent-deep:#3D1494; --accent-ink:#FFFFFF;
    --accent-soft:rgba(107,59,234,.09); --accent-line:rgba(107,59,234,.32); --glow:rgba(107,59,234,.25);
    --good:#16905F; --good-soft:rgba(22,144,95,.11); --bad:#D2385A; --bad-soft:rgba(210,56,90,.09); --warn:#A2650C; --warn-soft:rgba(206,140,30,.13);
    --paper:#FFFFFF; --paper-ink:#1A1424; --shadow:0 18px 44px -24px rgba(45,20,90,.35);
    --il-sky:#EDE6FA; --il-ground:#DCD2EC; --il-wall:#FFFFFF; --il-roof:#6B3BEA; --il-dark:#2A2140; --il-green:#2F7A5C; --il-leaf:#4FA57F; --il-wheat:#D2A94B; --il-line:#B7A9CE;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F7F4FB; --bg-2:#EFEAF6; --surface:#FFFFFF; --surface-2:#F2EDF9; --surface-3:#E8E0F4;
  --line:#E3DBEE; --line-2:#D3C8E3; --fg:#17121F; --muted:#5E5672; --faint:#8C849E;
  --accent:#6B3BEA; --accent-strong:#5A28DA; --accent-deep:#3D1494; --accent-ink:#FFFFFF;
  --accent-soft:rgba(107,59,234,.09); --accent-line:rgba(107,59,234,.32); --glow:rgba(107,59,234,.25);
  --good:#16905F; --good-soft:rgba(22,144,95,.11); --bad:#D2385A; --bad-soft:rgba(210,56,90,.09); --warn:#A2650C; --warn-soft:rgba(206,140,30,.13);
  --paper:#FFFFFF; --paper-ink:#1A1424; --shadow:0 18px 44px -24px rgba(45,20,90,.35);
  --il-sky:#EDE6FA; --il-ground:#DCD2EC; --il-wall:#FFFFFF; --il-roof:#6B3BEA; --il-dark:#2A2140; --il-green:#2F7A5C; --il-leaf:#4FA57F; --il-wheat:#D2A94B; --il-line:#B7A9CE;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B0911; --bg-2:#110D19; --surface:#16121F; --surface-2:#1E1829; --surface-3:#272036;
  --line:#2C2439; --line-2:#3A3049; --fg:#F2EEF8; --muted:#A69EB8; --faint:#716985;
  --accent:#A283FF; --accent-strong:#7C4DFF; --accent-deep:#4A1DB5; --accent-ink:#0E0A16;
  --accent-soft:rgba(162,131,255,.13); --accent-line:rgba(162,131,255,.38); --glow:rgba(124,77,255,.42);
  --good:#62D6A6; --good-soft:rgba(98,214,166,.14); --bad:#FF8199; --bad-soft:rgba(255,129,153,.14); --warn:#F1C36E; --warn-soft:rgba(241,195,110,.13);
  --paper:#F4F0F9; --paper-ink:#1A1424; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --il-sky:#1B1530; --il-ground:#231C34; --il-wall:#ECE6F5; --il-roof:#7C4DFF; --il-dark:#0E0A16; --il-green:#3E7C67; --il-leaf:#5FB38F; --il-wheat:#E3C477; --il-line:#4B3F63;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
table{color:inherit}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:-20vmax;z-index:0;pointer-events:none;
  background:
    radial-gradient(38vmax 30vmax at 12% 8%, var(--glow), transparent 60%),
    radial-gradient(30vmax 26vmax at 92% 18%, var(--accent-soft), transparent 62%),
    radial-gradient(40vmax 30vmax at 70% 110%, var(--accent-soft), transparent 60%);
  opacity:.55;animation:aurora 26s var(--ease) infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3vmax,2vmax,0) scale(1.06)}100%{transform:translate3d(-2vmax,3vmax,0) scale(1.02)}}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:var(--fs-2xl)} h3{font-size:var(--fs-xl)} h4{font-size:var(--fs-l)}
p{margin:0}
a{color:var(--accent)}
strong,b{font-weight:650}
em{font-style:italic}
code,.mono{font-family:var(--font-mono);font-size:.86em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ——— Coque ——— */
.app{position:relative;z-index:1;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;height:var(--top-h);padding-inline:16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;cursor:pointer;flex:0 0 auto}
.brand-seal{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 4px 10px var(--glow))}
.brand-name{font-family:var(--font-display);font-size:1.28rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-name i{font-weight:400;color:var(--muted);margin:0 .12em}
.brand-name b{color:var(--accent);font-weight:800}
.topnav{display:none;gap:4px;margin-left:12px}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:550;cursor:pointer;transition:color .2s,background .2s}
.topnav button:hover{color:var(--fg);background:var(--surface-2)}
.topnav button[aria-current="page"]{color:var(--fg);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.xp-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:var(--fs-s);font-weight:600;white-space:nowrap;transition:border-color .2s,transform .2s var(--spring)}
.xp-chip:hover{border-color:var(--accent-line)}
.xp-chip:active{transform:scale(.96)}
.xp-chip .lvl{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:.72rem;font-weight:700}
.xp-chip .xpv{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;transition:transform .25s var(--spring),border-color .2s}
.icon-btn:hover{border-color:var(--accent-line)}
.icon-btn:active{transform:scale(.92) rotate(-12deg)}
.icon-btn svg{width:19px;height:19px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--line)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 2px 5px;color:var(--faint);font-size:.68rem;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:color .2s}
.tabbar button svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.tabbar button[aria-current="page"]{color:var(--fg)}
.tabbar button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08);color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--glow);animation:tabIn .4s var(--spring)}
@keyframes tabIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.view{position:relative;outline:none;overflow-x:clip;padding-block:22px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
.col{max-width:780px}
.view-enter{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .55s var(--ease) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}

@media (min-width:900px){
  .topnav{display:flex}
  .tabbar{display:none}
  .view{padding-block:34px 80px}
}

/* ——— Boutons & étiquettes ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:620;font-size:.97rem;cursor:pointer;text-decoration:none;transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .25s}
.btn:hover{border-color:var(--accent-line)}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 28px -12px var(--glow)}
.btn-primary:hover{background:var(--accent-strong);color:#fff;box-shadow:0 14px 34px -12px var(--glow)}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.eyebrow{font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--accent);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:650;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.plain{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.new-badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:pulseNew 2.4s ease-in-out infinite}
@keyframes pulseNew{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 6px transparent}}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.lead{font-size:var(--fs-l);color:var(--muted);max-width:62ch}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px}
.section-title h2{font-size:var(--fs-xl)}
.meter{position:relative;height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--accent-deep),var(--accent));transition:width .9s var(--ease)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.empty{padding:24px;border:1px dashed var(--line-2);border-radius:var(--r-m);color:var(--muted);text-align:center}

/* ——— Accueil ——— */
.hero{display:grid;gap:22px;align-items:center;padding-block:4px 10px}
.hero-seal{width:min(44vw,200px);aspect-ratio:1;max-width:100%;justify-self:start;position:relative}
.hero-seal svg{width:100%;height:100%;overflow:visible}
.seal-stamp{transform-origin:50% 50%;animation:stamp 1.1s var(--spring) .15s both}
@keyframes stamp{0%{opacity:0;transform:scale(1.9) rotate(-18deg);filter:blur(6px)}55%{opacity:1;transform:scale(.94) rotate(3deg);filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
.seal-ripple{transform-origin:50% 50%;animation:ripple 1.3s var(--ease) .75s both}
@keyframes ripple{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.55)}}
.seal-ring{transform-origin:50% 50%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-title{font-family:var(--font-display);line-height:.86;letter-spacing:-.035em;margin:10px 0 0}
.hero-title .l1{display:block;font-style:italic;font-weight:800;font-size:clamp(4.4rem,22vw,9.5rem)}
.hero-title .l2{display:block;font-weight:500;font-size:clamp(2.2rem,10vw,4.4rem);margin-top:.08em}
.hero-title .l2 em{font-style:italic;color:var(--accent);font-weight:800}
.hero-title .ch{display:inline-block;animation:charIn .8s var(--spring) both}
@keyframes charIn{from{opacity:0;transform:translateY(.45em) rotate(6deg)}to{opacity:1;transform:none}}
.hero-sub{margin-top:18px;max-width:46ch;color:var(--muted);font-size:var(--fs-l)}
.hero-cta{margin-top:22px}
@media (min-width:760px){
  .hero{grid-template-columns:1.35fr .65fr}
  .hero-seal{order:2;justify-self:end;width:min(30vw,300px)}
}
.lvl-card{display:grid;gap:12px;margin-top:26px;padding:18px;border-radius:var(--r-l);background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.lvl-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);opacity:.6;pointer-events:none}
.lvl-top{display:flex;align-items:center;gap:14px}
.lvl-badge{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;flex:0 0 auto;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:800;font-size:1.5rem;box-shadow:0 0 0 5px var(--accent-soft),0 10px 26px -8px var(--glow)}
.lvl-name{font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.lvl-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--fs-s);color:var(--muted)}
.lvl-meta b{color:var(--fg);font-family:var(--font-mono);font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border-radius:var(--r-m);background:var(--bg-2);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--font-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-xs);color:var(--muted)}

.subjects{display:grid;gap:18px}
@media (min-width:860px){.subjects{grid-template-columns:1fr 1fr}}
.subject{position:relative;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.subject-head{padding:20px 20px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line);background:linear-gradient(160deg,var(--accent-soft),transparent 60%)}
.subject-head h3{font-size:1.5rem}
.subject-code{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.chap-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 20px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.chap-row:first-of-type{border-top:0}
.chap-row:hover{background:var(--surface-2)}
.chap-num{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:var(--accent)}
.chap-row .t{font-weight:650;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chap-row .s{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.chap-row .meter{margin-top:8px;max-width:220px}
.chap-row .arrow{color:var(--faint);transition:transform .3s var(--spring)}
.chap-row:hover .arrow{transform:translateX(4px);color:var(--accent)}
.subject-foot{padding:12px 20px 16px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)}

.quick-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.quick-grid{grid-template-columns:1fr 1fr}}
.quick{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .3s var(--spring),border-color .2s}
.quick:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.quick:active{transform:scale(.98)}
.quick .ico{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.quick .ico svg{width:22px;height:22px}
.quick b{display:block;font-size:1rem}
.quick span{font-size:var(--fs-s);color:var(--muted)}
.trap-card{position:relative;padding:18px 18px 18px 20px;border-radius:var(--r-m);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.trap-card .eyebrow{color:var(--warn)}
.trap-card p{margin-top:8px}
.log{display:grid;gap:10px}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.log-item time{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent);padding-top:3px;white-space:nowrap}
.log-item ul{margin:0;padding-left:18px;color:var(--muted);font-size:var(--fs-s)}

/* ——— Page chapitre ——— */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-s);color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.crumbs button:hover{color:var(--fg)}
.chap-head{display:grid;gap:12px;margin-bottom:8px}
.chap-head h1{font-size:var(--fs-3xl);font-weight:700}
.chap-head h1 em{color:var(--accent)}
.chap-facts{display:flex;flex-wrap:wrap;gap:8px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:30;margin:18px -16px 0;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .25s var(--ease)}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs .count{font-family:var(--font-mono);font-size:.7rem;opacity:.7}
.tab-panel{padding-top:22px}

.objectives{display:grid;gap:8px;margin:18px 0 6px;padding:16px 18px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.objectives ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.objectives li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.95rem}
.objectives li::before{content:"";width:12px;height:12px;margin-top:6px;border-radius:3px;border:1.5px solid var(--accent);transform:rotate(45deg)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.toc button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.83rem;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent-line)}
.toc b{font-family:var(--font-display);color:var(--accent);margin-right:6px}

/* ——— Fiche (blocs) ——— */
.sec{margin-top:44px;scroll-margin-top:140px}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sec-num{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:3rem;line-height:.8;color:var(--accent);grid-row:span 2}
.sec-head h2{font-size:var(--fs-2xl)}
.sec-head .eyebrow{align-self:start}
.blocks{display:grid;gap:16px}
.blocks>p,.blocks .p{max-width:68ch}
.blocks h3{font-size:1.3rem;margin-top:14px;display:flex;align-items:baseline;gap:10px}
.blocks h3 small{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);letter-spacing:.08em}
.def{position:relative;padding:18px 20px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.def .k{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:10px}
.def .term{font-family:var(--font-display);font-size:1.35rem;font-weight:700;margin:4px 0 6px}
.tip{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:15px 16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line)}
.tip .ti{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--surface-3)}
.tip .ti svg{width:18px;height:18px}
.tip .tt{font-weight:700;font-size:.92rem;margin-bottom:3px}
.tip .tb{font-size:.95rem;color:var(--fg)}
.tip .tb p+p{margin-top:6px}
.tip.memo{background:var(--accent-soft);border-color:var(--accent-line)}
.tip.memo .ti{background:var(--accent);color:var(--accent-ink)}
.tip.memo .tt{color:var(--accent)}
.tip.piege{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.tip.piege .ti{background:var(--warn);color:var(--paper-ink)}
.tip.piege .tt{color:var(--warn)}
.tip.prof .ti{background:var(--fg);color:var(--bg)}
.tip.ex .ti{background:var(--good-soft);color:var(--good)}
.tip.ex .tt{color:var(--good)}
.tip.notaire .ti{background:var(--accent-deep);color:#fff}
.quote{position:relative;padding:16px 18px 16px 20px;border-radius:var(--r-m);background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow)}
.quote::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent-strong)}
.quote .ref{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#5A28DA;font-weight:600}
.quote .qt{font-family:var(--font-display);font-size:1.12rem;line-height:1.45;margin-top:6px;font-style:italic}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:70ch}
.list li{position:relative;padding-left:22px}
.list li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.list.num{counter-reset:n}
.list.num li{padding-left:34px}
.list.num li::before{counter-increment:n;content:counter(n);width:22px;height:22px;top:.1em;left:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:.72rem;color:var(--accent-ink);font-weight:700}
.tbl{overflow-x:auto;border-radius:var(--r-m);border:1px solid var(--line)}
.tbl table{width:100%;border-collapse:collapse;min-width:520px;font-size:.93rem}
.tbl th{text-align:left;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:650}
.vs{display:grid;gap:12px;position:relative}
@media (min-width:640px){.vs{grid-template-columns:1fr 1fr}}
.vs-col{padding:16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.vs-col h4{font-size:1.15rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.vs-col h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.vs-col:nth-child(2) h4::before{background:transparent;border:2px solid var(--accent)}
.vs-col ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.94rem}
.vs-badge{display:none}
@media (min-width:640px){.vs-badge{display:grid;place-items:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);font-family:var(--font-display);font-style:italic;font-weight:800;color:var(--accent);z-index:1}}
.chips-group{display:grid;gap:10px}
.chips-group+.chips-group{margin-top:6px}
.chips-label{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:550;cursor:pointer;transition:all .25s var(--ease)}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip-detail{padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);font-size:.95rem;animation:rise .35s var(--ease) both}
.chip-detail b{font-family:var(--font-display);font-size:1.1rem;display:block;margin-bottom:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;padding-bottom:16px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--accent-line);font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--accent);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;left:15px;top:30px;bottom:0;width:1px;background:var(--line-2)}
.steps li:last-child::after{display:none}
.steps b{display:block}
.acc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:-8px}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--font-mono);color:var(--accent);font-size:1.2rem;transition:transform .3s var(--spring)}
.acc[open] summary::after{transform:rotate(45deg)}
.acc .acc-b{padding:0 16px 16px;color:var(--fg);font-size:.95rem;animation:rise .35s var(--ease) both}
.tree{display:grid;gap:10px}
.tree-node{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;text-align:left;width:100%;transition:border-color .2s}
.tree-node:hover{border-color:var(--accent-line)}
.tree-node .tn{font-weight:700;display:flex;align-items:center;gap:8px}
.tree-node .tn::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.tree-node .td{font-size:.9rem;color:var(--muted);margin-top:4px}
.tree-kids{display:grid;gap:10px;margin-left:18px;padding-left:16px;border-left:1px dashed var(--line-2)}
.essentials{margin-top:46px;padding:22px;border-radius:var(--r-l);background:var(--fg);color:var(--bg)}
.essentials h2{font-size:var(--fs-xl);display:flex;align-items:center;gap:10px}
.essentials ol{margin:14px 0 0;padding-left:22px;display:grid;gap:8px}
.essentials li::marker{font-family:var(--font-mono);font-weight:700;color:var(--accent-strong)}
.next-cta{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}

/* ——— Flashcards ——— */
.deck-wrap{display:grid;gap:16px;justify-items:center}
.deck-top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--fs-s);color:var(--muted)}
.deck-top b{font-family:var(--font-mono);color:var(--fg)}
.deck{position:relative;width:100%;max-width:560px;height:min(62vh,360px);perspective:1400px;touch-action:pan-y}
.fcard{position:absolute;inset:0;cursor:pointer;transform-style:preserve-3d;transition:transform .7s var(--spring);will-change:transform}
.fcard.flipped{transform:rotateY(180deg)}
.fcard.dragging{transition:none}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-l);padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--line-2);overflow:auto}
.fface.front{background:radial-gradient(120% 80% at 0% 0%,var(--accent-soft),transparent 60%),var(--surface)}
.fface.back{transform:rotateY(180deg);background:var(--paper);color:var(--paper-ink);border-color:transparent;box-shadow:var(--shadow)}
.fface .fk{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.fface.back .fk{color:#5A28DA}
.fface .fq{font-family:var(--font-display);font-size:clamp(1.35rem,4.6vw,1.75rem);font-weight:650;line-height:1.2}
.fface .fa{font-size:1.02rem;line-height:1.55}
.fface .fhint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--faint)}
.fface.back .fhint{color:#7a6f8c}
.deck-ghost{position:absolute;inset:10px -8px -10px 8px;border-radius:var(--r-l);background:var(--surface-2);border:1px solid var(--line);transform:rotate(2.5deg);z-index:-1}
.deck-ghost.g2{inset:18px -14px -18px 14px;transform:rotate(5deg);opacity:.6;z-index:-2}
.swipe-tag{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .15s;z-index:3;pointer-events:none}
.swipe-tag.ok{right:18px;color:var(--good);border:2px solid var(--good);transform:rotate(8deg)}
.swipe-tag.ko{left:18px;color:var(--bad);border:2px solid var(--bad);transform:rotate(-8deg)}
.fcard.fly-right{transition:transform .45s var(--ease),opacity .45s;transform:translateX(130%) rotate(18deg);opacity:0}
.fcard.fly-left{transition:transform .45s var(--ease),opacity .45s;transform:translateX(-130%) rotate(-18deg);opacity:0}
.fcard.enter{animation:cardIn .5s var(--spring) backwards}
@keyframes cardIn{from{transform:translateY(30px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
.deck-actions .ko{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.deck-actions .ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.boxes{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.boxes span{display:inline-flex;align-items:center;gap:5px}
.boxes i{width:10px;height:10px;border-radius:3px;background:var(--surface-3)}
.boxes i.b2{background:var(--accent-deep)} .boxes i.b3{background:var(--accent)}

/* ——— Quiz ——— */
.quiz{max-width:680px}
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qbar .meter{flex:1}
.qbar .qn{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.qcard{padding:22px 20px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);animation:cardIn .45s var(--spring) both}
.qcard .qk{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.qcard .qt{font-family:var(--font-display);font-size:clamp(1.25rem,4.2vw,1.55rem);font-weight:650;line-height:1.25}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;font-size:.98rem;line-height:1.4;transition:border-color .2s,background .2s,transform .2s var(--spring)}
.opt:hover{border-color:var(--accent-line)}
.opt:active{transform:scale(.985)}
.opt .ol{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-3);font-family:var(--font-mono);font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.is-right{border-color:var(--good);background:var(--good-soft)}
.opt.is-right .ol{background:var(--good);color:var(--paper-ink)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .45s var(--ease)}
.opt.is-wrong .ol{background:var(--bad);color:var(--paper-ink)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tf .opt{grid-template-columns:1fr;text-align:center;font-weight:700;font-size:1.05rem;padding:16px}
.expl{margin-top:16px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);border-left:3px solid var(--accent);font-size:.95rem;animation:rise .4s var(--ease) both}
.expl .verdict{font-weight:800;margin-bottom:4px}
.expl .verdict.good{color:var(--good)} .expl .verdict.bad{color:var(--bad)}
.qnext{margin-top:16px;display:flex;justify-content:flex-end}
.result{display:grid;gap:18px;justify-items:center;text-align:center;padding:26px 18px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);animation:cardIn .5s var(--spring) both}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .rv b{font-family:var(--font-display);font-size:2.6rem;font-weight:800;line-height:1}
.ring .rv span{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.result h3{font-size:1.6rem}
.mistakes{width:100%;text-align:left;display:grid;gap:10px}
.mistake{padding:12px 14px;border-radius:var(--r-m);background:var(--bad-soft);font-size:.92rem}
.mistake b{display:block;margin-bottom:3px}
.mode-grid{display:grid;gap:12px}
@media (min-width:640px){.mode-grid{grid-template-columns:1fr 1fr}}

/* ——— Jeu de tri ——— */
.sort{max-width:640px}
.sort-stage{position:relative;min-height:190px;display:grid;place-items:center;margin:8px 0 16px}
.sort-item{width:100%;display:grid;justify-items:center;gap:10px;text-align:center;padding:24px 18px;border-radius:var(--r-l);background:radial-gradient(100% 90% at 50% 0%,var(--accent-soft),transparent 70%),var(--surface);border:1px solid var(--line-2);animation:popIn .55s var(--spring) both}
.sort-item .em{font-size:3rem;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.sort-item .it{font-family:var(--font-display);font-size:clamp(1.25rem,4.4vw,1.6rem);font-weight:650;line-height:1.2}
.sort-item.out-good{animation:outGood .5s var(--ease) both}
.sort-item.out-bad{animation:outBad .55s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(40px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes outGood{to{opacity:0;transform:translateY(-40px) scale(.9)}}
@keyframes outBad{30%{transform:translateX(-10px) rotate(-2deg)}60%{transform:translateX(10px) rotate(2deg)}100%{opacity:0;transform:translateY(30px) scale(.92)}}
.cats{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.cats.n3{grid-template-columns:1fr 1fr 1fr}
.cats .cat{min-height:58px;padding:10px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:.93rem;line-height:1.2;cursor:pointer;transition:transform .2s var(--spring),border-color .2s,background .2s}
.cats .cat:hover{border-color:var(--accent-line)}
.cats .cat:active{transform:scale(.95)}
.cats .cat.hit{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cats .cat.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cats .cat.answer{box-shadow:0 0 0 2px var(--good)}
.cats.n5 .cat:last-child{grid-column:1/-1}
@media (max-width:420px){.cats.n3{grid-template-columns:1fr}}
.sort-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-size:var(--fs-s);color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-weight:700;color:var(--warn)}
.streak.bump{animation:bump .4s var(--spring)}
@keyframes bump{50%{transform:scale(1.35)}}
.game-list{display:grid;gap:12px}
@media (min-width:640px){.game-list{grid-template-columns:1fr 1fr}}

/* ——— Cas pratiques ——— */
.case-list{display:grid;gap:12px}
.case-card{display:grid;gap:6px;text-align:left;padding:16px 18px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,transform .3s var(--spring)}
.case-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.case-card b{font-family:var(--font-display);font-size:1.2rem}
.case-card .done{color:var(--good);font-size:.8rem;font-weight:700}
.enonce{position:relative;padding:22px 20px;border-radius:var(--r-m);background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow)}
.enonce .ek{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#5A28DA;font-weight:600}
.enonce .et{font-family:var(--font-display);font-size:1.5rem;font-weight:700;margin:4px 0 10px}
.enonce p+p{margin-top:8px}
.enonce .eq{margin-top:14px;padding-top:12px;border-top:1px dashed #cbbfe0;font-weight:700}
.method{display:grid;gap:12px;margin-top:18px}
.mstep{border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.mstep-h{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mstep-h .mi{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--accent-line);font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--accent);flex:0 0 auto}
.mstep-h b{flex:1}
.mstep-b{padding:0 16px 16px 56px;font-size:.96rem;animation:rise .4s var(--ease) both}
.mstep-b p+p{margin-top:8px}
.mstep.locked .mstep-h{opacity:.6}
.think{width:100%;min-height:90px;resize:vertical;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);font:inherit;font-size:.95rem}
.think:focus{outline:none;border-color:var(--accent)}

/* ——— Lexique ——— */
.search{position:relative}
.search input{width:100%;min-height:50px;padding:12px 16px 12px 46px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font:inherit;font-size:1rem}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.gl{display:grid;gap:0;border-top:1px solid var(--line)}
.gl-item{display:grid;gap:4px;padding:14px 2px;border-bottom:1px solid var(--line)}
.gl-item .gt{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.gl-item .gt b{font-family:var(--font-display);font-size:1.18rem}
.gl-item .gd{font-size:.95rem;color:var(--fg);max-width:70ch}
.gl-letter{font-family:var(--font-display);font-style:italic;font-size:2rem;font-weight:800;color:var(--accent);padding:18px 0 4px;border-bottom:1px solid var(--line)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ——— Effets ——— */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;padding:10px 18px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:650;font-size:.92rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--spring);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:30px}}
.fx{position:fixed;inset:0;z-index:90;pointer-events:none}
.fx canvas{width:100%;height:100%}
.xp-pop{position:fixed;z-index:91;pointer-events:none;font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:1rem;text-shadow:0 2px 12px var(--glow);animation:xpUp 1.1s var(--ease) forwards}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:min(420px,100%);padding:28px 22px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--accent-line);text-align:center;display:grid;gap:12px;justify-items:center;box-shadow:0 30px 80px -30px var(--glow);animation:cardIn .6s var(--spring) both}
.modal-card h3{font-size:2rem}
.modal-card .crown{width:120px;height:120px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  body::before{animation:none}
}

/* ——— Schémas & outils ——— */
span.meter{display:block}
.blocks>*,.w>*,.acte-paper>*,.tab-panel>*,.wslot{min-width:0}
.gal-pick select{width:100%;min-width:0}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
@media (max-width:520px){.xp-chip span:nth-child(2){display:none}.brand-name{font-size:1.12rem}}
.w{display:grid;gap:14px;padding:18px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);min-width:0}
.w-head{display:grid;gap:3px}
.w-head b{font-family:var(--font-display);font-size:1.3rem;font-weight:700;line-height:1.15}
.w-head .muted{font-size:.9rem}
.w-card{padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);font-size:.95rem;animation:rise .35s var(--ease) both}
.w-card p+p{margin-top:6px}
.w-t{display:block;font-family:var(--font-display);font-size:1.18rem;font-weight:700;margin:4px 0 4px}
.w-note{font-size:.86rem;color:var(--muted)}
.seg-ctrl{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:22px;background:var(--bg-2);border:1px solid var(--line)}
.seg-ctrl button{flex:1 1 auto;padding:8px 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:.86rem;cursor:pointer;transition:all .3s var(--ease);white-space:nowrap}
.seg-ctrl button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--glow)}

/* pyramide */
.pyr{display:grid;gap:5px;justify-items:center;padding:4px 0}
.pyr-l{width:calc(54% + var(--i) * 15.33%);min-height:66px;border:0;display:grid;place-content:center;text-align:center;padding:10px 11%;cursor:pointer;color:#fff;
  clip-path:polygon(var(--in) 0,calc(100% - var(--in)) 0,100% 100%,0 100%);transition:transform .35s var(--spring),filter .25s;animation:pyrIn .7s var(--spring) backwards;animation-delay:calc(var(--i) * 110ms)}
.pl0{--in:33%;background:var(--accent-deep);min-height:84px;padding:26px 6% 10px}
.pl0 .pt{font-size:.88rem}
.pl1{--in:11%;background:var(--accent-strong)}
.pl2{--in:9%;background:var(--accent);color:var(--accent-ink)}
.pl3{--in:7.6%;background:var(--surface-3);color:var(--fg)}
.pyr-l .pt{font-weight:760;font-size:.95rem;line-height:1.15}
.pyr-l .ps{font-family:var(--font-mono);font-size:.66rem;opacity:.85;margin-top:2px}
.pyr-l:hover{filter:brightness(1.1)}
.pyr-l.on{transform:scale(1.035);filter:brightness(1.15) saturate(1.1)}
@keyframes pyrIn{from{opacity:0;transform:translateY(-16px) scaleX(.86)}}
.pyr-aside{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:.88rem;color:var(--muted);padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2)}
.pyr-aside svg{width:18px;height:18px;color:var(--accent);margin-top:2px}

/* fabrication de la loi */
.proc{list-style:none;margin:0;padding:0;display:grid}
.proc-s{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:14px;transition:opacity .4s}
.proc-s::after{content:"";position:absolute;left:19px;top:40px;bottom:2px;width:2px;background:var(--line-2);transition:background .4s}
.proc-s:last-child::after{display:none}
.running .proc-s{opacity:.45}
.running .proc-s.done{opacity:.85}
.running .proc-s.on{opacity:1}
.proc-s.done::after{background:var(--accent)}
.proc-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);font-family:var(--font-mono);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted);transition:all .45s var(--spring)}
.proc-s.opt .proc-dot{border-style:dashed}
.proc-s.done .proc-dot{border-color:var(--accent);color:var(--accent)}
.proc-s.on .proc-dot{background:var(--accent);border-color:var(--accent);border-style:solid;color:var(--accent-ink);transform:scale(1.12);box-shadow:0 0 0 6px var(--accent-soft),0 0 26px var(--glow)}
.proc-c{padding-top:7px;min-width:0}
.proc-c p{font-size:.92rem;color:var(--muted);margin-top:2px}
.proc-s.on .proc-c p{color:var(--fg)}
.pingpong{display:flex;align-items:center;gap:8px;margin-top:8px}
.pingpong span{padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);font-size:.78rem;font-weight:650;transition:all .2s}
.pingpong span.lit{background:var(--accent);color:var(--accent-ink);border-color:transparent;transform:scale(1.06)}
.pingpong i{flex:0 0 26px;height:2px;background:var(--line-2)}

/* loi dans le temps */
.tl-toggles{display:flex;flex-wrap:wrap;gap:8px}
.tl-toggles button{border:1px solid var(--line-2);background:var(--bg-2);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:620;cursor:pointer;transition:all .25s var(--ease)}
.tl-toggles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tl{display:grid;gap:14px}
.tl-axis{display:grid;grid-template-columns:1fr auto 1fr;font-family:var(--font-mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tl-axis span:last-child{text-align:right}
.tl-now{color:var(--accent);font-weight:700}
.tl-row{display:grid;gap:6px}
.tl-row:last-child{padding-bottom:16px}
.tl-label b{font-size:.92rem}
.tl-label span{font-size:.78rem;color:var(--muted);margin-left:6px}
.tl-track{position:relative;height:18px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line)}
.tl-track::after{content:"";position:absolute;left:50%;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.seg{position:absolute;top:3px;bottom:3px;border-radius:6px;transition:background .5s var(--ease),box-shadow .5s}
.seg.old{background:repeating-linear-gradient(135deg,var(--faint) 0 4px,transparent 4px 8px)}
.seg.new{background:var(--accent);box-shadow:0 0 12px -2px var(--glow)}
.tl-mark{position:absolute;top:100%;transform:translateX(-50%);font-size:.64rem;font-style:normal;color:var(--muted);margin-top:5px;font-family:var(--font-mono);white-space:nowrap}
.tl-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.82rem;color:var(--muted)}
.tl-legend .seg{position:relative;display:inline-block;width:26px;height:10px;top:0;margin-right:6px;vertical-align:middle}

/* balance */
.bal-svg{width:100%;max-width:440px;justify-self:center;height:auto;overflow:visible}
.bal-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bal-items{display:grid;gap:6px;margin-top:6px}
.bal-it{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 6px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;font-size:.84rem;line-height:1.3;transition:all .25s var(--ease);opacity:.55}
.bal-it b{font-family:var(--font-mono);font-size:.76rem;font-weight:600}
.bal-it[aria-pressed="true"]{opacity:1;background:var(--accent-soft);border-color:var(--accent-line)}
.bal-it.neg[aria-pressed="true"]{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.bal-sum{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted)}
.bal-sum b{font-family:var(--font-mono);color:var(--fg);margin-left:4px}

/* démembrement */
.dem-board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dem-z{border-radius:var(--r-m);border:1px dashed var(--line-2);padding:10px;min-height:170px;display:grid;align-content:start;gap:8px;background:var(--bg-2);transition:opacity .35s}
.dem-z.empty-z{opacity:.45}
.dem-h{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.dem-slot{display:grid;gap:8px}
.dem-tok{position:relative;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--accent-line);box-shadow:0 8px 18px -12px var(--glow)}
.dem-tok svg{width:22px;height:22px;color:var(--accent)}
.dem-tok b{display:block;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.dem-tok small{display:block;font-size:.72rem;color:var(--muted);line-height:1.25}
.dem-tok .lim{display:none;position:absolute;top:-8px;right:8px;font-style:normal;font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--warn);color:var(--paper-ink)}
.dem-tok.limited .lim{display:block}
.dem-tok.ghost{opacity:.5;border-style:dashed;box-shadow:none}
.dem-off{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.85rem}
.dem-off:empty{display:none}
.dem-off .dem-tok{flex:1 1 200px}

/* catégories d'immeubles */
:root{--c-nat:#A283FF;--c-dest:#F1C36E;--c-obj:#6CC6E0;--c-meu:#D8D0E6;--c-ink:#0E0A16}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--c-nat:#6B3BEA;--c-dest:#B7791F;--c-obj:#1A7F9C;--c-meu:#7D7591;--c-ink:#FFFFFF}}
:root[data-theme="light"]{--c-nat:#6B3BEA;--c-dest:#B7791F;--c-obj:#1A7F9C;--c-meu:#7D7591;--c-ink:#FFFFFF}
:root[data-theme="dark"]{--c-nat:#A283FF;--c-dest:#F1C36E;--c-obj:#6CC6E0;--c-meu:#D8D0E6;--c-ink:#0E0A16}
.farm-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.farm{width:100%;height:auto;display:block}
.pin{cursor:pointer;outline:none}
.pin .pin-c{fill:var(--fg);stroke:var(--bg);stroke-width:2;transition:fill .35s,stroke .2s}
.pin text{font-family:var(--font-mono);font-size:10px;font-weight:700;fill:var(--bg);pointer-events:none}
.pin-pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pinPulse 2.6s ease-out infinite}
@keyframes pinPulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.pin.c-nature .pin-c{fill:var(--c-nat)} .pin.c-destination .pin-c{fill:var(--c-dest)} .pin.c-objet .pin-c{fill:var(--c-obj)} .pin.c-meuble .pin-c{fill:var(--c-meu)}
.pin[class*="c-"] text{fill:var(--c-ink)}
.pin.sel .pin-c,.pin:focus-visible .pin-c{stroke:var(--fg);stroke-width:3}
.pin.ok .pin-c{stroke:var(--good);stroke-width:3.5} .pin.ko .pin-c{stroke:var(--bad);stroke-width:3.5}
.pin.ok .pin-pulse,.pin.ko .pin-pulse{display:none}
.farm-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.cat-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cat-dot.c-nature,.tag.c-nature{background:var(--c-nat)} .cat-dot.c-destination,.tag.c-destination{background:var(--c-dest)} .cat-dot.c-objet,.tag.c-objet{background:var(--c-obj)} .cat-dot.c-meuble,.tag.c-meuble{background:var(--c-meu)}
.tag.c-nature,.tag.c-destination,.tag.c-objet,.tag.c-meuble{color:var(--c-ink);border-color:transparent}
.farm-card .cats{grid-template-columns:1fr 1fr}

/* acte authentique */
.acte-stage{display:grid;gap:18px;align-items:center}
@media (min-width:640px){.acte-stage{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.acte-doc{position:relative;aspect-ratio:3/4;max-width:250px;width:100%;justify-self:center;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:8px}
.acte-k{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#5A28DA}
.acte-t{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:.1em}
.acte-lines{display:grid;gap:8px;margin-top:6px}
.acte-lines i{display:block;height:6px;border-radius:3px;background:#E6DEF1;width:100%}
.acte-sign{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--font-display);font-style:italic;font-size:.82rem;color:#6D6380}
.acte-slot{position:relative;width:96px;height:30px;border-bottom:1px solid #B9AED0}
.stamped .acte-slot::after{content:"Me J. la Goat";position:absolute;left:0;bottom:3px;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:.9rem;color:#3D1494;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:sign 1s .15s var(--ease) forwards}
@keyframes sign{to{clip-path:inset(0 0 0 0)}}
.acte-seal{position:absolute;right:10px;bottom:46px;width:88px;height:88px;opacity:0;pointer-events:none}
.stamped .acte-seal{animation:sealDrop .75s var(--spring) .45s forwards}
@keyframes sealDrop{0%{opacity:0;transform:scale(2.3) rotate(-28deg)}60%{opacity:1;transform:scale(.9) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.stamped{animation:docShake .4s .85s ease}
@keyframes docShake{30%{transform:translateY(4px)}60%{transform:translateY(-1px)}}
.acte-pub{position:absolute;left:16px;top:44%;padding:6px 12px;border:3px solid #D2385A;color:#D2385A;font-family:var(--font-mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;border-radius:6px;opacity:0;transform:rotate(-12deg) scale(2.2);pointer-events:none}
.published .acte-pub{animation:pubIn .55s var(--spring) forwards}
@keyframes pubIn{to{opacity:.92;transform:rotate(-12deg) scale(1)}}
.acte-fx{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acte-fx li{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);opacity:.62;transition:all .55s var(--ease)}
.acte-fx li b{display:block}
.acte-fx li span{font-size:.86rem;color:var(--muted)}
.acte-fx li.lit{opacity:1;border-color:var(--accent-line);background:var(--accent-soft);transform:translateX(4px)}

/* cadastre */
.cad-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cad{width:100%;height:auto;display:block}
.parc{cursor:pointer;outline:none}
.parc polygon{fill:var(--bg-2);stroke:var(--fg);stroke-opacity:.5;stroke-width:1.2;transition:fill .25s,fill-opacity .25s}
.parc text{font-family:var(--font-mono);font-size:9px;font-weight:600;fill:var(--fg);pointer-events:none}
.parc:hover polygon,.parc:focus-visible polygon{fill:var(--accent-soft)}
.parc.on polygon{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:2.2;stroke-opacity:1}
.parc.ok polygon{fill:var(--good);fill-opacity:.5}
.parc.ko polygon{fill:var(--bad);fill-opacity:.5}
.cad-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);align-items:center}
.lg-b{display:inline-block;width:16px;height:11px;margin-right:6px;vertical-align:-1px;background:repeating-linear-gradient(45deg,var(--fg) 0 1.2px,transparent 1.2px 4px);opacity:.65;border:1px solid var(--line-2)}
.cad-ref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.cad-ref{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cad-ref span{padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.cad-ref small{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cad-ref b{font-family:var(--font-mono);font-size:.86rem;overflow-wrap:anywhere}

/* arbre de qualification */
.q-path{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.q-path:empty{display:none}
.q-path li{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;font-size:.84rem;padding:8px 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);animation:rise .35s var(--ease) both}
.q-path li b{color:var(--accent)}
.q-ans{display:grid;gap:8px;margin-top:12px}
.q-ans .btn{justify-content:flex-start;text-align:left;border-radius:14px;line-height:1.3}
.q-res{border-color:var(--accent-line);background:var(--accent-soft)}

/* champs */
.field{display:grid;gap:4px;min-width:0}
.field label{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.dg.gs{margin-left:10px}

.dg.g-a,.cv-cell.g-a{background:var(--accent);color:var(--accent-ink)}

.cv-cell span{font-size:.7rem;opacity:.85}
.conv-acte{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.92rem}
.rev-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.rev-eq{grid-column:1/-1;font-size:1rem}

.ap-sub{font-weight:700;margin-top:6px}
.ap-tbl{overflow-x:auto}
.acte-paper table{width:100%;border-collapse:collapse;font-size:.86rem}
.acte-paper th{text-align:left;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:#6D6380;border-bottom:1px solid #D9CFE8;padding:6px 8px;white-space:nowrap}

<script>
(function(){
'use strict';
/* =========================================================
   JADE LA GOAT — moteur
   Les cours sont déclarés plus bas, chacun dans son propre
   bloc script : JLG.subject(), JLG.chapter(), JLG.glossary(), JLG.log()
   ========================================================= */
const JLG = window.JLG = window.JLG || {};
JLG.subjects = []; JLG.chapters = []; JLG.gloss = []; JLG.logs = []; JLG.widgets = {};
JLG.subject = s => { JLG.subjects.push(s); };
JLG.chapter = c => { JLG.chapters.push(c); };
JLG.glossary = list => { JLG.gloss.push(...list); };
JLG.log = l => { JLG.logs.push(l); };
JLG.widget = (name, fn) => { JLG.widgets[name] = fn; };

/* ---------- utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, '');
const norm = s => strip(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function shuffle(a, rnd = Math.random){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seeded(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pad2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fmtDate = iso => { try { return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}); } catch(e){ return iso; } };
const fmtNum = n => Number(n).toLocaleString('fr-FR');
const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const plural = (n, w, p) => n + ' ' + (n > 1 ? (p || w + 's') : w);

/* ---------- icônes ---------- */
const IC = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v14H6.5A1.5 1.5 0 0 0 5 18.5z"/><path d="M5 18.5A1.5 1.5 0 0 0 6.5 20H19"/><path d="M9 7h6"/>',

  map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',

  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',

  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 11.5h1M11.5 11.5h1M14.5 11.5h1M8.5 15h1M11.5 15h1M14.5 15h1M8.5 18h1M11.5 18h4"/>',
  tree:'<circle cx="12" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M12 7v4M12 11H6v6M12 11h6v6"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',

  house:'<path d="M3 11 12 4l9 7"/><path d="M6 9.5V20h12V9.5"/><rect x="10" y="13" width="4" height="7"/>'
};
const icon = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ---------- sceau (forme de cire générée) ---------- */
function waxPath(cx, cy, r, bumps = 14, amp = .055, seed = 3){
  const rnd = seeded(seed); let d = '';
  const n = 140;
  const ph = rnd() * 6;
  for (let i = 0; i <= n; i++){
    const a = i / n * Math.PI * 2;
    const rr = r * (1 + amp * Math.sin(a * bumps + ph) + amp * .45 * Math.sin(a * (bumps * 2 + 1) + ph * 2));
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
  }
  return d + 'Z';
}
function sealSVG(opts = {}){
  const id = 'sg' + Math.random().toString(36).slice(2, 7);
  const ring = opts.ring !== false;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Sceau de Jade la Goat">
  <defs>
    <radialGradient id="${id}a" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#C6AEFF"/><stop offset=".45" stop-color="#7C4DFF"/><stop offset="1" stop-color="#3A138F"/></radialGradient>
    <radialGradient id="${id}b" cx="50%" cy="50%" r="50%"><stop offset=".7" stop-color="#2A0C6E" stop-opacity="0"/><stop offset="1" stop-color="#1A0646" stop-opacity=".55"/></radialGradient>
    <path id="${id}c" d="M100 100 m-68 0 a68 68 0 1 1 136 0 a68 68 0 1 1 -136 0"/>
  </defs>
  <g class="seal-ripple"><circle cx="100" cy="100" r="86" fill="none" stroke="#9D7BFF" stroke-width="2" opacity=".6"/></g>
  <g class="seal-stamp">

    <path d="${waxPath(100, 100, 88, 13, .05, 7)}" fill="url(#${id}a)"/>
    <path d="${waxPath(100, 100, 88, 13, .05, 7)}" fill="url(#${id}b)"/>

    ${ring ? `<g class="seal-ring"><text font-family="JetBrains Mono, monospace" font-size="9.6" letter-spacing="3.1" fill="#F3EDFF" fill-opacity=".85"><textPath href="#${id}c">JADE LA GOAT · BTS NOTARIAT · SCEAU OFFICIEL ·</textPath></text></g>` : ''}
    <path d="M78 66 C70 52 74 40 86 36 C80 46 82 56 90 62 M122 66 C130 52 126 40 114 36 C120 46 118 56 110 62" fill="none" stroke="#F3EDFF" stroke-width="3.2" stroke-linecap="round"/>
    <text x="100" y="128" text-anchor="middle" font-family="Bodoni Moda, Didot, Georgia, serif" font-style="italic" font-weight="800" font-size="64" fill="#F8F4FF">J</text>
    <text x="100" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" letter-spacing="2.6" fill="#E9DEFF">LA GOAT</text>
    <path d="M64 70 Q100 30 136 70" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>`;
}

/* ---------- état (progression locale) ---------- */
const KEY = 'jlg.v1';
const defaults = () => ({xp:0, days:{}, last:null, cards:{}, quiz:{}, sorts:{}, cases:{}, daily:{}, seenLog:null, theme:null});
let S = (function(){ try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaults(), JSON.parse(raw)); } catch(e){} return defaults(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function markActive(){ S.days[dayKey()] = true; save(); }
function streak(){
  let c = 0; const d = new Date();
  for (let i = 0; i < 400; i++){ const k = dayKey(d); if (S.days[k]) c++; else if (i > 0) break; d.setDate(d.getDate() - 1); }
  return c;
}

/* ---------- niveaux & XP ---------- */
const LEVELS = [[0,'Chevreau stagiaire'],[150,'Chèvre clerc'],[400,'Chèvre juriste'],[800,'Chèvre notaire'],[1400,'LA GOAT'],[2200,'GOAT légendaire'],[3200,'GOAT éternelle']];
function levelOf(xp){
  let i = 0; LEVELS.forEach((l, k) => { if (xp >= l[0]) i = k; });
  const cur = LEVELS[i][0], next = LEVELS[i + 1] ? LEVELS[i + 1][0] : null;
  return {i, n:i + 1, name:LEVELS[i][1], cur, next, pct: next ? (xp - cur) / (next - cur) : 1};
}
function addXP(n, ev){
  const before = levelOf(S.xp).i;
  S.xp += n; markActive(); popXP('+' + n + ' XP', ev); updateChip();
  const after = levelOf(S.xp).i;
  if (after > before) setTimeout(() => levelUp(after), 450);
}
function popXP(txt, ev){
  if (reduced()) return;
  const el = document.createElement('div'); el.className = 'xp-pop'; el.textContent = txt;
  let x = innerWidth / 2, y = innerHeight / 2;
  if (ev && ev.clientX != null && (ev.clientX || ev.clientY)){ x = ev.clientX; y = ev.clientY; }
  else if (ev && ev.target && ev.target.getBoundingClientRect){ const r = ev.target.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  el.style.left = x + 'px'; el.style.top = (y - 10) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function updateChip(){
  const lv = levelOf(S.xp);
  $$('.xp-chip').forEach(c => { c.innerHTML = `<span class="lvl">${lv.n}</span><span>${esc(lv.name)}</span><span class="xpv">${fmtNum(S.xp)} XP</span>`; c.setAttribute('aria-label', `Niveau ${lv.n}, ${lv.name}, ${S.xp} XP — voir ma progression`); });
}
function levelUp(i){
  confetti(160);
  modal(`<div class="crown">${sealSVG({ring:false})}</div>
    <span class="eyebrow">Niveau ${i + 1} débloqué</span>
    <h3>${esc(LEVELS[i][1])}</h3>
    <p class="muted">${i >= 4 ? 'Tu es officiellement la GOAT. Le Code civil tremble.' : 'Tu montes en grade. Prochain palier : ' + esc((LEVELS[i + 1] || LEVELS[i])[1]) + '.'}</p>
    <button class="btn btn-primary" data-close>Continuer</button>`);
}

/* ---------- toasts, modale, confettis ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function modal(html){
  const m = $('#modal'); m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; };
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) close(); };
  const b = $('[data-close]', m); if (b) b.focus();
  return close;
}
function confetti(n = 120){
  if (reduced()) return;
  const fx = $('#fx'); const cv = document.createElement('canvas'); fx.appendChild(cv);
  const dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--accent-strong').trim(), cs.getPropertyValue('--fg').trim(), '#C9B6FF', cs.getPropertyValue('--warn').trim()];
  const P = Array.from({length:n}, () => ({x:innerWidth / 2 + (Math.random() - .5) * 80, y:innerHeight * .38, vx:(Math.random() - .5) * 13, vy:-Math.random() * 13 - 4, r:Math.random() * Math.PI, vr:(Math.random() - .5) * .35, w:5 + Math.random() * 6, h:8 + Math.random() * 8, c:cols[Math.floor(Math.random() * cols.length)]}));
  let t0 = performance.now();
  (function frame(t){
    const dt = Math.min(32, t - t0) / 16; t0 = t;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = 0;
    P.forEach(p => { p.vy += .35 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.y < innerHeight + 30){ alive++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore(); } });
    if (alive) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

function chapterProgress(c){
  const parts = [];
  if (c.flashcards && c.flashcards.length){ const k = c.flashcards.filter((f, i) => (S.cards[c.id + ':' + i] || 0) >= 2).length; parts.push(k / c.flashcards.length); }
  if (c.quiz && c.quiz.length){ parts.push((S.quiz[c.id] && S.quiz[c.id].best) || 0); }
  if (c.sorts && c.sorts.length){ parts.push(c.sorts.reduce((a, g) => a + (S.sorts[g.id] || 0), 0) / c.sorts.length); }
  if (c.cases && c.cases.length){ parts.push(c.cases.filter(k => S.cases[k.id]).length / c.cases.length); }
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;

function viewLexique(){
  return {html:`<div class="eyebrow">Vocabulaire</div><h1 style="font-size:var(--fs-3xl);margin:6px 0 10px">Lexique</h1><p class="lead">Les mots-clés de tes cours, définis simplement. Tape un mot pour filtrer.</p>

  <div class="filters" id="glf"><button aria-pressed="true" data-f="">Tout</button>${sortedSubjects().map(s => `<button aria-pressed="false" data-f="${s.id}">${esc(s.short)}</button>`).join('')}</div>
  <p class="muted" id="glc" style="font-size:.85rem"></p>
  <div class="gl" id="glList"></div>`,
  mount(v){
    let f = '', q = '';
    const list = JLG.gloss.slice().sort((a, b) => a.t.localeCompare(b.t, 'fr', {sensitivity:'base'}));
    const hi = s => { if (!q) return s; const i = norm(s).indexOf(norm(q)); if (i < 0) return s; return s.slice(0, i) + '<mark>' + s.slice(i, i + q.length) + '</mark>' + s.slice(i + q.length); };
    const draw = () => {
      const nq = norm(q);
      const items = list.filter(g => (!f || [].concat(g.s).includes(f)) && (!nq || norm(g.t).includes(nq) || norm(g.d).includes(nq)));
      $('#glc', v).textContent = items.length + (items.length > 1 ? ' définitions' : ' définition');
      let L = '', out = '';
      items.forEach(g => { const l = norm(g.t).charAt(0).toUpperCase(); if (l !== L && !nq){ L = l; out += `<div class="gl-letter">${l}</div>`; }
        const tags = [].concat(g.s).map(subj).filter(Boolean).map(s => `<span class="tag plain">${esc(s.short)}</span>`).join('');
        out += `<div class="gl-item"><div class="gt"><b>${hi(esc(g.t))}</b>${tags}${g.ref ? `<span class="mono faint">${esc(g.ref)}</span>` : ''}</div><div class="gd">${g.d}</div></div>`; });
      $('#glList', v).innerHTML = out || '<div class="empty">Aucun mot ne correspond. Essaie un autre terme.</div>';
    };
    $('#glq', v).addEventListener('input', e => { q = e.target.value.trim(); draw(); });
    $('#glf', v).addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; f = b.dataset.f; $$('#glf button', v).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    draw();
  }};
}

/* =================== FLASHCARDS =================== */
const pick = a => a[Math.floor(Math.random() * a.length)];
function runCards(el, deck, opt = {}){
  if (!deck.length){ el.innerHTML = '<div class="empty">Pas encore de flashcards ici.</div>'; return; }
  const key = x => x.c.id + ':' + x.i;
  const box = x => S.cards[key(x)] || 0;
  let queue = [], idx = 0, known = 0, review = 0;
  const counts = () => { let a = 0, b = 0, c = 0; deck.forEach(x => { const v = box(x); if (v >= 3) c++; else if (v === 2) b++; else a++; }); return [a, b, c]; };
  function start(onlyWeak){
    let d = onlyWeak ? deck.filter(x => box(x) < 2) : deck.slice();
    if (!d.length) d = deck.slice();
    queue = shuffle(d).sort((a, b) => box(a) - box(b)); idx = 0; known = 0; review = 0; draw();
  }
  function draw(){
    if (idx >= queue.length) return finish();
    const x = queue[idx]; const [b1, b2, b3] = counts();
    el.innerHTML = `<div class="deck-wrap">
      <div class="deck-top"><span>Carte <b>${idx + 1}</b>/${queue.length}</span><span class="boxes" aria-label="Avancement"><span><i></i>${b1}</span><span><i class="b2"></i>${b2}</span><span><i class="b3"></i>${b3} maîtrisées</span></span></div>
      <div class="deck">
        <div class="deck-ghost g2"></div><div class="deck-ghost"></div>
        <span class="swipe-tag ko">À revoir</span><span class="swipe-tag ok">Je savais</span>
        <div class="fcard enter" tabindex="0" role="button" aria-label="Retourner la carte">
          <div class="fface front"><div class="fk">${esc(x.c.kicker)}</div><div class="fq">${x.f.q}</div><div class="fhint">Touche pour voir la réponse</div></div>
          <div class="fface back"><div class="fk">Réponse</div><div class="fa">${x.f.a}</div><div class="fhint">Glisse à droite si tu savais, à gauche sinon</div></div>
        </div>
      </div>
      <div class="deck-actions"><button class="btn ko" data-k="0">${icon('x')}À revoir</button><button class="btn ok" data-k="1">${icon('check')}Je savais</button></div>
    </div>`;
    const card = $('.fcard', el), tOk = $('.swipe-tag.ok', el), tKo = $('.swipe-tag.ko', el);
    let down = false, sx = 0, sy = 0, dx = 0, moved = false, locked = false;
    const flipped = () => card.classList.contains('flipped');
    card.addEventListener('click', () => { if (moved){ moved = false; return; } card.classList.toggle('flipped'); });
    card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); card.classList.toggle('flipped'); } if (e.key === 'ArrowRight') decide(1); if (e.key === 'ArrowLeft') decide(0); });
    card.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; dx = 0; moved = false; });
    card.addEventListener('pointermove', e => {
      if (!down) return; dx = e.clientX - sx; const dy = e.clientY - sy;
      if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){ moved = true; card.classList.add('dragging'); try { card.setPointerCapture(e.pointerId); } catch(err){} }
      if (moved){ card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)${flipped() ? ' rotateY(180deg)' : ''}`; tOk.style.opacity = clamp(dx / 90, 0, 1); tKo.style.opacity = clamp(-dx / 90, 0, 1); }
    });
    const up = () => { if (!down) return; down = false; card.classList.remove('dragging');
      if (moved && Math.abs(dx) > 90){ decide(dx > 0 ? 1 : 0); }
      else { card.style.transform = ''; tOk.style.opacity = 0; tKo.style.opacity = 0; } };
    card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
    $$('.deck-actions [data-k]', el).forEach(b => b.addEventListener('click', e => decide(+b.dataset.k, e)));
    function decide(k, ev){
      if (locked) return; locked = true;
      const v = box(x); S.cards[key(x)] = k ? Math.min(3, Math.max(2, v + 1)) : 1; save();
      if (k){ known++; addXP(4, ev || {target:card}); } else { review++; addXP(1, ev || {target:card}); }
      card.style.transform = ''; card.classList.add(k ? 'fly-right' : 'fly-left');
      setTimeout(() => { idx++; draw(); }, reduced() ? 0 : 380);
    }
    card.focus({preventScroll:true});
  }
  function finish(){
    const weak = deck.filter(x => box(x) < 2).length;
    if (review === 0) confetti(90);
    el.innerHTML = `<div class="result">
      <div class="eyebrow">${esc(opt.title || 'Flashcards')}</div>
      <h3>${review === 0 ? 'Sans faute !' : 'Paquet terminé'}</h3>
      <p class="muted">${known} su${known > 1 ? 'es' : 'e'} · ${review} à revoir · ${deck.length - weak}/${deck.length} cartes maîtrisées au total</p>
      <div class="btn-row" style="justify-content:center">${weak ? `<button class="btn btn-primary" id="cw">${icon('refresh')}Revoir les ${weak} cartes fragiles</button>` : ''}<button class="btn" id="ca">${icon('cards')}Tout repasser</button></div>
    </div>`;
    const w = $('#cw', el); if (w) w.onclick = () => start(true);
    $('#ca', el).onclick = () => start(false);
  }
  start(false);
}

function quizHome(el, c){

  el.innerHTML = `<div class="quiz"><div class="panel" style="display:grid;gap:12px">
