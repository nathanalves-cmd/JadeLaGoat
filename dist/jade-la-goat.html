<script>
JLG.chapter({
  id:'immo1', subject:'immo', order:1, num:'S1', added:'2026-10-06', minutes:35,
  kicker:'Séance 1', short:'Opérations immobilières & notaire', title:'Les opérations immobilières et le rôle du notaire', titleHtml:'Les opérations immobilières <em>et le rôle du notaire</em>',
  intro:'Une opération immobilière, c’est le quotidien d’une étude. Ici, tu apprends à la qualifier, à savoir quand le notaire est obligatoire, à reconnaître les trois sortes d’immeubles, et à rédiger une clause « désignation ».',
  objectives:['Définir et qualifier une opération immobilière', 'Appréhender la diversité des opérations immobilières', 'Présenter le rôle du notaire dans une opération immobilière', 'Savoir rédiger une clause « désignation »'],
  prereq:'le statut d’officier public et ministériel et la mission de service public du notaire (Bloc 1, Activité 1) ; les biens (Bloc 7, Notion 6).',
  traps:[
    {t:'1 hectare = 10 000 m²', h:'Et non 1 000 m², comme l’écrit par erreur le rappel de ton cours. 1 ha = 100 a = 10 000 m² ; 1 a = 100 m² ; 1 ca = 1 m².'},
    {t:'CSI = contribution de SÉCURITÉ immobilière', h:'Ton cours l’appelle une fois « contribution sociale immobilière » : c’est une coquille. Le bon nom est contribution de sécurité immobilière.'},
    {t:'Bail et notaire', h:'Le bail n’est obligatoirement notarié que s’il dure plus de 12 ans, car il doit alors être publié au service de la publicité foncière.'},
    {t:'Le fonds de commerce est un meuble', h:'Bien meuble incorporel : sa vente n’exige pas le notaire.'},
    {t:'Même propriétaire, sinon pas d’immeuble par destination', h:'Le tracteur du fermier locataire n’est pas un immeuble par destination de la ferme : il n’appartient pas au propriétaire du fonds.'},
    {t:'Récolte coupée = meuble', h:'Dès que les grains sont coupés, même s’ils ne sont pas encore enlevés, ils sont meubles (art. 520).'},
    {t:'Surface habitable ≠ contenance', h:'La contenance, c’est la surface du terrain cadastré, en ha, a, ca. Une maison de 175 m² peut être bâtie sur 1 a 63 ca.'},
    {t:'Le plan cadastral ne prouve pas la propriété', h:'C’est un document à finalité fiscale : il identifie les parcelles, il ne garantit pas qui en est propriétaire.'}
  ],
  sections:[
    {id:'operations', n:'1', eyebrow:'Qualifier', title:'Les différentes opérations immobilières', blocks:[
      {t:'def', term:'Opération immobilière', h:'Une action relative à un <b>immeuble</b>, c’est-à-dire une chose qui ne se déplace pas (terrain, forêt, verger, maison, local, usine, ferme, immeuble à construire…), réalisée par une ou plusieurs personnes.'},
      {t:'h3', h:'Les trois situations principales'},
      {t:'table', head:['Situation', 'Ce qui se passe', 'Exemples du cours'], rows:[
        ['Mutation à <b>titre onéreux</b>', 'La propriété (ou une partie) est transférée contre un <b>prix</b> (on parle de <b>produit</b>) ou une <b>soulte</b> en cas d’échange', 'Vente d’une maison, construction d’un ensemble en copropriété ou d’un lotissement, échange de terrains ruraux, cession d’une part indivise d’un local'],
        ['Mutation à <b>titre gratuit</b>', 'La propriété est transférée <b>sans contrepartie financière</b>, parfois contre un faible avantage', 'Héritage de l’usufruit d’un appartement, donation d’un terrain agricole, donation d’une ferme à charge de garder le cheptel, legs d’une parcelle boisée à charge de l’entretenir, partage après divorce, licitation après décès'],
        ['<b>Location</b> (bail)', 'Pas de transfert de propriété : le bailleur laisse l’<b>usage</b> du bien au locataire contre un <b>loyer</b> (on parle de <b>fruits</b>)', 'Bail d’habitation nu ou meublé, local professionnel, bail mixte, bail commercial, bail rural, convention d’occupation précaire']]},
      {t:'tip', k:'piege', h:'Une donation peut imposer une charge au bénéficiaire. Mais si l’avantage demandé n’est pas <b>moindre</b> que ce qui est donné, l’opération est <b>requalifiée en mutation à titre onéreux</b>.'},
      {t:'tip', k:'memo', h:'La vente rapporte un <b>prix</b> : c’est un <b>produit</b>. La location rapporte des <b>loyers</b> : ce sont des <b>fruits</b>, versés périodiquement.'},
      {t:'h3', h:'Deux autres actions juridiques'},
      {t:'vs', a:{title:'Prise de garantie', items:['Le prêteur grève l’immeuble d’une <b>sûreté</b> pour s’assurer d’être remboursé', 'Hypothèque <b>conventionnelle</b> (issue d’un contrat), <b>légale</b> (issue de la loi, ex. : celle du prêteur de deniers), <b>judiciaire</b> (issue d’un jugement)']}, b:{title:'Constitution de servitude', items:['L’immeuble est grevé d’une <b>charge</b> au profit d’un voisin : le <b>fonds servant</b> la subit, le <b>fonds dominant</b> en profite', 'Servitude de passage, d’échelle (poser une échelle chez le voisin pour entretenir un mur bâti en limite), de tréfonds (canalisations dans le sous-sol)']}},
      {t:'widget', w:'qualif'},
      {t:'h3', h:'Le rôle du notaire'},
      {t:'p', h:'Quand il est requis, le <b>notaire</b>, <b>officier public</b>, juriste diplômé d’État spécialisé notamment en droit immobilier, a d’abord un <b>devoir de conseil et d’information</b>.'},
      {t:'list', items:['Il <b>éclaire les parties</b> : il leur explique l’étendue de leurs engagements et les effets juridiques de l’acte.', 'Il vérifie que leur <b>consentement est libre</b>, c’est-à-dire non vicié par l’<b>erreur</b>, le <b>dol</b> ou la <b>violence</b>, et qu’elles sont saines d’esprit.', 'Il propose l’<b>acte le moins onéreux</b> à ses clients.', 'Il collecte pour l’État la <b>taxe de publicité foncière (TPF)</b>, en plus de ses <b>émoluments</b> et <b>débours</b>.']},
      {t:'quote', ref:'Ordonnance du 2 novembre 1945, article 1er', h:'« Les notaires sont les officiers publics établis pour recevoir tous les actes et contrats auxquels les parties doivent ou veulent faire donner le caractère d’authenticité attaché aux actes de l’autorité publique… »'},
      {t:'vs', a:{title:'« doivent » : authentique obligatoire', items:['Les <b>mutations immobilières</b>, à titre onéreux ou gratuit : vente d’une maison, d’un lot de copropriété, d’un lot de lotissement, d’un fonds rural, cession de parts indivises, donation (même de l’usufruit), attestation immobilière après une succession, vente en l’état futur d’achèvement, dépôt des pièces du lotissement, partage contenant un immeuble', 'Le <b>bail de plus de 12 ans</b>, car il doit être publié']}, b:{title:'« veulent » : authenticité choisie', items:['Les <b>baux de 12 ans ou moins</b> (habitation, professionnel, mixte, commercial, rural)', 'La convention d’occupation précaire', 'La constitution de servitude', 'Les promesses unilatérales de vente ou d’achat, la promesse synallagmatique de vente, le contrat de réservation']}},
      {t:'tip', k:'piege', h:'Le <b>fonds de commerce</b> n’est pas un immeuble mais un <b>bien meuble</b> : sa vente n’exige pas le recours au notaire.'},
      {t:'tip', k:'info', title:'Pour aller plus loin', h:'Les actes à publier au service de la publicité foncière (SPF) sont listés à l’<b>article 28 du décret du 4 janvier 1955</b> portant réforme de la publicité foncière.'},
      {t:'widget', w:'sceau'},
      {t:'p', h:'Le notaire <b>authentifie</b> l’acte en y apposant sa <b>signature</b> et son <b>sceau</b> (la Marianne). Il reconnaît officiellement la volonté exprimée par les parties devant lui (ou dans une procuration). Il s’engage personnellement sur le contenu de l’acte (<b>force probante</b>) et sur sa <b>date</b> (date certaine). Il <b>publie</b> ensuite l’acte de vente au SPF du lieu de l’immeuble : la mutation devient <b>opposable aux tiers</b>. Le notaire sécurise ainsi juridiquement la vente.'},
      {t:'tip', k:'piege', title:'À bien distinguer', h:'La <b>force exécutoire</b> vient de l’authenticité de l’acte, au même titre que la force probante et la date certaine. La <b>publication</b> au SPF, elle, rend la mutation <b>opposable aux tiers</b>. Ton cours place la force exécutoire juste à côté de la publication : retiens bien d’où vient chaque effet.'},
      {t:'p', h:'<b>Les avant-contrats.</b> En immobilier, les parties signent souvent d’abord un contrat préliminaire : promesse unilatérale ou synallagmatique de vente, promesse unilatérale d’achat, contrat de réservation d’un terrain en vue de construire. Ce sont en général des <b>actes sous signature privée</b>, que le notaire peut recevoir ou passer en la forme authentique. Ils seront vus à l’activité 3.'}
    ]},
    {id:'biens', n:'2', eyebrow:'Reconnaître', title:'Les différents types de biens immobiliers', blocks:[
      {t:'quote', ref:'Article 517 du Code civil', h:'« Les biens sont immeubles, ou par leur nature, ou par leur destination, ou par l’objet auquel ils s’appliquent. »'},
      {t:'widget', w:'maison'},
      {t:'h3', h:'Les immeubles par nature', small:'NATURE'},
      {t:'def', term:'Immeuble par nature', h:'Un bien qui ne peut pas se déplacer seul ou être déplacé : le <b>sol</b> et tout ce qui lui est <b>durablement fixé</b> (maison, terrasse, garage, piscine enterrée, murette, arbres, fleurs…).'},
      {t:'quote', ref:'Article 518 du Code civil', h:'« Les fonds de terre et les bâtiments sont immeubles par leur nature. »'},
      {t:'p', h:'Sont aussi immeubles par nature les biens <b>attachés de façon durable</b> à un immeuble par nature : tuyaux, canalisations, portes, fenêtres, volets.'},
      {t:'quote', ref:'Article 523 du Code civil', h:'« Les tuyaux servant à la conduite des eaux dans une maison ou autre héritage sont immeubles et font partie du fonds auquel ils sont attachés. »'},
      {t:'table', head:['Cas', 'Qualification', 'Source'], rows:[
        ['Convecteurs électriques reliés à l’installation', 'Immeubles : il y a un dispositif de liaison avec la construction', 'Cass. 3e civ., 23 janvier 2002'],
        ['Fresques sur les murs', 'Immeubles tant qu’elles sont sur les murs, <b>meubles</b> une fois arrachées', 'Cass. ass. plén., 15 avril 1988'],
        ['Récoltes sur pied, fruits sur l’arbre', 'Immeubles ; <b>meubles</b> dès qu’ils sont coupés ou détachés, même pas encore enlevés', 'Art. 520 C. civ.']]},
      {t:'h3', h:'Les immeubles par destination', small:'DESTINATION'},
      {t:'def', term:'Immeuble par destination', h:'Un bien <b>à l’origine meuble</b>, que la loi traite comme un immeuble en raison du <b>lien</b> qui l’unit à un immeuble par nature, dont il est l’<b>accessoire</b> (art. 524 C. civ.).'},
      {t:'p', h:'<b>Deux conditions cumulatives :</b>'},
      {t:'list', num:true, items:['Le meuble et l’immeuble appartiennent au <b>même propriétaire</b>.', 'Le meuble est attaché de manière définitive, et le propriétaire <b>veut</b> qu’il le reste.']},
      {t:'acc', items:[
        {l:'Attachés à perpétuelle demeure', h:'Bibliothèque encastrée dans un mur, statue scellée dans une niche, cuisine intégrée.'},
        {l:'Formant un ensemble ornemental', h:'Des vases simplement posés sur des socles, mais qui décorent un château, ont été jugés immeubles par destination (CA Poitiers, 23 avril 1968).'},
        {l:'Affectés à l’exploitation d’un fonds', h:'Agricole : animaux du cheptel, semences, engrais, bottes de paille, ruches, tracteur, matériel agricole, appareil de traite (art. 524). Mais aussi : lits d’un hôtel, tables et chaises d’un restaurant, caisses et chariots d’une grande surface, ordinateurs et imprimantes d’une étude notariale.'}]},
      {t:'tip', k:'piege', h:'Ne confonds pas : la <b>récolte coupée</b> est un meuble (art. 520), mais la <b>paille et les engrais</b> gardés pour l’exploitation sont des immeubles par destination (art. 524). Et sans <b>même propriétaire</b>, pas d’immeuble par destination : le tracteur du fermier locataire reste un meuble.'},
      {t:'h3', h:'Les immeubles par l’objet', small:'OBJET'},
      {t:'def', term:'Immeuble par l’objet', h:'Un <b>droit</b> qui porte sur un immeuble.'},
      {t:'quote', ref:'Article 526 du Code civil', h:'« Sont immeubles, par l’objet auquel ils s’appliquent : l’usufruit des choses immobilières ; les servitudes ou services fonciers ; les actions qui tendent à revendiquer un immeuble. »'},
      {t:'list', items:['Les <b>démembrements de propriété</b> : usufruit, nue-propriété, droit d’usage et d’habitation', 'Les <b>servitudes</b> : de passage, d’échelle, de canalisation…', 'Les <b>actions en justice</b> concernant un immeuble : action en revendication, action en bornage']},
      {t:'tip', k:'memo', h:'<b>N.D.O.</b> : la maison (<b>N</b>ature), la cuisine intégrée (<b>D</b>estination), l’usufruit (<b>O</b>bjet). Une chose, un accessoire, un droit.'},
      {t:'h3', h:'Pourquoi qualifier les biens ?'},
      {t:'p', h:'La signature du notaire donne à l’acte son <b>authenticité</b> : force probante, force exécutoire, date certaine. La plupart des opérations portent sur des immeubles <b>par nature</b> (terrain, maison, appartement), plus rarement sur des immeubles <b>par l’objet</b> (usufruit, nue-propriété, part indivise). Les immeubles par destination et la plupart des immeubles par l’objet (servitudes) sont <b>rattachés</b> à l’immeuble vendu.'},
      {t:'list', items:['Le notaire doit <b>désigner tous les immeubles</b> dans l’acte : d’abord l’immeuble par nature, puis les immeubles par destination et par l’objet qui s’y rattachent.', 'Il doit aussi désigner les <b>meubles meublants</b> inclus dans l’opération (électroménager, rideaux, meubles non fixés, mobilier de jardin…) <b>avec leur prix</b>. Leur montant est <b>ventilé</b> : il sort de l’assiette de la TPF et de la CSI, qui ne frappent que les immeubles.']},
      {t:'widget', w:'ventil'},
      {t:'p', h:'Le type d’immeuble décide aussi de la <b>constitution du dossier</b> : pièces à réunir avant la signature et formalités après.'},
      {t:'acc', items:[
        {l:'Les diagnostics (immeubles bâtis)', h:'CREP (plomb), amiante, électricité, gaz, DPE (performance énergétique), assainissement non collectif, bruit… Ils ne sont pas à obtenir pour un terrain nu, un verger, un bois ou une forêt, ni pour un local non habitable (hangar, garage, local de stockage).'},
        {l:'Le certificat d’urbanisme', h:'Pour une vente d’immeuble à construire : un <b>certificat d’urbanisme opérationnel</b> (CUO, parfois dit pré-opérationnel), demandé à la mairie du lieu de l’immeuble. Pour un immeuble bâti : un <b>certificat d’urbanisme informatif</b> (CUI).'},
        {l:'Les autorisations préalables', h:'Créer un lotissement : <b>permis d’aménager</b>. Construire un immeuble vendu en l’état futur d’achèvement : <b>permis de construire</b>. Un petit ouvrage sous certains seuils (superficie maximale) : <b>déclaration préalable</b>.'},
        {l:'Les droits de préemption', h:'La <b>SAFER</b> peut préempter les parcelles agricoles ; la commune, avec le <b>droit de préemption urbain</b> (simple ou renforcé). L’ordre des bénéficiaires change selon le bien : locataire (habitation), coindivisaires (parts indivises), preneur en place (vente rurale), voisins (parcelles boisées)…'},
        {l:'Les pièces de copropriété', h:'Pré-état daté, état daté, carnet d’entretien, certificat de l’article 20 : propres aux ventes de lots de copropriété.'},
        {l:'Les pièces sur les personnes', h:'Personne physique : acte de naissance, de mariage, contrat de mariage, jugement de divorce, PACS… Personne morale : extrait Kbis, avis au BODACC, statuts, délégation de pouvoir pour signer.'},
        {l:'La taxation', h:'Elle diffère entre mutation à titre gratuit et à titre onéreux, et selon le lieu de l’immeuble (TPF, CSI).'},
        {l:'La publication', h:'Tout acte authentique concernant un immeuble est publié au SPF, ainsi que les baux de plus de 12 ans. Les avant-contrats sous signature privée ne sont ni publiés ni taxés ; mais de plus en plus d’avant-contrats sont passés en la forme authentique, et sont alors publiés et taxés.'}]},
      {t:'tip', k:'piege', h:'<b>CSI</b> = contribution de <b>sécurité</b> immobilière. Ton cours écrit une fois « contribution sociale immobilière » : c’est une coquille.'}
    ]},
    {id:'designation', n:'3', eyebrow:'Rédiger', title:'La désignation des biens dans l’acte authentique', blocks:[
      {t:'p', h:'Pour tout acte ou décision judiciaire soumis à publicité foncière, l’<b>article 7 du décret du 4 janvier 1955</b> impose que le paragraphe « désignation » contienne quatre <b>mentions obligatoires</b> :'},
      {t:'list', num:true, items:['La <b>nature</b> du bien : fonds de terre, terrain à bâtir, maison d’habitation, lot de copropriété…', 'Le <b>lieu de situation</b> : commune, numéro, type et nom de la voie, ou lieudit.', 'La <b>contenance</b>, en hectares (ha), ares (a) et centiares (ca).', 'La <b>désignation cadastrale</b> : section, numéro de plan et lieudit.']},
      {t:'tip', k:'memo', h:'<b>N.S.C.C.</b> : Nature, Situation, Contenance, Cadastre. « Notaire Sans Cadastre ? Catastrophe ! »'},
      {t:'tip', k:'piege', title:'Erreur dans le rappel du cours', h:'<b>1 ha = 100 a = 10 000 m²</b> (et non 1 000 m²). 1 a = 100 m². 1 ca = 1 m². Exemple : 12 345 m² = 1 ha 23 a 45 ca.'},
      {t:'widget', w:'convert'},
      {t:'h3', h:'Le cadastre'},
      {t:'p', h:'Pour réunir ces informations, le collaborateur ou la collaboratrice consulte le site du cadastre (cadastre.gouv.fr). Le cadastre, ce sont les documents établis par l’État après des relevés topographiques pour déterminer les propriétés ; l’administration fiscale qui les tient porte aussi ce nom.'},
      {t:'vs', a:{title:'Matrice cadastrale', items:['Document <b>écrit</b> : les relevés de propriété, ou extraits de matrice', 'Récapitule les parcelles bâties et non bâties d’un même propriétaire dans une commune', 'Délivrée seulement au <b>propriétaire</b> ou à son <b>mandataire</b>, comme le notaire']}, b:{title:'Plan cadastral', items:['Document <b>graphique</b> : la commune découpée en <b>sections</b> (une ou deux lettres), puis en <b>parcelles</b> (numéros)', 'Montre l’emprise des bâtiments, les voies, les cours d’eau', '<b>Accessible à tous</b> (site, centre des impôts, mairie), sans le nom des propriétaires']}},
      {t:'widget', w:'cadastre'},
      {t:'tip', k:'info', h:'Le plan cadastral a une finalité essentiellement <b>fiscale</b> : il n’a pas vocation à garantir un droit de propriété.'},
      {t:'h3', h:'Les modèles de clauses du cours'},
      {t:'p', h:'Choisis un modèle et active le surligneur : chaque mention obligatoire prend sa couleur.'},
      {t:'widget', w:'gallery'},
      {t:'tip', k:'astuce', title:'Reconnaître une copropriété', h:'Des <b>lots numérotés</b>, chacun avec une <b>quote-part des parties communes</b> en tantièmes (ex. : 175/10 000es), et un <b>règlement de copropriété avec état descriptif de division</b> publié au SPF.'},
      {t:'tip', k:'notaire', title:'Les conventions de l’acte', h:'Communes en MAJUSCULES, numéros de lots en lettres puis en chiffres (« Lot numéro VINGT-CINQ (25) »), montants en lettres puis en chiffres, contenances au format 00 ha 00 a 00 ca, et la formule finale : « tel que le bien existe, s’étend, se poursuit et comporte, avec toutes ses aisances et dépendances, sans aucune exception ni réserve ».'},
      {t:'h3', h:'À toi de rédiger'},
      {t:'widget', w:'builder'},
      {t:'widget', w:'trainer'}
    ]}
  ],
  essentials:[
    'Une <b>opération immobilière</b> est une action relative à un immeuble, réalisée par une ou plusieurs personnes.',
    'Trois situations principales : <b>mutation à titre onéreux</b>, <b>mutation à titre gratuit</b>, <b>location</b>. S’y ajoutent la <b>prise de garantie</b> et la <b>constitution de servitude</b>.',
    'Trois types d’immeubles (art. 517) : <b>par nature</b>, <b>par destination</b>, <b>par l’objet</b>.',
    'Certains actes sont <b>solennels</b> : forme authentique notariée obligatoire (mutations immobilières, bail de plus de 12 ans). D’autres peuvent être sous signature privée, mais les parties peuvent vouloir l’authenticité.',
    'L’<b>analyse de l’objet</b> de l’opération commande les formalités et démarches du dossier ; sa <b>nature</b> commande la forme de l’acte.',
    'Le <b>notaire</b>, officier public, conseille, reçoit un consentement libre et éclairé, authentifie l’acte (sceau et signature), propose l’acte le moins onéreux et collecte des taxes pour l’État.',
    'Le notaire doit <b>désigner l’immeuble</b> par une clause (art. 7 du décret du 4 janvier 1955) : nature, situation, contenance, cadastre. Les meubles sont listés avec leur prix.'
  ],
  extraGames:[
    {w:'maison', title:'La ferme aux immeubles', sub:'14 éléments à classer : nature, destination, objet ou meuble.', icon:'house'},
    {w:'qualif', title:'Qualifie l’opération', sub:'Des situations réelles à passer dans l’arbre de décision.', icon:'tree'},
    {w:'trainer', title:'Additions de contenances', sub:'Retrouve le total exact en ha, a, ca.', icon:'calc'}
  ],
  clauses:[
    {t:'Parcelles de terre · STENAY', h:`<p><span class="m-nat">Deux parcelles de terre</span> sises sur le territoire de la commune de <span class="m-sit">STENAY (MEUSE), lieudit « Les Chardonnerets »</span>,</p><p>Figurant au cadastre de la manière suivante :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Nature</th><th>Contenance</th></tr></thead><tbody><tr><td class="m-cad">ZB</td><td class="m-cad">140</td><td class="m-cad">Les Chardonnerets</td><td>Terre labourable</td><td class="m-con mono">03 ha 57 a 10 ca</td></tr><tr><td class="m-cad">ZB</td><td class="m-cad">142</td><td class="m-cad">Les Chardonnerets</td><td>Terre labourable</td><td class="m-con mono">03 ha 80 a 04 ca</td></tr><tr><td class="m-cad">ZB</td><td class="m-cad">144</td><td class="m-cad">Les Chardonnerets</td><td>Verger</td><td class="m-con mono">02 ha 12 a 65 ca</td></tr><tr><td class="m-cad">ZB</td><td class="m-cad">144</td><td class="m-cad">Les Chardonnerets</td><td>Verger</td><td class="m-con mono">01 ha 96 a 32 ca</td></tr><tr><td colspan="4"><b>Total</b></td><td class="m-con mono"><b>11 ha 46 a 11 ca</b></td></tr></tbody></table></div><p>Tel et ainsi que lesdits biens s’étendent, se poursuivent et comportent, avec toutes aisances et dépendances, sans exception ni réserve.</p>`, note:'Œil de collaborateur : le modèle annonce « deux parcelles » mais en liste quatre, et le n° 144 apparaît deux fois. Dans un vrai acte, chaque ligne doit être exacte. Le total, lui, est juste : 11 ha 46 a 11 ca.'},
    {t:'Terrain constructible · VANDŒUVRE', h:`<p><span class="m-nat">Une parcelle de terrain constructible</span> sise commune de <span class="m-sit">VANDOEUVRE-LES-NANCY (54500), lieudit « La Croix Saint-Claude »</span>, cadastrée <span class="m-cad">section DI numéro 180</span> pour une contenance globale de <span class="m-con">2 ares et 14 centiares</span>.</p><p>Tel au surplus que ledit immeuble existe et se comporte, avec toutes ses aisances et dépendances, et tous droits y attachés, sans aucune exception ni réserve.</p>`, note:'Les quatre mentions tiennent en une seule phrase : c’est la forme la plus compacte.'},
    {t:'Maison d’habitation · ESSEY-LÈS-NANCY', h:`<p><span class="m-nat">Une maison à usage d’habitation</span> construite en 2010, d’une superficie de 175 m², sise <span class="m-sit">14 bis rue des Roseaux à ESSEY-LES-NANCY (54270)</span>, composée de : au rez-de-chaussée, une cuisine équipée, un séjour ; à l’étage, deux chambres, une salle d’eau et WC, un débarras à la suite.</p><p>Le tout édifié sur un terrain cadastré <span class="m-cad">section DI numéro 112</span> pour une contenance globale de <span class="m-con">1 are et 63 centiares</span>.</p>`, note:'Piège classique : 175 m² est la surface habitable de la maison. La contenance est celle du terrain cadastré : 1 a 63 ca.'},
    {t:'Maison avec meubles · CHEVREUSE', h:`<div class="ap-sub">Immeuble</div><p><span class="m-nat">Une maison à usage d’habitation</span> sise <span class="m-sit">25 rue de la Tour à CHEVREUSE (78460)</span>, comprenant : une cuisine, un salon, une salle à manger, trois chambres, une salle de bain, un W-C et un jardin.</p><p>Le tout cadastré sous les relations suivantes :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Contenance</th></tr></thead><tbody><tr><td class="m-cad">AK</td><td class="m-cad">350</td><td class="m-cad">25 rue de la Tour</td><td class="m-con mono">00 ha 02 a 00 ca</td></tr></tbody></table></div><div class="ap-sub">Meubles</div><p class="m-meu">La promesse de vente porte également sur différents meubles et objets mobiliers garnissant la cuisine de l’immeuble ci-dessus désigné, savoir :</p><div class="ap-tbl"><table><tbody><tr><td>Un meuble bas avec une porte</td><td class="mono" style="text-align:right">1 500 €</td></tr><tr><td>Un meuble bas avec deux portes</td><td class="mono" style="text-align:right">1 300 €</td></tr><tr><td>Deux étagères arrondies meubles hauts</td><td class="mono" style="text-align:right">1 000 €</td></tr><tr><td>Un réfrigérateur-congélateur double porte</td><td class="mono" style="text-align:right">700 €</td></tr><tr><td>Un lave-vaisselle</td><td class="mono" style="text-align:right">500 €</td></tr><tr><td><b>Montant total du mobilier</b></td><td class="m-meu mono" style="text-align:right"><b>5 000 €</b></td></tr></tbody></table></div>`, note:'Les 5 000 € de meubles sont ventilés : ils sortent de l’assiette de la TPF et de la CSI.'},
    {t:'Appartement en copropriété · SEICHAMPS', h:`<p>Dans un <span class="m-nat">ensemble immobilier</span> sis <span class="m-sit">4 rue de la Haie Cerlin à SEICHAMPS (54280)</span>, dénommé « Résidence La Haie Cerlin », cadastré <span class="m-cad">section AL 234</span> rue de la Haie Cerlin pour <span class="m-con">8 ares 54 centiares</span>.</p><p><span class="m-cop">Le lot n° 123</span> : <span class="m-nat">un appartement T3 à usage d’habitation</span>, situé au 1er étage du bâtiment A, d’une surface de 66,52 m² et d’un balcon de 10,06 m².</p><p class="m-cop">Le règlement de copropriété avec état descriptif de division a été établi auprès de Maître Louis STANISLAS, notaire à NANCY (54000), le 12 décembre 2018, et régulièrement publié au service de la publicité foncière le 24 février 2019, volume 2019 numéro 17.</p>`, note:'Dans ton cours, ce modèle est titré « lot en lotissement ». Les indices (règlement de copropriété, état descriptif de division) montrent pourtant un lot de copropriété : n’hésite pas à le faire confirmer par ta prof.'},
    {t:'Lots de copropriété · NANTES', h:`<p>Dans un <span class="m-nat">ensemble immobilier</span> situé à <span class="m-sit">NANTES (44000), 5 rue de la Paix</span>, figurant ainsi au cadastre :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Surface</th></tr></thead><tbody><tr><td class="m-cad">AZ</td><td class="m-cad">18</td><td class="m-cad">5 rue de la Paix</td><td class="m-con mono">00 ha 14 a 30 ca</td></tr></tbody></table></div><div class="ap-sub m-cop">Les lots de copropriété suivants :</div><p><b class="m-cop">Lot numéro VINGT-CINQ (25)</b> : <span class="m-nat">un appartement de type 2</span> situé au deuxième étage à gauche de l’ascenseur, comprenant une entrée, une cuisine, un salon, une chambre et une salle de bains avec WC, <span class="m-cop">et les 175/10 000es des parties communes générales</span>.</p><p><b class="m-cop">Lot numéro VINGT-SIX (26)</b> : <span class="m-nat">un appartement de type 3</span> situé au deuxième étage à gauche de l’ascenseur, comprenant une entrée, un séjour avec cuisine, deux chambres, une salle de bains et un WC séparé, <span class="m-cop">et les 245/10 000es des parties communes générales</span>.</p><p>Tel que le BIEN existe, avec tous droits y attachés, sans aucune exception ni réserve.</p><div class="ap-sub">État descriptif de division · Règlement de copropriété</div><p class="m-cop">L’ensemble immobilier a fait l’objet d’un état descriptif de division et règlement de copropriété établi par acte reçu par Maître Jean BIEN, notaire à NANTES (44000), le 19 novembre 1975, publié au service de la publicité foncière de NANTES le 26 avril 1976, volume 1976P numéro 1234.</p><div class="ap-sub">Condition suspensive particulière</div><p>L’accord préalable de l’assemblée générale des copropriétaires sur la réunion des lots 25 et 26 devra être obtenu à la majorité de l’article 26 de la loi n° 65-557 du 10 juillet 1965. Cette réunion modifiera la répartition des tantièmes. L’ACQUÉREUR pourra renoncer à cette condition ; à défaut, et sans cet accord, les présentes seront caduques.</p>`, note:'Un lot de copropriété = une partie privative + une quote-part des parties communes (les tantièmes). Note la convention : numéro du lot en lettres, puis en chiffres.'},
    {t:'Lot de lotissement avec meubles · CARNAC', h:`<p>A <span class="m-sit">CARNAC (56340)</span>, dans un <span class="m-nat">ensemble immobilier</span> situé dans un lotissement de 18 maisons à usage principal d’habitation, figurant au cadastre :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Surface</th></tr></thead><tbody><tr><td class="m-cad">AB</td><td class="m-cad">181</td><td class="m-cad">Pierre Brossolette</td><td class="m-con mono">02 ha 01 a 16 ca</td></tr></tbody></table></div><p><b class="m-cop">LOT n° 10</b> : <span class="m-nat">une maison de 96 m²</span> édifiée sur un terrain de 660 m², comprenant une cuisine américaine, un salon, à l’étage deux chambres, une terrasse, une salle de bains avec WC, <span class="m-cop">et les deux cent soixante-sept/dix millièmes (267/10 000es) des parties communes du lotissement</span>.</p><p>Tel et ainsi que l’objet des présentes existe, s’étend, se poursuit et comporte actuellement avec toutes les aisances, dépendances, immeubles par destination, sans aucune exception ni réserve.</p><div class="ap-sub">Désignation des meubles</div><p class="m-meu">Les MEUBLES, pris en leur état, garnissant les BIENS, décrits et estimés article par article dans une liste ci-annexée.</p>`, note:'Ici les meubles ne sont pas détaillés dans la clause : ils figurent dans une liste annexée, estimée article par article.'},
    {t:'Pavillon en ZAC avec meubles · PULNOY', h:`<p>A <span class="m-sit">PULNOY (MEURTHE-ET-MOSELLE), 1 allée des Mimosas</span>, <span class="m-nat">un pavillon individuel de 165 m²</span>, en demi-niveau, comprenant : un salon-séjour, une cuisine ouverte avec accès au terrain et au jardin, trois chambres, une suite parentale avec salle de bains, une salle d’eau avec douche et WC, un WC indépendant, une buanderie et un garage avec double porte motorisée.</p><p>Figurant au cadastre :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Surface</th></tr></thead><tbody><tr><td class="m-cad">AB</td><td class="m-cad">325</td><td class="m-cad">Allée des Mimosas</td><td class="m-con mono">00 ha 10 a 41 ca</td></tr></tbody></table></div><p>Tel que le bien existe, avec tous droits y attachés, sans aucune exception ni réserve. Une copie d’un extrait de plan cadastral est annexée.</p><div class="ap-sub">Zone d’aménagement concerté</div><p>Le bien constitue le lot numéro 54 de la Zone d’Aménagement Concerté dénommée « ZAC du Soleil ». La commune de Pulnoy a décidé de sa création par délibération du 2 juin 2001.</p><div class="ap-sub m-meu">Identification des meubles</div><div class="ap-tbl"><table><tbody><tr><td><b>Cuisine</b> : 4 meubles bas + tiroir</td><td class="mono" style="text-align:right">900,00</td></tr><tr><td>4 meubles hauts</td><td class="mono" style="text-align:right">1 100,00</td></tr><tr><td>1 meuble bas d’angle, porte en verre</td><td class="mono" style="text-align:right">500,00</td></tr><tr><td>1 four</td><td class="mono" style="text-align:right">900,00</td></tr><tr><td>1 lave-vaisselle</td><td class="mono" style="text-align:right">700,00</td></tr><tr><td><b>Suite parentale</b> : 2 armoires avec penderie</td><td class="mono" style="text-align:right">1 200,00</td></tr><tr><td>1 commode avec miroir</td><td class="mono" style="text-align:right">800,00</td></tr><tr><td><b>Salle de bains</b> : 1 meuble double vasque 2 portes</td><td class="mono" style="text-align:right">900,00</td></tr><tr><td><b>Buanderie</b> : 1 machine à laver</td><td class="mono" style="text-align:right">900,00</td></tr><tr><td>1 sèche-linge</td><td class="mono" style="text-align:right">300,00</td></tr><tr><td><b>Total</b></td><td class="m-meu mono" style="text-align:right"><b>8 200,00 EUR</b></td></tr></tbody></table></div>`, note:'C’est la parcelle AB 325 que tu retrouves sur le plan cadastral interactif. Les 8 200 € de meubles sont ventilés hors assiette des taxes.'},
    {t:'Ensemble en VEFA · CHAMBÉRY (extrait)', h:`<p>Dans un <span class="m-nat">ensemble immobilier</span> situé à <span class="m-sit">CHAMBÉRY (Savoie)</span>, dénommé « La Roseraie », sis <span class="m-sit">14 ter rue du Parc</span>. Cet ensemble doit être composé de trois groupes de bâtiments (A-B, C-D et E-Ebis-F) comprenant des garages en sous-sol, des locaux commerciaux et des appartements.</p><p>Il est cadastré sur huit parcelles de la <span class="m-cad">section AI</span> (n° 483, 485, 487, 489, 573, 575, 579 et 580), pour une <span class="m-con">surface totale de 00 ha 95 a 35 ca</span>.</p><p><b class="m-cop">Lot numéro cent vingt (120)</b> : dans le groupe de bâtiments C-D, bâtiment D, au sous-sol, <span class="m-nat">un GARAGE</span> portant le numéro 27 au plan, <span class="m-cop">avec les six/dix millièmes (6/10 000es) de la propriété du sol et des parties communes générales, et les deux/millièmes (2/1 000es) des parties communes particulières du groupe C-D</span>.</p><p><b class="m-cop">Lot numéro cent trente-huit (138)</b> : bâtiment D, au 1er étage, <span class="m-nat">un APPARTEMENT de type T3</span> d’une surface habitable de 73,83 m², comprenant un séjour, une cuisine, deux chambres, une salle de bains, une buanderie, un WC, un dégagement, un hall et un balcon, portant le numéro D 11 au plan, <span class="m-cop">avec les quatre-vingt-quatre/dix millièmes (84/10 000es) de la propriété du sol et des parties communes générales, et les trente/millièmes (30/1 000es) des parties communes particulières du groupe C-D</span>.</p><p>Tels que lesdits biens <b>existeront après leur achèvement</b>, avec leurs dépendances, sans aucune exception ni réserve.</p>`, note:'En vente en l’état futur d’achèvement, le bien n’existe pas encore : la clause le décrit « tel qu’il existera après son achèvement ».'},
    {t:'Parcelles boisées · GIVRAUVAL', h:`<p>Commune de <span class="m-sit">GIVRAUVAL (Meuse)</span>. <span class="m-nat">Diverses parcelles boisées</span>, situées à <span class="m-sit">GIVRAUVAL (55500), lieudit « Derrière le Moutier »</span>, cadastrées de la manière suivante :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Contenance</th><th>Nature</th></tr></thead><tbody><tr><td class="m-cad">B</td><td class="m-cad">0878</td><td class="m-cad">Derrière le Moutier</td><td class="m-con mono">11 a 70 ca</td><td>Taillis bois</td></tr><tr><td class="m-cad">B</td><td class="m-cad">0879</td><td class="m-cad">Derrière le Moutier</td><td class="m-con mono">03 a 70 ca</td><td>Taillis bois</td></tr><tr><td class="m-cad">B</td><td class="m-cad">0886</td><td class="m-cad">Derrière le Moutier</td><td class="m-con mono">03 a 40 ca</td><td>Taillis bois</td></tr><tr><td class="m-cad">B</td><td class="m-cad">0890</td><td class="m-cad">Derrière le Moutier</td><td class="m-con mono">05 a 90 ca</td><td>Taillis bois</td></tr><tr><td class="m-cad">B</td><td class="m-cad">0893</td><td class="m-cad">Derrière le Moutier</td><td class="m-con mono">05 a 55 ca</td><td>Taillis bois</td></tr><tr><td colspan="3"><b>Contenance totale</b></td><td class="m-con mono"><b>30 a 25 ca</b></td><td></td></tr></tbody></table></div><p><b>Plan</b> : l’immeuble n’a pas donné lieu à un plan de géomètre-expert ; il figure sous teinte rose sur une copie du plan cadastral annexée. Le plan cadastral est un document administratif à finalité essentiellement fiscale : il n’a pas vocation à garantir un droit de propriété.</p><p><b>Description</b> : l’acquéreur déclare avoir visité les lieux et dispense le vendeur d’une plus ample désignation.</p><p><b>Quotité des droits</b> : l’immeuble appartient au vendeur seul en pleine propriété.</p>`, note:'Vérifie le total : 11 a 70 + 3 a 70 + 3 a 40 + 5 a 90 + 5 a 55 = 30 a 25 ca. Les centiares font 325 : on écrit 25 ca et on retient 3 ares.'},
    {t:'Local commercial · VAUX-SUR-MER (extrait)', h:`<p>A <span class="m-sit">VAUX-SUR-MER (Charente-Maritime), ZAC Le Plain, 9 rue Victor Hugo</span>. Les biens et droits immobiliers ci-après dépendant d’un <span class="m-nat">ensemble immobilier composé de trois locaux commerciaux</span>, figurant au cadastre :</p><div class="ap-tbl"><table><thead><tr><th>Section</th><th>N°</th><th>Lieudit</th><th>Surface</th></tr></thead><tbody><tr><td class="m-cad">A</td><td class="m-cad">3117</td><td class="m-cad">PLAIN</td><td class="m-con mono">00 ha 06 a 79 ca</td></tr><tr><td class="m-cad">A</td><td class="m-cad">3118</td><td class="m-cad">PLAIN</td><td class="m-con mono">00 ha 05 a 04 ca</td></tr><tr><td colspan="3"><b>Total</b></td><td class="m-con mono"><b>00 ha 11 a 83 ca</b></td></tr></tbody></table></div><p>Ces parcelles forment les lots 3, 4 et 5 de la ZAC « Le Plain », dont le cahier des charges a été déposé au rang des minutes du notaire le 16 janvier 2008 et publié au bureau des hypothèques de MARENNES le 12 février 2008.</p><p>1/ <span class="m-nat">Un local dénommé LOCAL N° 1</span>, d’une surface d’environ 284 m² : un magasin, une mezzanine, un coin repos, un entrepôt avec 2 WC, un lave-mains et un robinet de puisage.</p><p>2/ La <b>jouissance exclusive</b> de deux emplacements de parking numérotés 1 et 2.</p><p>3/ La <b>jouissance commune</b> avec les autres locaux des parkings, voies de circulation et espaces verts.</p>`, note:'« Bureau des hypothèques » : l’ancien nom du service de la publicité foncière.'},
    {t:'Constitution de servitude · CAEN', head:'Constitution de servitude', h:`<div class="ap-sub">Fonds dominant</div><p>Propriétaires : Monsieur JAVER et Madame POIRET, ACQUÉREURS aux présentes. A <span class="m-sit">CAEN (14000), 31 rue de l’Aubépine</span>, <span class="m-cad">section AB n° 3121</span> pour une contenance totale de <span class="m-con">6 ares (00 ha 06 a 00 ca)</span>.</p><div class="ap-sub">Fonds servant</div><p>Propriétaires : Monsieur et Madame TILLOME, VENDEURS aux présentes. A <span class="m-sit">CAEN (14000), 31 rue de l’Aubépine</span>, <span class="m-cad">section AB n° 3122</span> pour une contenance totale de <span class="m-con">10 ares (00 ha 10 a 00 ca)</span>. Acquisition suivant acte reçu par Maître LOYAL, notaire à CAEN, le 2 avril 2008, publié au service de la publicité foncière de CAEN le 2 mai 2008, volume 2008P numéro 427.</p><div class="ap-sub">Nature de la servitude</div><p><span class="m-nat">Servitude de passage de canalisation.</span> À titre de servitude réelle et perpétuelle, le propriétaire du fonds servant constitue au profit du fonds dominant et de ses propriétaires successifs un droit de passage d’une canalisation souterraine des eaux, à une profondeur minimale de 0,80 mètre, exclusivement sur une bande d’un mètre de large figurée au plan annexé.</p><p>Le propriétaire du fonds dominant l’entretiendra à ses frais exclusifs et remettra le fonds servant dans son état d’origine après chaque intervention. Si la canalisation est détériorée du fait du propriétaire du fonds servant, celui-ci la réparera à ses seuls frais.</p><p>Pour la perception de la contribution de sécurité immobilière, la servitude est évaluée à <b>cent cinquante euros (150,00 EUR)</b>.</p>`, note:'Même une servitude reçoit une valeur : c’est la base de calcul de la CSI. Et toujours la convention : montant en lettres, puis en chiffres.'}
  ],
  flashcards:[
    {q:'Qu’est-ce qu’une opération immobilière ?', a:'Une action relative à un immeuble (chose qui ne se déplace pas), réalisée par une ou plusieurs personnes.'},
    {q:'Les trois situations juridiques principales ?', a:'La mutation à titre onéreux, la mutation à titre gratuit et la location (bail).'},
    {q:'Les deux autres actions juridiques sur un immeuble ?', a:'La prise de garantie (sûreté) et la constitution de servitude.'},
    {q:'Mutation à titre onéreux ?', a:'Transfert de propriété (ou d’une partie) contre un prix, appelé produit, ou une soulte en cas d’échange. Ex. : vente, échange de terrains, cession d’une part indivise.'},
    {q:'Qu’est-ce qu’une soulte ?', a:'La somme d’argent versée pour compenser une différence de valeur, par exemple dans un échange ou un partage.'},
    {q:'Mutation à titre gratuit ?', a:'Transfert de propriété sans contrepartie financière, parfois contre un faible avantage. Ex. : donation, héritage, legs.'},
    {q:'Quand une donation avec charge devient-elle onéreuse ?', a:'Quand l’avantage demandé au bénéficiaire n’est pas moindre que ce qui est donné : l’opération est requalifiée en mutation à titre onéreux.'},
    {q:'La location ?', a:'Le bailleur ne transfère pas la propriété : il laisse l’usage du bien au locataire contre un loyer périodique (les fruits).'},
    {q:'Les sortes de baux du cours ?', a:'Habitation (nu ou meublé), professionnel, mixte, commercial, rural, plus la convention d’occupation précaire.'},
    {q:'Les trois hypothèques ?', a:'Conventionnelle (issue d’un contrat), légale (issue de la loi, ex. : prêteur de deniers), judiciaire (issue d’un jugement).'},
    {q:'Servitude d’échelle ?', a:'Elle permet au propriétaire qui a bâti en limite de poser une échelle sur le terrain voisin pour entretenir son mur.'},
    {q:'Servitude de tréfonds ?', a:'Une servitude dans le sous-sol : écoulement des eaux, passage de canalisations ou de matériel.'},
    {q:'Les devoirs du notaire envers les parties ?', a:'Conseiller et informer, éclairer les parties sur leurs engagements, vérifier un consentement libre (sans erreur, dol ni violence) et leur santé d’esprit, proposer l’acte le moins onéreux.'},
    {q:'Que collecte le notaire pour l’État ?', a:'La taxe de publicité foncière (TPF), en plus de ses émoluments et débours.'},
    {q:'Que dit l’article 1er de l’ordonnance du 2 novembre 1945 ?', a:'Les notaires sont les officiers publics établis pour recevoir les actes auxquels les parties doivent ou veulent faire donner le caractère d’authenticité.'},
    {q:'« Doivent » ou « veulent » : la différence ?', a:'Doivent : actes solennels, l’authenticité est obligatoire. Veulent : les parties choisissent l’authenticité alors que la loi ne l’impose pas.'},
    {q:'Quels actes exigent la forme authentique notariée ?', a:'Les mutations immobilières (vente, donation, attestation immobilière après succession, VEFA, partage d’un immeuble…) et le bail de plus de 12 ans.'},
    {q:'Pourquoi un bail de plus de 12 ans passe-t-il chez le notaire ?', a:'Il doit être publié au service de la publicité foncière, ce qui impose la forme authentique.'},
    {q:'Le fonds de commerce exige-t-il un notaire ?', a:'Non : c’est un bien meuble (incorporel), pas un immeuble.'},
    {q:'Les trois effets de l’authenticité ?', a:'Force probante, date certaine et force exécutoire.'},
    {q:'À quoi sert la publication au SPF ?', a:'À rendre la mutation opposable aux tiers. Elle se fait au SPF du lieu de situation de l’immeuble.'},
    {q:'Quel texte liste les actes à publier ?', a:'L’article 28 du décret du 4 janvier 1955 portant réforme de la publicité foncière.'},
    {q:'Les avant-contrats ?', a:'Promesse unilatérale ou synallagmatique de vente, promesse unilatérale d’achat, contrat de réservation : en général sous signature privée, parfois authentiques.'},
    {q:'Article 517 du Code civil ?', a:'Les biens sont immeubles par leur nature, par leur destination, ou par l’objet auquel ils s’appliquent.'},
    {q:'Immeuble par nature ?', a:'Un bien qui ne peut pas se déplacer ni être déplacé : le sol et ce qui y est durablement fixé, les bâtiments (art. 518), et ce qui leur est attaché durablement.'},
    {q:'Les tuyaux d’une maison ?', a:'Immeubles par nature : ils font partie du fonds auquel ils sont attachés (art. 523).'},
    {q:'Les convecteurs électriques ?', a:'Immeubles : il existe un dispositif de liaison avec la construction (Cass. 3e civ., 23 janvier 2002).'},
    {q:'Les fresques ?', a:'Immeubles tant qu’elles sont sur les murs ; meubles une fois arrachées (Cass. ass. plén., 15 avril 1988).'},
    {q:'Les récoltes ?', a:'Sur pied ou sur l’arbre : immeubles. Coupées ou détachées, même pas encore enlevées : meubles (art. 520).'},
    {q:'Immeuble par destination ?', a:'Un meuble que la loi traite comme un immeuble en raison de son lien avec un immeuble par nature, dont il est l’accessoire (art. 524).'},
    {q:'Les 2 conditions de l’immeuble par destination ?', a:'Même propriétaire pour le meuble et l’immeuble ; attache définitive voulue par le propriétaire.'},
    {q:'Exemples d’immeubles par destination ?', a:'Cuisine intégrée, statue scellée, bibliothèque encastrée, vases ornant un château (CA Poitiers 1968), cheptel, tracteur, ruches, paille et engrais, lits d’hôtel, chariots de supermarché, ordinateurs d’une étude.'},
    {q:'Immeuble par l’objet ?', a:'Un droit qui porte sur un immeuble (art. 526) : usufruit, nue-propriété, usage et habitation, servitudes, actions en revendication ou en bornage.'},
    {q:'Pourquoi lister les meubles et leur prix dans l’acte ?', a:'Pour ventiler leur valeur : elle sort de l’assiette de la TPF et de la CSI, qui ne frappent que les immeubles.'},
    {q:'Que signifie CSI ?', a:'Contribution de sécurité immobilière (et non « sociale »).'},
    {q:'Les 4 mentions obligatoires de la désignation ?', a:'Nature, situation (commune, n°, voie ou lieudit), contenance (ha a ca), désignation cadastrale (section, n° de plan, lieudit). Art. 7 du décret du 4 janvier 1955.'},
    {q:'1 ha, 1 a, 1 ca en m² ?', a:'1 ha = 10 000 m² ; 1 a = 100 m² ; 1 ca = 1 m².'},
    {q:'Convertir 23 456 m² ?', a:'2 ha 34 a 56 ca : on découpe de droite à gauche par paquets de 2 chiffres.'},
    {q:'La matrice cadastrale ?', a:'Document écrit : les relevés de propriété d’un même propriétaire dans une commune. Délivrée au propriétaire ou à son mandataire, comme le notaire.'},
    {q:'Le plan cadastral ?', a:'Document graphique : sections (lettres) puis parcelles (numéros). Accessible à tous, sans le nom des propriétaires. À finalité fiscale : il ne prouve pas la propriété.'},
    {q:'CUO ou CUI ?', a:'CUO (opérationnel) : vente d’un immeuble à construire. CUI (informatif) : vente d’un immeuble bâti.'},
    {q:'Permis d’aménager, de construire, déclaration préalable ?', a:'Permis d’aménager : créer un lotissement. Permis de construire : construire, par exemple en VEFA. Déclaration préalable : petit ouvrage sous certains seuils.'},
    {q:'Qui peut préempter des terres agricoles ?', a:'La SAFER (société d’aménagement foncier et d’établissement rural). La commune dispose, elle, du droit de préemption urbain.'},
    {q:'Pièces propres à la vente d’un lot de copropriété ?', a:'Pré-état daté, état daté, carnet d’entretien, certificat de l’article 20.'},
    {q:'Pièces pour une personne morale ?', a:'Extrait Kbis, avis au BODACC, statuts, délégation de pouvoir pour signer.'}
  ],

    {q:'Lequel de ces actes doit obligatoirement être notarié ?', o:['Un bail d’habitation de 3 ans', 'La donation d’un terrain', 'Une promesse unilatérale de vente', 'La vente d’un fonds de commerce'], a:1},
    {q:'Un bail doit être notarié lorsqu’il est conclu pour…', o:['plus de 3 ans', 'plus de 9 ans', 'plus de 12 ans', 'n’importe quelle durée'], a:2, e:'Au-delà de 12 ans, il doit être publié au SPF.'},

    {q:'La publication de l’acte au SPF le rend…', o:['gratuit', 'opposable aux tiers', 'secret', 'rétroactif'], a:1},

    {q:'Une cuisine intégrée est un immeuble…', o:['par nature', 'par destination', 'par l’objet', 'Ce n’est qu’un meuble'], a:1},
    {q:'Le tracteur appartenant au fermier locataire est…', o:['un immeuble par destination', 'un meuble', 'un immeuble par nature', 'un immeuble par l’objet'], a:1, e:'Il manque la condition du même propriétaire.'},
    {q:'L’usufruit d’une maison est un immeuble…', o:['par nature', 'par destination', 'par l’objet', 'Ce n’est pas un immeuble'], a:2},
    {q:'Pourquoi le notaire indique-t-il le prix des meubles vendus avec la maison ?', o:['Pour les exclure de l’assiette de la TPF et de la CSI', 'Pour augmenter ses émoluments', 'Parce que la mairie l’exige', 'Pour rien, c’est une habitude'], a:0},
    {q:'Les mentions obligatoires de la désignation sont…', o:['nature, situation, contenance, désignation cadastrale', 'prix, date, signature, sceau', 'nom du vendeur, nom de l’acheteur, prix', 'surface habitable, nombre de pièces'], a:0},
    {q:'2 ha 05 a 30 ca, cela fait…', o:['2 530 m²', '20 530 m²', '25 030 m²', '205 300 m²'], a:1, e:'2 × 10 000 + 5 × 100 + 30 = 20 530 m².'},
    {q:'4 512 m², cela fait…', o:['4 ha 51 a 12 ca', '0 ha 45 a 12 ca', '45 ha 12 a', '0 ha 4 a 512 ca'], a:1, e:'Paquets de 2 en partant de la droite : 12 ca, 45 a, 0 ha.'},
    {q:'1 hectare = 1 000 m².', tf:true, a:false, e:'1 ha = 10 000 m² (le rappel de ton cours contient une coquille).'},

  cases:[
    {id:'immo1_c1', title:'La ferme des Martin', tag:'Qualification des biens', facts:['M. Martin vend sa ferme à Mme Petit : les bâtiments et 12 hectares de terres, le verger dont les pommiers sont chargés de fruits, et le blé moissonné la veille, encore en gerbes dans le champ.', 'La vente comprend aussi ses 30 vaches et son tracteur, la cuisine intégrée de la maison et un réfrigérateur posé dans la cuisine. Il cède enfin l’usufruit qu’il détient sur une parcelle voisine.', 'Dans la cour est garée la moissonneuse de M. Durand, un voisin.'], q:'Qualifie chacun de ces biens. Quelles conséquences pour l’acte ?', steps:[
      {l:'Les faits', h:'La vente d’une exploitation agricole qui réunit des biens de natures très différentes.'},
      {l:'Le problème de droit', h:'Comment qualifier juridiquement chacun des biens compris dans la vente, et comment l’acte doit-il les désigner ?'},
      {l:'Les règles applicables', h:'Art. 517 C. civ. : immeubles par nature (art. 518 et 520), par destination (art. 524 : même propriétaire et attache voulue), par l’objet (art. 526). Les meubles meublants sont listés avec leur prix pour sortir de l’assiette de la TPF et de la CSI.'},
      {l:'L’application aux faits', h:'<p><b>Par nature</b> : les bâtiments, les terres, les pommes encore sur les arbres.</p><p><b>Par destination</b> : les vaches et le tracteur (même propriétaire, affectés à l’exploitation), la cuisine intégrée.</p><p><b>Par l’objet</b> : l’usufruit sur la parcelle voisine.</p><p><b>Meubles</b> : le blé coupé (art. 520) et le réfrigérateur posé.</p><p><b>Hors vente</b> : la moissonneuse de M. Durand. Elle n’appartient pas au vendeur ; faute de même propriétaire, elle n’est d’ailleurs pas un immeuble par destination.</p>'},
      {l:'La conclusion', h:'L’acte désigne d’abord l’immeuble par nature, puis les immeubles par destination et par l’objet qui s’y rattachent. Les meubles (réfrigérateur, blé coupé) sont listés avec leur valeur, ventilée hors assiette des taxes. Comme il y a des terres agricoles, le notaire pensera aussi au droit de préemption de la SAFER.'}]},
    {id:'immo1_c2', title:'Les projets de Mme Roux', tag:'Qualification · forme de l’acte', facts:['Mme Roux, cliente de l’étude, a quatre projets :', 'a) donner à sa fille la nue-propriété de son appartement, en gardant l’usufruit ;<br>b) louer à un fleuriste, pour 9 ans, la boutique qu’elle possède en centre-ville ;<br>c) louer pour 18 ans un terrain à un agriculteur ;<br>d) vendre le fonds de commerce de sa librairie.'], q:'Qualifie chaque opération et indique si l’acte notarié est obligatoire.', steps:[
      {l:'Les faits', h:'Quatre opérations : une donation, deux baux de durées différentes, une cession de fonds de commerce.'},
      {l:'Le problème de droit', h:'Quelle est la nature de chaque opération, et quelle forme l’acte doit-il prendre ?'},
      {l:'Les règles applicables', h:'Ordonnance du 2 novembre 1945 : les actes que les parties <b>doivent</b> ou <b>veulent</b> faire authentifier. Les mutations immobilières, à titre onéreux ou gratuit, sont obligatoirement notariées. Un bail n’est obligatoirement notarié que s’il dépasse 12 ans (publication au SPF). Le fonds de commerce est un meuble.'},
      {l:'L’application aux faits', h:'<p>a) <b>Mutation à titre gratuit</b> d’un immeuble par l’objet (la nue-propriété) : acte authentique <b>obligatoire</b>.</p><p>b) <b>Location</b> (bail commercial de 9 ans, moins de 12 ans) : notaire <b>facultatif</b>.</p><p>c) <b>Location</b>, mais pour 18 ans : le bail doit être publié, donc acte authentique <b>obligatoire</b>.</p><p>d) Cession d’un <b>bien meuble</b> : ce n’est pas une opération immobilière, le notaire n’est <b>pas obligatoire</b>.</p>'},
      {l:'La conclusion', h:'L’acte notarié est obligatoire pour la donation (a) et le bail de 18 ans (c). Il est facultatif pour le bail de 9 ans (b) et la vente du fonds de commerce (d).'}]},
    {id:'immo1_c3', title:'La désignation de la maison des Lilas', tag:'Rédaction', facts:['Dossier de vente : une maison à usage d’habitation située 12 rue des Lilas à Nancy (54000), construite en 1998. Au rez-de-chaussée : une entrée, une cuisine, un séjour ; à l’étage : trois chambres, une salle de bains et un WC.', 'Le terrain est cadastré section BK n° 87, lieudit « 12 rue des Lilas », pour une surface de 605 m². Les vendeurs laissent un réfrigérateur-congélateur (600 €) et un lave-linge (400 €).'], q:'Rédige la clause « désignation » de l’acte.', steps:[
      {l:'Les mentions obligatoires', h:'Art. 7 du décret du 4 janvier 1955 : <b>nature</b> (maison à usage d’habitation), <b>situation</b> (NANCY (54000), 12 rue des Lilas), <b>contenance</b> et <b>désignation cadastrale</b> (section BK, n° 87, lieudit).'},
      {l:'La conversion', h:'605 m² : les deux derniers chiffres donnent 05 ca, les deux d’avant 6 a, et il n’y a pas d’hectare. Soit <b>00 ha 06 a 05 ca</b>.'},
      {l:'La rédaction proposée', h:'<div class="acte-paper" style="box-shadow:none;margin-top:6px"><div class="ap-h">Désignation</div><p>A <b>NANCY</b> (54000), 12 rue des Lilas,</p><p><b>Une maison à usage d’habitation</b> construite en 1998, comprenant : au rez-de-chaussée, une entrée, une cuisine, un séjour ; à l’étage, trois chambres, une salle de bains et un WC.</p><p>Figurant au cadastre : section BK, numéro 87, lieudit « 12 rue des Lilas », pour une contenance de 00 ha 06 a 05 ca.</p><p>Tel que le BIEN existe, s’étend, se poursuit et comporte, avec toutes ses aisances et dépendances, sans aucune exception ni réserve.</p></div>'},
      {l:'Les meubles', h:'Un paragraphe « Meubles » liste le réfrigérateur-congélateur (600,00 EUR) et le lave-linge (400,00 EUR) : <b>1 000,00 EUR</b> au total, ventilés hors de l’assiette de la TPF et de la CSI.'},
      {l:'La vérification', h:'Relis avec N.S.C.C. : Nature ✓ Situation ✓ Contenance ✓ Cadastre ✓. Le générateur de clause (onglet Outils) est pré-rempli avec ce dossier : compare ta version.'}]}

<script>
JLG.glossary([
  /* —— Éléments fondamentaux du droit —— */
  {s:'efd', t:'Abrogation', d:'Suppression d’une règle pour l’avenir. Elle est expresse (un texte nouveau le dit) ou tacite (la loi nouvelle est incompatible avec l’ancienne).'},
  {s:'efd', t:'Abusus', d:'Le droit de disposer d’une chose : la vendre, la donner, la détruire. Il reste au nu-propriétaire en cas d’usufruit.', ref:'Art. 544 C. civ.'},
  {s:'efd', t:'Actif', d:'La partie du patrimoine qui regroupe les droits évaluables en argent : biens immobiliers, biens mobiliers, créances.'},
  {s:'efd', t:'Arrêté', d:'Règlement pris par un ministre, un préfet ou un maire.'},
  {s:'efd', t:'Coutume', d:'Règle née d’une pratique constante et considérée comme obligatoire. Elle ne peut jamais aller contre la loi.'},
  {s:'efd', t:'Créancier chirographaire', d:'Créancier qui n’a aucune sûreté : il dispose seulement du droit de gage général, sans droit de suite ni de préférence.'},
  {s:'efd', t:'Décret', d:'Règlement pris par le Président de la République ou par le Premier ministre.'},
  {s:'efd', t:'Décret d’application', d:'Décret qui fixe les modalités pratiques de mise en œuvre d’une loi.'},
  {s:'efd', t:'Déni de justice', d:'Le refus du juge de trancher un litige sous prétexte du silence, de l’obscurité ou de l’insuffisance de la loi. Il est interdit.', ref:'Art. 4 C. civ.'},
  {s:'efd', t:'Directive', d:'Texte de l’Union européenne qui fixe aux États des objectifs à atteindre dans un délai ; chaque État doit la transposer.'},
  {s:'efd', t:'Droit à l’image', d:'Le droit de s’opposer à la diffusion de son image sans autorisation expresse et spéciale. Création de la jurisprudence sur le fondement de l’article 9 du Code civil.'},
  {s:'efd', t:'Droit de gage général', d:'Le droit des créanciers de saisir n’importe quel bien du patrimoine de leur débiteur pour se faire payer.', ref:'Art. 2284 C. civ.'},
  {s:'efd', t:'Droit de préférence', d:'Le droit d’être payé avant les autres créanciers sur le prix d’un bien. Il appartient au titulaire d’un droit réel.'},
  {s:'efd', t:'Droit de suite', d:'Le droit de revendiquer une chose en quelques mains qu’elle se trouve.'},
  {s:'efd', t:'Droit international privé', d:'Les règles applicables aux rapports entre personnes privées quand il existe un élément étranger.'},
  {s:'efd', t:'Droit objectif', d:'L’ensemble des règles de droit qui organisent la vie en société.'},
  {s:'efd', t:'Droit personnel', d:'Droit de créance d’une personne (créancier) contre une autre (débiteur). Il ne donne ni droit de suite, ni droit de préférence.'},
  {s:'efd', t:'Droit réel', d:'Droit exercé directement sur une chose. Il donne un droit de suite et un droit de préférence.'},
  {s:'efd', t:'Droit subjectif', d:'Prérogative reconnue à une personne, son titulaire, par le droit objectif. Ex. : le droit de propriété.'},
  {s:'efd', t:'Droits extrapatrimoniaux', d:'Droits non évaluables en argent, hors du patrimoine : incessibles, insaisissables, imprescriptibles. Ex. : vie privée, image.'},
  {s:'efd', t:'Droits intellectuels', d:'Droits exclusifs d’exploitation sur une création intellectuelle ou une clientèle : droit d’auteur, brevet, fonds de commerce.'},
  {s:'efd', t:'Droits patrimoniaux', d:'Droits évaluables en argent, qui entrent dans le patrimoine : cessibles, saisissables, transmissibles.'},
  {s:['efd', 'immo'], t:'Emphytéose', d:'Bail de très longue durée, de 18 à 99 ans, qui confère au preneur un droit réel.'},
  {s:'efd', t:'Exception d’illégalité', d:'Moyen invoqué au cours d’un procès pour faire écarter un règlement illégal. Aucun délai ; le texte n’est pas annulé et subsiste.'},
  {s:'efd', t:'Extranéité', d:'La présence d’un élément étranger dans une situation juridique (une personne, un bien, un lieu).'},
  {s:'efd', t:'Fructus', d:'Le droit de percevoir les fruits d’une chose : loyers, récoltes, dividendes.'},
  {s:['efd', 'immo'], t:'Fonds dominant', d:'Le terrain qui profite d’une servitude (par exemple, celui dont le propriétaire passe chez le voisin).'},
  {s:['efd', 'immo'], t:'Fonds servant', d:'Le terrain qui supporte une servitude.'},
  {s:'efd', t:'Gage', d:'Sûreté réelle portant sur un meuble corporel (voiture, bijou, tableau).'},
  {s:'efd', t:'Habitation (droit d’)', d:'Droit d’usage limité au logement du titulaire et de sa famille. Il ne peut être ni cédé ni loué.'},
  {s:['efd', 'immo'], t:'Hypothèque', d:'Sûreté réelle portant sur un immeuble. Elle peut être conventionnelle (contrat), légale (loi) ou judiciaire (jugement).'},
  {s:'efd', t:'Jurisprudence', d:'L’ensemble des décisions rendues par les tribunaux. Source du droit discutée, mais réelle.'},
  {s:'efd', t:'Loi', d:'Texte voté par le Parlement (Assemblée nationale et Sénat) dans les matières de l’article 34 de la Constitution.'},
  {s:'efd', t:'Loi d’ordre public', d:'Loi impérative qui s’impose même aux contrats en cours, pour leurs effets futurs.'},
  {s:'efd', t:'Loi interprétative', d:'Loi qui précise le sens d’une loi antérieure obscure ; elle s’y incorpore et s’applique donc au passé.'},
  {s:'efd', t:'Nantissement', d:'Sûreté réelle portant sur un meuble incorporel : fonds de commerce, parts sociales.'},
  {s:'efd', t:'Navette parlementaire', d:'Les allers-retours d’un texte entre l’Assemblée nationale et le Sénat jusqu’à l’adoption d’un texte identique.'},
  {s:'efd', t:'Non-rétroactivité', d:'Principe selon lequel la loi ne dispose que pour l’avenir.', ref:'Art. 2 C. civ.'},
  {s:['efd', 'immo'], t:'Nue-propriété', d:'Ce qui reste au propriétaire quand un autre a l’usufruit : l’abusus. Immeuble par l’objet si elle porte sur un immeuble.'},
  {s:'efd', t:'Ordonnance', d:'Mesure prise par le Gouvernement dans le domaine de la loi, sur autorisation du Parlement.', ref:'Art. 38 Constitution'},
  {s:'efd', t:'Passif', d:'La partie du patrimoine qui regroupe les dettes et obligations évaluables en argent.'},
  {s:'efd', t:'Patrimoine', d:'L’ensemble des droits et obligations d’une personne évaluables en argent : un actif et un passif, qui forment un tout.'},
  {s:'efd', t:'Projet de loi', d:'Texte de loi déposé à l’initiative du Gouvernement.'},
  {s:'efd', t:'Promulgation', d:'Décret par lequel le Président de la République ordonne l’exécution d’une loi.'},
