    <p class="muted">QCM et vrai/faux, corrigés et expliqués. +10 XP par bonne réponse.${best ? ` Ton meilleur score : <b>${Math.round(best.best * 100)} %</b>.` : ''}</p>
    <div class="btn-row"><button class="btn btn-primary" id="qa">${icon('play')}Quiz complet</button>${c.quiz.length > 10 ? `<button class="btn" id="qq">${icon('bolt')}Version rapide (10)</button>` : ''}</div></div></div>`;
  const run = n => { const qs = shuffle(c.quiz.map((q, i) => Object.assign({cid:c.id, qi:i}, q))).slice(0, n); runQuiz(el, qs, {kind:'chapter', title:c.title, onDone(sc, tot){ const p = sc / tot; const prev = S.quiz[c.id] || {best:0, runs:0}; S.quiz[c.id] = {best:Math.max(prev.best, p), runs:prev.runs + 1}; save(); }, again: () => quizHome(el, c)}); };
  $('#qa', el).onclick = () => run(c.quiz.length);
  const q = $('#qq', el); if (q) q.onclick = () => run(10);
}
function runQuiz(el, qs, opt = {}){
  if (!qs.length){ el.innerHTML = '<div class="empty">Pas encore de questions ici.</div>'; return; }
  let i = 0, score = 0; const wrong = []; const t0 = Date.now(); let tick;
  const items = qs.map(q => { if (q.tf) return Object.assign({}, q); const ord = shuffle(q.o.map((_, k) => k)); return Object.assign({}, q, {opts:ord.map(k => q.o[k]), ans:ord.indexOf(q.a)}); });
  const fmtT = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad2(s % 60); };
  if (opt.timer){ tick = setInterval(() => { if (!el.isConnected) return clearInterval(tick); const t = $('#qt', el); if (t) t.textContent = fmtT(Date.now() - t0); }, 1000); }
  function draw(){
    if (i >= items.length) return end();
    const q = items[i]; const ch = chap(q.cid);
    el.innerHTML = `<div class="quiz">
      <div class="qbar"><span class="qn">${i + 1}/${items.length}</span><span class="meter"><i style="width:${i / items.length * 100}%"></i></span>${opt.timer ? `<span class="qn" id="qt">${fmtT(Date.now() - t0)}</span>` : ''}<span class="qn">${score} ✓</span></div>
      <div class="qcard"><div class="qk"><span class="eyebrow">${q.tf ? 'Vrai ou faux ?' : 'Une seule bonne réponse'}${ch && opt.kind !== 'chapter' ? ' · ' + esc(ch.kicker) : ''}</span></div>
      <div class="qt">${q.q}</div>
      ${q.tf ? `<div class="tf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>` : `<div class="opts">${q.opts.map((o, k) => `<button class="opt" data-v="${k}"><span class="ol">${'ABCDE'[k]}</span><span>${o}</span></button>`).join('')}</div>`}
      <div id="qx"></div></div></div>`;
    $$('.opt', el).forEach(b => b.addEventListener('click', e => answer(b, e)));
  }
  function answer(b, e){
    const q = items[i]; const v = +b.dataset.v;
    const isAns = xv => q.tf ? (xv === 1) === q.a : xv === q.ans;
    const right = isAns(v);
    $$('.opt', el).forEach(x => { x.disabled = true; if (isAns(+x.dataset.v)) x.classList.add('is-right'); else if (x !== b) x.classList.add('dim'); });
    if (!right) b.classList.add('is-wrong');
    if (right){ score++; addXP(10, e); } else wrong.push(q);
    const good = q.tf ? (q.a ? 'Vrai' : 'Faux') : q.opts[q.ans];
    $('#qx', el).innerHTML = `<div class="expl"><div class="verdict ${right ? 'good' : 'bad'}">${right ? pick(['Exact !', 'Bien vu.', 'Parfait.', 'Oui, c’est ça !']) : 'Pas tout à fait…'}</div>${right ? '' : `<p><b>Bonne réponse :</b> ${good}</p>`}${q.e ? `<p>${q.e}</p>` : ''}</div>
      <div class="qnext"><button class="btn btn-primary" id="qn">${i + 1 < items.length ? 'Question suivante' : 'Voir mon résultat'}${icon('arrow')}</button></div>`;
    const n = $('#qn', el); n.onclick = () => { i++; draw(); }; n.focus({preventScroll:true});
    const x = $('#qx', el); const r = x.getBoundingClientRect(); if (r.bottom > innerHeight - 80) window.scrollBy({top:r.bottom - innerHeight + 110, behavior: reduced() ? 'auto' : 'smooth'});
  }
  function end(){
    clearInterval(tick);
    const tot = items.length, p = score / tot, pct = Math.round(p * 100);
    const note = Math.round(p * 40) / 2;
    const msg = p >= .9 ? 'Niveau GOAT. Rien à redire.' : p >= .7 ? 'Très solide. Encore un petit effort.' : p >= .5 ? 'En bonne voie. Relis les points ratés.' : 'On reprend la fiche et on y retourne. Tu vas l’avoir.';
    const C = 2 * Math.PI * 70;
    el.innerHTML = `<div class="result">
      <div class="eyebrow">${esc(opt.title || 'Quiz')}</div>
      <div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="var(--surface-3)" stroke-width="12"/><circle id="rg" cx="80" cy="80" r="70" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" style="transition:stroke-dashoffset 1.2s var(--ease)"/></svg>
        <div class="rv"><b id="rn">0</b><span>${opt.kind === 'exam' ? 'sur 20' : '%'}</span></div></div>
      <h3>${msg}</h3>
      <p class="muted">${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''} sur ${tot}${opt.timer ? ' · en ' + fmtT(Date.now() - t0) : ''}</p>
      ${wrong.length ? `<div class="mistakes"><div class="eyebrow">À revoir</div>${wrong.map(q => `<div class="mistake"><b>${q.q}</b>${q.tf ? (q.a ? 'Vrai' : 'Faux') : q.opts[q.ans]}${q.e ? ` — <span class="muted">${q.e}</span>` : ''}</div>`).join('')}</div>` : ''}
      <div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="qr">${icon('refresh')}Recommencer</button>${wrong.length ? `<button class="btn" id="qw">Rejouer mes erreurs</button>` : ''}</div>
    </div>`;
    const target = opt.kind === 'exam' ? note : pct;
    requestAnimationFrame(() => { const rg = $('#rg', el); if (rg) rg.style.strokeDashoffset = (C * (1 - p)).toFixed(1); });
    const rn = $('#rn', el); const t1 = performance.now();
    (function cnt(t){ const k = clamp((t - t1) / 1100, 0, 1); const e = 1 - Math.pow(1 - k, 3); const val = target * e; rn.textContent = opt.kind === 'exam' ? (Math.round(val * 2) / 2).toLocaleString('fr-FR') : Math.round(val); if (k < 1 && !reduced()) requestAnimationFrame(cnt); else rn.textContent = opt.kind === 'exam' ? note.toLocaleString('fr-FR') : pct; })(t1);
    if (p >= .8) confetti(130);
    if (opt.onDone) opt.onDone(score, tot, {target:rn});
    $('#qr', el).onclick = () => opt.again ? opt.again() : runQuiz(el, shuffle(qs), opt);
    const w = $('#qw', el); if (w) w.onclick = () => runQuiz(el, wrong.map(q => Object.assign({}, q)), Object.assign({}, opt, {onDone:null, again:null, title:'Mes erreurs'}));
    window.scrollTo({top:Math.max(0, el.getBoundingClientRect().top + scrollY - 120), behavior: reduced() ? 'auto' : 'smooth'});
  }
  draw();
}

/* =================== JEUX DE TRI =================== */
function gamesHome(el, c, open){
  const games = c.sorts || [];
  const extra = c.extraGames || [];
  if (open){ const g = games.find(x => x.id === open); if (g) return runSort(el, g, c); }
  el.innerHTML = `<p class="lead" style="margin-bottom:18px">Une carte apparaît, tu choisis la bonne catégorie. Chaque erreur est expliquée.</p>
  <div class="game-list stagger">${games.map(g => `<button class="quick" data-g="${g.id}"><span class="ico">${icon('grid')}</span><span><b>${g.title}</b><span>${g.items.length} cartes · ${g.cats.length} catégories${S.sorts[g.id] != null ? ` · record ${Math.round(S.sorts[g.id] * 100)} %` : ''}</span></span></button>`).join('')}
  ${extra.map(x => `<button class="quick" data-x="${x.w}"><span class="ico">${icon(x.icon || 'sparkle')}</span><span><b>${x.title}</b><span>${x.sub}</span></span></button>`).join('')}</div><div id="xg"></div>`;
  el.onclick = e => {
    const b = e.target.closest('[data-g]'); if (b){ runSort(el, games.find(x => x.id === b.dataset.g), c); return; }
    const x = e.target.closest('[data-x]'); if (x){ const slot = $('#xg', el); slot.innerHTML = `<div class="section-title"><h2>${extra.find(k => k.w === x.dataset.x).title}</h2></div><div data-w="${x.dataset.x}" data-o='{"mode":"defi"}'></div>`; mountWidgets(slot); slot.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth'}); }
  };
}
function runSort(el, g, c){
  el.onclick = null;
  const items = shuffle(g.items); let i = 0, score = 0, chain = 0; const misses = [];
  const ncls = g.cats.length === 3 ? 'n3' : g.cats.length === 5 ? 'n5' : '';
  function draw(){
    if (i >= items.length) return end();
    const it = items[i];
    el.innerHTML = `<div class="sort">
      <div class="crumbs"><button data-back>Jeux</button><span>/</span><span>${g.title}</span></div>
      <h2 style="font-size:var(--fs-xl)">${g.title}</h2>${g.intro ? `<p class="muted" style="margin-top:6px">${g.intro}</p>` : ''}
      <div class="sort-hud" style="margin-top:16px"><span>${i + 1}/${items.length} · ${score} bonne${score > 1 ? 's' : ''}</span><span class="streak" id="stk">${icon('flame', 'sr-only')}Série ×${chain}</span></div>
      <span class="meter"><i style="width:${i / items.length * 100}%"></i></span>
      <div class="sort-stage"><div class="sort-item" id="si">${it.e ? `<div class="em" aria-hidden="true">${it.e}</div>` : ''}<div class="it">${it.t}</div></div></div>
      <div class="cats ${ncls}">${g.cats.map(k => `<button class="cat" data-c="${k.id}">${k.l}</button>`).join('')}</div>
      <div id="sx"></div></div>`;
    $('[data-back]', el).onclick = () => gamesHome(el, c);
    $$('.cat', el).forEach(b => b.addEventListener('click', e => {
      const ok = b.dataset.c === it.c;
      $$('.cat', el).forEach(x => { x.disabled = true; if (x.dataset.c === it.c) x.classList.add(ok ? 'hit' : 'answer'); });
      if (!ok){ b.classList.add('miss'); chain = 0; misses.push(it); } else { score++; chain++; addXP(6, e); }
      const stk = $('#stk', el); stk.innerHTML = `Série ×${chain}`; if (ok) stk.classList.add('bump');
      const catL = g.cats.find(k => k.id === it.c).l;
      $('#sx', el).innerHTML = `<div class="expl"><div class="verdict ${ok ? 'good' : 'bad'}">${ok ? pick(['Bien classé !', 'Exact.', 'Oui !']) : 'Non : ' + catL}</div>${it.w ? `<p>${it.w}</p>` : ''}</div><div class="qnext"><button class="btn btn-primary" id="sn">${i + 1 < items.length ? 'Carte suivante' : 'Résultat'}${icon('arrow')}</button></div>`;
      const n = $('#sn', el); n.focus({preventScroll:true});
      n.onclick = () => { const si = $('#si', el); si.classList.add(ok ? 'out-good' : 'out-bad'); setTimeout(() => { i++; draw(); }, reduced() ? 0 : 260); };
      const r = $('#sx', el).getBoundingClientRect(); if (r.bottom > innerHeight - 80) window.scrollBy({top:r.bottom - innerHeight + 110, behavior: reduced() ? 'auto' : 'smooth'});
    }));
  }
  function end(){
    const p = score / items.length; const prev = S.sorts[g.id];
    S.sorts[g.id] = Math.max(prev || 0, p); save(); addXP(20, {target:el});
    if (p >= .8) confetti(110);
    el.innerHTML = `<div class="result"><div class="eyebrow">${g.title}</div><h3>${Math.round(p * 100)} % de bonnes réponses</h3><p class="muted">${score}/${items.length}${prev != null ? ` · record : ${Math.round(Math.max(prev, p) * 100)} %` : ''}</p>
      ${misses.length ? `<div class="mistakes"><div class="eyebrow">Les pièges du jour</div>${misses.map(m => `<div class="mistake"><b>${m.t} → ${g.cats.find(k => k.id === m.c).l}</b>${m.w || ''}</div>`).join('')}</div>` : ''}
      <div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="sr">${icon('refresh')}Rejouer</button><button class="btn" id="so">Autres jeux</button></div></div>`;
    $('#sr', el).onclick = () => runSort(el, g, c); $('#so', el).onclick = () => gamesHome(el, c);
  }
  draw();
}

function casesHome(el, c, open){
  if (open){ const k = (c.cases || []).find(x => x.id === open); if (k) return runCase(el, k, c); }
  el.innerHTML = `<p class="lead">Lis l’énoncé, cherche seul·e, puis révèle la correction étape par étape.</p>
  <div class="btn-row" style="margin:14px 0 18px"><button class="btn btn-sm" data-go="outils-methode">${icon('scale')}Revoir la méthode</button></div>

  el.onclick = e => { const b = e.target.closest('[data-k]'); if (b) runCase(el, c.cases.find(x => x.id === b.dataset.k), c); };

function runCase(el, k, c){
  el.onclick = null;
  let shown = 0;
  el.innerHTML = `<div class="col">
    <div class="crumbs"><button data-back>Cas pratiques</button><span>/</span><span>${k.title}</span></div>
    <article class="enonce"><div class="ek">Énoncé · ${esc(k.tag || '')}</div><div class="et">${k.title}</div>${k.facts.map(f => `<p>${f}</p>`).join('')}<div class="eq">${k.q}</div></article>
    <div class="method">
      <div><label class="eyebrow" for="th-${k.id}">Ton brouillon, avant la correction</label><textarea class="think" id="th-${k.id}" placeholder="Les faits utiles, le problème de droit, la règle, ta conclusion…" style="margin-top:8px"></textarea></div>
      ${k.steps.map((s, n) => `<div class="mstep locked" data-n="${n}"><div class="mstep-h"><span class="mi">${n + 1}</span><b>${s.l}</b><button class="btn btn-sm" data-reveal="${n}" ${n ? 'disabled' : ''}>Révéler</button></div><div class="mstep-b" hidden>${s.h}</div></div>`).join('')}
      <div class="btn-row" id="cdone" hidden><button class="btn btn-primary" id="cok">${icon('check')}J’ai compris ce cas</button><button class="btn" data-back>Autres cas</button></div>
    </div></div>`;
  $$('[data-back]', el).forEach(b => b.onclick = () => casesHome(el, c));
  $$('[data-reveal]', el).forEach(b => b.onclick = () => {
    const n = +b.dataset.reveal; const st = b.closest('.mstep');
    $('.mstep-b', st).hidden = false; st.classList.remove('locked'); b.remove(); shown++;
    const nx = $(`[data-reveal="${n + 1}"]`, el); if (nx) nx.disabled = false;
    if (shown === k.steps.length) $('#cdone', el).hidden = false;
  });
  $('#cok', el).onclick = e => { if (!S.cases[k.id]){ S.cases[k.id] = true; save(); addXP(30, e); confetti(80); } else toast('Déjà validé, bravo !'); casesHome(el, c); };
}

/* =================== OUTILS DU NOTARIAT =================== */
const toHaACa = m2 => { m2 = Math.max(0, Math.round(+m2 || 0)); return {ha:Math.floor(m2 / 10000), a:Math.floor(m2 % 10000 / 100), ca:m2 % 100}; };
const fmtCont = (x, acte) => acte ? `${pad2(x.ha)} ha ${pad2(x.a)} a ${pad2(x.ca)} ca` : `${x.ha} ha ${x.a} a ${x.ca} ca`;
function copyText(txt, btn){
  const ok = () => { toast('Copié !'); };
  try { navigator.clipboard.writeText(txt).then(ok, () => fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch(e){} ta.remove(); toast(done ? 'Copié !' : 'Sélectionne le texte pour le copier'); }
}

  const gen = () => {
    const n = 3 + Math.floor(Math.random() * 2); const sec = pick(['ZB', 'AK', 'B', 'AI', 'DI']); let num = 100 + Math.floor(Math.random() * 400);
    rows = Array.from({length:n}, () => ({s:sec, n:(num += 1 + Math.floor(Math.random() * 3)), ha:Math.random() < .55 ? Math.floor(Math.random() * 4) : 0, a:Math.floor(Math.random() * 100), ca:Math.floor(Math.random() * 100)}));
    const sca = rows.reduce((s, r) => s + r.ca, 0), sa = rows.reduce((s, r) => s + r.a, 0), sha = rows.reduce((s, r) => s + r.ha, 0);
    const r1 = Math.floor(sca / 100), ca = sca % 100, a2 = sa + r1, r2 = Math.floor(a2 / 100), a = a2 % 100, ha = sha + r2;

  $('#tr-new', el).onclick = gen;
  $('#tr-ok', el).onclick = e => {
    const v = id => parseInt(($(id, el).value || '').replace(/[^\d]/g, ''), 10) || 0;
    const ok = v('#tr-ha') === tot.ha && v('#tr-a') === tot.a && v('#tr-ca') === tot.ca;
    $('.tr-out', el).innerHTML = `<div class="expl"><div class="verdict ${ok ? 'good' : 'bad'}">${ok ? 'Total exact !' : 'Pas encore. Voici le calcul :'}</div>
      <p><b>1. Centiares :</b> ${rows.map(r => pad2(r.ca)).join(' + ')} = ${tot.sca} → <b>${pad2(tot.ca)} ca</b>${tot.r1 ? `, je retiens <b>${tot.r1} a</b>` : ''}.</p>
      <p><b>2. Ares :</b> ${rows.map(r => pad2(r.a)).join(' + ')}${tot.r1 ? ` + ${tot.r1} (retenue)` : ''} = ${tot.a2} → <b>${pad2(tot.a)} a</b>${tot.r2 ? `, je retiens <b>${tot.r2} ha</b>` : ''}.</p>
      <p><b>3. Hectares :</b> ${rows.map(r => r.ha).join(' + ')}${tot.r2 ? ` + ${tot.r2} (retenue)` : ''} = <b>${tot.ha} ha</b>.</p>
      <p><b>Total : <span class="mono">${fmtCont(tot, true)}</span></b></p></div>`;
    if (ok){ addXP(15, e); confetti(70); }
  };
  gen();
});

          {l:'Droit du travail', h:'Les relations entre employeurs et salariés : contrat de travail, salaire, licenciement…'},
          {l:'Procédure civile', h:'Les règles qui organisent les procès devant les juridictions civiles.'},
          {l:'Droit international privé', h:'Les rapports entre personnes privées quand un élément étranger intervient. Ex. : quelle loi s’applique au mariage d’une Française et d’un Chinois ?'}]},
        {label:'Une branche mixte', items:[
          {l:'Droit pénal', h:'Il définit les infractions et les peines. Il est à la fois public (il protège la société) et privé (il concerne les comportements des personnes entre elles).'}]}]},
      {t:'tip', k:'prof', h:'En notariat, le <b>droit civil</b> est ton terrain de jeu (famille, biens, contrats, successions), suivi de près par le <b>droit fiscal</b> : lors de nombreux actes, le notaire collecte des taxes pour l’État.'}
    ]},
    {id:'sources', n:'I.4', eyebrow:'D’où vient le droit ?', title:'Les sources du droit objectif', blocks:[
      {t:'widget', w:'pyramid'},
      {t:'h3', h:'Les sources internationales', small:'a.'},
      {t:'def', term:'Traité', h:'Accord conclu entre États (la France et un ou plusieurs pays étrangers). Pour s’appliquer en France, il doit être <b>ratifié</b> par le Président de la République ; pour certains traités, il faut d’abord l’autorisation du Parlement.'},
      {t:'quote', ref:'Article 55 de la Constitution', h:'« Les traités ou accords régulièrement ratifiés ou approuvés ont, dès leur publication, une autorité supérieure à celle des lois, sous réserve, pour chaque accord ou traité, de son application par l’autre partie. »'},
      {t:'tip', k:'info', title:'En clair', h:'Un traité passe <b>au-dessus des lois</b>, à une condition : l’autre État doit l’appliquer aussi. C’est la <b>réciprocité</b>.'},
      {t:'p', h:'<b>Le droit de l’Union européenne.</b> Le traité de Rome du <b>25 mars 1957</b> a créé la Communauté économique européenne, devenue l’<b>Union européenne</b> avec le traité de Maastricht du <b>7 février 1992</b>. L’Union compte <b>27 États</b>.'},
      {t:'vs', a:{title:'Droit originaire', items:['Les traités successifs conclus entre les États membres']}, b:{title:'Droit dérivé', items:['Les textes adoptés par les institutions de l’Union (Conseil, Commission…)', 'Règlements, directives, décisions']}},
      {t:'table', head:['Texte', 'Ce qu’il fait', 'Exemple'], rows:[
        ['Règlement', 'Portée générale : il s’applique <b>directement</b> dans tous les États membres', 'Le RGPD, sur les données personnelles'],
        ['Directive', 'Fixe des <b>objectifs</b> à atteindre dans un délai : chaque État doit la <b>transposer</b> dans son droit', 'Une directive sur les droits des consommateurs, transposée dans le Code de la consommation'],
        ['Décision', 'Directement obligatoire pour son seul <b>destinataire</b> : un État, une entreprise ou un particulier', 'Une amende infligée par la Commission à une entreprise']]},
      {t:'p', h:'Le droit de l’Union <b>l’emporte</b> sur les règles nationales qui lui sont contraires.'},
      {t:'tip', k:'piege', h:'« Règlement européen » et « règlement » français (décret, arrêté) : même mot, rien à voir. Le premier vient de l’Union, le second du pouvoir exécutif français.'},
      {t:'h3', h:'Les sources nationales : la loi', small:'b.'},
      {t:'def', term:'Loi', h:'Texte voté par le <b>Parlement</b>, composé de l’Assemblée nationale et du Sénat.'},
      {t:'p', h:'<b>Son domaine : l’article 34 de la Constitution.</b> La loi n’intervient que dans les matières qu’il énumère (ex. : les peines applicables aux crimes, les privatisations d’entreprises). Certaines relèvent de la loi <b>en totalité</b> (ex. : l’état et la capacité des personnes) ; d’autres seulement pour leurs <b>principes fondamentaux</b> (ex. : le régime de la propriété), les détails étant fixés par des <b>décrets d’application</b>.'},
      {t:'widget', w:'loi'},
      {t:'p', h:'<b>Le contrôle de la loi.</b> La loi doit respecter la Constitution : c’est le <b>contrôle de constitutionnalité</b>, effectué par le <b>Conseil constitutionnel, avant la promulgation</b>. Il ne peut être saisi que par le Président de la République, le Premier ministre, les présidents des deux assemblées, des députés ou des sénateurs.'},
      {t:'tip', k:'prof', h:'Deux précisions qui font la différence en copie : la saisine par les parlementaires exige <b>60 députés ou 60 sénateurs</b>. Et depuis 2010, un justiciable peut contester une loi déjà en vigueur au cours d’un procès : c’est la <b>question prioritaire de constitutionnalité (QPC)</b>.'},
      {t:'h3', h:'Les sources nationales : le règlement'},
      {t:'def', term:'Règlement', h:'Texte émanant du <b>pouvoir exécutif</b>. Le Président de la République et le Premier ministre prennent des <b>décrets</b> ; les ministres, les préfets et les maires prennent, quand ils y sont autorisés, des <b>arrêtés</b>.'},
      {t:'list', items:['<b>Règlements autonomes</b> : ils régissent les matières qui ne relèvent pas de la loi. Tout ce qui n’est pas attribué au Parlement relève du règlement (art. 37 de la Constitution).', '<b>Décrets d’application</b> : ils mettent la loi en œuvre.', '<b>Ordonnances</b> (art. 38) : le Gouvernement, autorisé par le Parlement, prend des mesures qui relèvent normalement de la loi.']},
      {t:'p', h:'<b>Le contrôle des règlements</b> se fait <b>a posteriori</b>, une fois le texte entré en vigueur. Toute personne à qui un règlement porte préjudice peut contester sa conformité aux lois (ou à la Constitution, pour un règlement autonome), de deux façons :'},
      {t:'vs', a:{title:'Voie d’action', items:['Recours pour excès de pouvoir devant les juridictions administratives', 'Délai : <b>2 mois</b> à compter de la publication', 'Résultat : le règlement est <b>annulé</b>, pour tout le monde']}, b:{title:'Voie d’exception', items:['On invoque l’illégalité du règlement pendant un procès : c’est l’<b>exception d’illégalité</b>', '<b>Aucun délai</b>', 'Résultat : le juge <b>écarte</b> le règlement dans ce procès, mais le texte <b>subsiste</b>']}},
      {t:'tip', k:'memo', h:'La <b>loi</b> est contrôlée <b>avant</b> (Conseil constitutionnel). Le <b>règlement</b> est contrôlé <b>après</b> (juge administratif).'},
      {t:'h3', h:'La coutume et la jurisprudence'},
      {t:'def', term:'Coutume', h:'Règle de droit née d’une <b>pratique constante</b> et considérée comme <b>obligatoire</b>. Elle ne peut jamais aller à l’encontre d’une loi.'},
      {t:'def', term:'Jurisprudence', h:'L’ensemble des <b>décisions rendues par les tribunaux</b>.'},
      {t:'p', h:'Est-ce une source du droit ? À première vue non : le juge ne fait qu’appliquer une règle à un litige. Pourtant, deux arguments montrent qu’il crée du droit.'},
      {t:'quote', ref:'Article 4 du Code civil', h:'« Le juge qui refusera de juger, sous prétexte du silence, de l’obscurité ou de l’insuffisance de la loi, pourra être poursuivi comme coupable de déni de justice. »'},
      {t:'list', num:true, items:['<b>L’obligation de juger</b> : même si la loi est obscure, imprécise ou muette, le juge doit trancher. Il est donc conduit à <b>interpréter</b> ou à <b>compléter</b> la loi.', '<b>La hiérarchie des juridictions</b> : les juges de première instance suivent les cours d’appel pour ne pas voir leurs jugements réformés ; les cours d’appel suivent la Cour de cassation pour éviter la cassation de leurs décisions.']},
      {t:'tip', k:'ex', h:'Le <b>droit à l’image</b> n’est écrit dans aucun texte : ce sont les juges qui l’ont dégagé à partir de l’article 9 du Code civil. Une vraie création de la jurisprudence (chapitre 2).'}
    ]},
    {id:'application', n:'II', eyebrow:'Dans l’espace et dans le temps', title:'L’application de la loi', blocks:[
      {t:'h3', h:'Dans l’espace', small:'1.'},
      {t:'p', h:'La loi française s’applique en principe sur <b>tout le territoire</b>. Exceptions : l’<b>Alsace-Moselle</b> conserve un droit local dans certaines matières, et la loi ne s’applique pas totalement dans les <b>collectivités d’outre-mer</b>.'},
      {t:'tip', k:'notaire', h:'Un exemple qui te concernera : en Alsace-Moselle, la publicité foncière ne passe pas par le service de la publicité foncière mais par le <b>livre foncier</b>.'},
      {t:'p', h:'Quand une situation comporte un <b>élément d’extranéité</b> (un étranger en France, un Français à l’étranger), la loi applicable est désignée par le <b>droit international privé</b>.'},
      {t:'h3', h:'Entrée en vigueur et abrogation', small:'2.'},
      {t:'quote', ref:'Article 1er du Code civil (extrait)', h:'« Les lois et, lorsqu’ils sont publiés au Journal officiel de la République française, les actes administratifs entrent en vigueur à la date qu’ils fixent ou, à défaut, le lendemain de leur publication. »'},
      {t:'steps', items:[{l:'Vote', h:' : par le Parlement'}, {l:'Promulgation', h:' : décret du Président de la République'}, {l:'Publication au Journal officiel', h:' : tout le monde peut connaître la loi'}, {l:'Entrée en vigueur', h:' : le lendemain, sauf date différée ou mesures d’application nécessaires'}]},
      {t:'p', h:'Si certaines dispositions ont besoin de <b>mesures d’application</b>, leur entrée en vigueur attend celle de ces mesures.'},
      {t:'vs', a:{title:'Abrogation expresse', items:['Un texte plus récent indique clairement que la règle antérieure est abrogée']}, b:{title:'Abrogation tacite', items:['La loi nouvelle est incompatible avec l’ancienne', 'Les dispositions anciennes contraires sont considérées comme abrogées']}},
      {t:'p', h:'Une fois abrogée, c’est-à-dire supprimée, une loi ne produit plus d’effet.'},
      {t:'h3', h:'Les conflits de lois dans le temps', small:'3.'},
      {t:'quote', ref:'Article 2 du Code civil', h:'« La loi ne dispose que pour l’avenir ; elle n’a point d’effet rétroactif. »'},
      {t:'p', h:'<b>Principe n° 1 : la non-rétroactivité.</b> La loi nouvelle ne remet pas en cause les situations <b>entièrement réalisées</b> (ex. : un contrat déjà entièrement exécuté), ni les <b>effets passés</b> d’une situation en cours.'},
      {t:'p', h:'<b>Les exceptions :</b> certaines lois sont rétroactives.'},
      {t:'list', items:['<b>Rétroactivité expresse</b> : le législateur déclare lui-même la loi rétroactive.', '<b>Lois pénales plus douces</b> : la sanction moins sévère s’applique aux faits commis avant la loi, tant qu’ils n’ont pas été jugés.', '<b>Lois interprétatives</b> : elles éclairent une loi antérieure obscure et s’incorporent à elle.']},
      {t:'tip', k:'memo', h:'Les exceptions forment la <b>P.I.E.</b> : Pénale plus douce, Interprétative, Expresse. La pie, seul oiseau qui vole vers le passé.'},
      {t:'tip', k:'prof', h:'À l’inverse, une loi pénale <b>plus sévère</b> n’est jamais rétroactive : c’est un principe constitutionnel.'},
      {t:'p', h:'<b>Principe n° 2 : l’effet immédiat.</b> Dès son entrée en vigueur, la loi nouvelle s’applique aux situations <b>nées après</b> elle et aux <b>effets futurs</b> des situations en cours.'},
      {t:'p', h:'<b>L’exception des contrats.</b> Les contrats en cours restent régis par la loi en vigueur <b>au jour de leur conclusion</b>, pour ne pas déjouer les prévisions des parties. Sauf si la loi nouvelle est <b>d’ordre public</b> : elle s’applique alors immédiatement aux effets futurs du contrat.'},
      {t:'widget', w:'temps'},
      {t:'tip', k:'ex', h:'Léa signe en mars un contrat d’entretien de deux ans. En juin, une loi nouvelle, non d’ordre public, change les règles de ce type de contrat : celui de Léa reste soumis à l’ancienne loi jusqu’à son terme. Si la loi était d’ordre public, elle s’imposerait au contrat à partir de juin.'}
    ]}
  ],
  essentials:[
    'La règle de droit est <b>générale, obligatoire, extérieure</b> à la volonté individuelle et <b>sanctionnée</b> par l’État.',
    'Règle <b>impérative</b> : on ne peut pas y déroger. Règle <b>supplétive</b> : on peut prévoir autre chose, notamment par contrat.',
    '<b>Droit public</b> : individus et État, États entre eux. <b>Droit privé</b> : individus entre eux. Le droit pénal est <b>mixte</b>.',
    'Les <b>traités</b> sont supérieurs aux lois (art. 55, réciprocité). Règlement UE : direct ; directive : à transposer ; décision : pour son destinataire.',
    'La <b>loi</b> est votée par le Parlement dans les matières de l’<b>art. 34</b>, contrôlée par le <b>Conseil constitutionnel avant promulgation</b>.',
    'Le <b>règlement</b> vient de l’exécutif (autonome, décret d’application, ordonnance art. 38). Contrôle : <b>voie d’action</b> (2 mois, annulation) ou <b>exception d’illégalité</b> (sans délai, texte écarté).',
    '<b>Coutume</b> : jamais contre la loi. <b>Jurisprudence</b> : source discutée, mais art. 4 C. civ. et hiérarchie des juridictions.',
    'Entrée en vigueur : le <b>lendemain de la publication au JO</b> (art. 1 C. civ.). Abrogation expresse ou tacite.',
    'Art. 2 C. civ. : <b>non-rétroactivité</b> + <b>effet immédiat</b>. Exceptions P.I.E. Contrats en cours : <b>loi ancienne</b>, sauf loi d’ordre public.'
  ],
  flashcards:[
    {q:'Pourquoi la société a-t-elle besoin de règles de droit ?', a:'Aucun groupe ne survit si chacun agit selon son bon vouloir. Il faut des règles de conduite assorties de sanctions, appliquées par l’État (la justice privée mènerait à l’anarchie).'},
    {q:'Quels sont les caractères de la règle de droit ?', a:'Générale, obligatoire (sanctionnée par l’État), extérieure à la volonté individuelle. Mémo : G.O.E.S.'},
    {q:'Une règle qui ne concerne que les locataires est-elle générale ?', a:'Oui. À l’intérieur de la catégorie visée, elle s’applique de façon uniforme à tous.'},
    {q:'Règle impérative ou supplétive : la différence ?', a:'Impérative : impossible d’y déroger. Supplétive : elle s’applique sauf si les intéressés ont prévu autre chose, notamment dans un contrat.'},
    {q:'Droit public / droit privé ?', a:'Public : rapports entre les individus et l’État, et entre États. Privé : rapports des individus entre eux.'},
    {q:'Les 5 branches du droit public ?', a:'Constitutionnel, administratif, finances publiques, fiscal, international public.'},
    {q:'Les branches du droit privé ?', a:'Droit civil, commercial (de l’entreprise), du travail, procédure civile, et droit international privé.'},
    {q:'Pourquoi le droit pénal est-il « mixte » ?', a:'Il définit les infractions et les peines : il protège la société (public) mais vise les comportements des personnes entre elles (privé).'},
    {q:'Qu’est-ce que le droit international privé ?', a:'Les règles applicables aux rapports entre personnes privées quand il y a un élément étranger (ex. : le mariage d’une Française et d’un Chinois).'},
    {q:'Qu’est-ce qu’un traité ?', a:'Un accord conclu entre États. Pour s’appliquer en France, il doit être ratifié par le Président de la République (parfois après autorisation du Parlement).'},
    {q:'Que dit l’article 55 de la Constitution ?', a:'Les traités régulièrement ratifiés ont, dès leur publication, une autorité supérieure à celle des lois, à condition que l’autre partie les applique (réciprocité).'},
    {q:'Droit de l’UE originaire et dérivé ?', a:'Originaire : les traités entre États membres. Dérivé : les textes des institutions (règlements, directives, décisions).'},
    {q:'Le règlement européen ?', a:'Acte de portée générale, directement applicable dans tous les États membres.'},
    {q:'La directive européenne ?', a:'Elle fixe des objectifs à atteindre dans un délai ; chaque État doit la transposer dans son droit interne.'},
    {q:'La décision européenne ?', a:'Texte directement obligatoire pour son destinataire : un État, une entreprise ou un particulier.'},
    {q:'Dates clés de l’Union européenne ?', a:'Traité de Rome : 25 mars 1957 (CEE). Traité de Maastricht : 7 février 1992 (Union européenne). 27 États membres.'},
    {q:'Qui vote la loi ?', a:'Le Parlement : l’Assemblée nationale et le Sénat.'},
    {q:'Que prévoit l’article 34 de la Constitution ?', a:'Les matières réservées à la loi : certaines en totalité (état et capacité des personnes), d’autres seulement pour les principes fondamentaux (régime de la propriété).'},
    {q:'Projet de loi ou proposition de loi ?', a:'Projet : initiative du Gouvernement. Proposition : initiative des députés ou des sénateurs.'},
    {q:'Qu’est-ce que la navette parlementaire ?', a:'Les allers-retours du texte entre l’Assemblée et le Sénat en cas de désaccord : deux lectures par chambre, puis éventuellement une commission mixte paritaire. En dernier recours, le Gouvernement peut donner le dernier mot à l’Assemblée nationale.'},
    {q:'Qu’est-ce que la promulgation ?', a:'L’ordre d’exécuter la loi, donné par le Président de la République au moyen d’un décret.'},
    {q:'Qui contrôle la constitutionnalité des lois, et quand ?', a:'Le Conseil constitutionnel, avant la promulgation. Il est saisi par le Président, le Premier ministre, les présidents des deux assemblées, des députés ou des sénateurs.'},
    {q:'Qu’est-ce qu’un règlement en droit interne ?', a:'Un texte du pouvoir exécutif : décrets (Président, Premier ministre) et arrêtés (ministres, préfets, maires).'},
    {q:'Les trois types de règlements ?', a:'Règlements autonomes (matières hors loi), décrets d’application (mettent la loi en œuvre), ordonnances (art. 38 : le Gouvernement agit dans le domaine de la loi, sur autorisation du Parlement).'},
    {q:'La voie d’action contre un règlement ?', a:'Un recours pour excès de pouvoir devant le juge administratif, dans les 2 mois de la publication, pour obtenir l’annulation du règlement.'},
    {q:'L’exception d’illégalité ?', a:'Invoquer l’illégalité d’un règlement au cours d’un procès, sans délai. Si elle est reconnue, le juge écarte le règlement dans ce litige, mais le texte subsiste.'},
    {q:'Qu’est-ce que la coutume ?', a:'Une règle née d’une pratique constante et considérée comme obligatoire. Elle ne peut pas aller contre la loi.'},
    {q:'Qu’est-ce que la jurisprudence ?', a:'L’ensemble des décisions rendues par les tribunaux.'},
    {q:'Que dit l’article 4 du Code civil ?', a:'Le juge qui refuse de juger sous prétexte du silence, de l’obscurité ou de l’insuffisance de la loi commet un déni de justice. Il doit donc interpréter ou compléter la loi.'},
    {q:'Pourquoi les juges suivent-ils les positions de la Cour de cassation ?', a:'À cause de la hiérarchie des juridictions : pour éviter que leurs décisions soient réformées en appel ou cassées.'},
    {q:'La loi française s’applique-t-elle partout en France ?', a:'En principe oui, avec des exceptions : l’Alsace-Moselle (droit local) et les collectivités d’outre-mer.'},
    {q:'Quand une loi entre-t-elle en vigueur ?', a:'Le lendemain de sa publication au Journal officiel, sauf date fixée par la loi ou mesures d’application nécessaires (art. 1 C. civ.).'},
    {q:'Abrogation expresse ou tacite ?', a:'Expresse : un texte nouveau dit que l’ancien est abrogé. Tacite : la loi nouvelle est incompatible avec l’ancienne.'},
    {q:'Que dit l’article 2 du Code civil ?', a:'« La loi ne dispose que pour l’avenir ; elle n’a point d’effet rétroactif. »'},
    {q:'Les exceptions à la non-rétroactivité ?', a:'Rétroactivité expresse, lois pénales plus douces (faits pas encore jugés), lois interprétatives. Mémo : la P.I.E.'},
    {q:'Effet immédiat de la loi nouvelle ?', a:'Elle s’applique aux situations nées après son entrée en vigueur et aux effets futurs des situations en cours.'},
    {q:'Que devient un contrat en cours quand une loi nouvelle arrive ?', a:'Il reste régi par la loi en vigueur au jour de sa conclusion (respect des prévisions des parties), sauf si la loi nouvelle est d’ordre public.'}
  ],
  quiz:[
    {q:'Lequel n’est PAS un caractère de la règle de droit ?', o:['Générale', 'Obligatoire', 'Individuelle', 'Sanctionnée par l’État'], a:2, e:'La règle de droit est générale : elle ne vise pas une personne désignée individuellement. Elle est aussi extérieure à la volonté individuelle.'},
    {q:'Une loi qui ne concerne que les personnes mariées est…', o:['Générale, car elle s’applique de façon uniforme à toute la catégorie', 'Individuelle, donc pas une règle de droit', 'Une décision européenne', 'Une coutume'], a:0, e:'À l’intérieur de la catégorie visée, la règle s’applique à tous de la même façon : elle reste générale.'},
    {q:'Une règle supplétive…', o:['s’impose sans aucune exception', 's’applique sauf si les intéressés ont prévu autre chose', 'ne concerne que les commerçants', 'n’est jamais sanctionnée'], a:1, e:'On peut y déroger, notamment par contrat.'},
    {q:'Des époux sans contrat de mariage relèvent du régime légal. Cette règle est…', o:['Impérative', 'Supplétive'], a:1, e:'Ils peuvent choisir un autre régime par contrat de mariage, chez le notaire : la règle ne s’applique qu’à défaut de choix.'},
    {q:'Le droit public régit…', o:['les rapports entre particuliers', 'les rapports entre les individus et l’État, et entre États', 'uniquement les impôts', 'les contrats de travail'], a:1},
    {q:'Le droit du travail fait partie du…', o:['droit public', 'droit privé', 'droit international public', 'droit constitutionnel'], a:1, e:'Il régit les rapports entre personnes privées : employeurs et salariés.'},
    {q:'Le droit fiscal fait partie du…', o:['droit privé', 'droit public', 'droit pénal', 'droit international privé'], a:1},
    {q:'Pourquoi dit-on que le droit pénal est mixte ?', o:['Il est appliqué par des juges et des avocats', 'Il relève à la fois du droit public et du droit privé', 'Il ne s’applique qu’en Alsace-Moselle', 'Il mélange lois et coutumes'], a:1},
    {q:'Quelle loi s’applique au mariage d’une Française et d’un Chinois ? C’est une question de…', o:['droit international public', 'droit international privé', 'droit constitutionnel', 'droit administratif'], a:1, e:'Rapports entre personnes privées avec un élément étranger : droit international privé.'},
    {q:'D’après l’article 55 de la Constitution, un traité régulièrement ratifié a une autorité…', o:['inférieure aux lois', 'égale aux lois', 'supérieure aux lois, sous réserve de réciprocité', 'supérieure à la Constitution'], a:2},
    {q:'Un règlement européen…', o:['doit être transposé par chaque État', 's’applique directement dans tous les États membres', 'ne vise qu’un destinataire', 'n’a aucune valeur en France'], a:1},
    {q:'Une directive européenne…', o:['s’applique directement sans rien faire', 'fixe des objectifs que chaque État doit transposer dans un délai', 'est un jugement de la Cour de cassation', 'ne concerne que les entreprises'], a:1},
    {q:'Qui est à l’origine d’un « projet de loi » ?', o:['Les députés', 'Les sénateurs', 'Le Gouvernement', 'Le Conseil constitutionnel'], a:2, e:'Projet = Gouvernement ; proposition = parlementaires.'},
    {q:'En cas de désaccord persistant entre l’Assemblée et le Sénat…', o:['le Sénat a toujours le dernier mot', 'le Président tranche seul', 'une CMP peut être réunie et le Gouvernement peut donner le dernier mot à l’Assemblée', 'le texte est abandonné automatiquement'], a:2},

    {id:'efd1_c1', title:'Le contrat de Léa', tag:'Loi dans le temps', facts:['Le 1er mars, Léa signe avec un garage un contrat d’entretien de sa voiture pour deux ans.', 'Le 1er juin, une loi nouvelle entre en vigueur : elle impose de nouvelles obligations dans ce type de contrat. Elle n’est pas d’ordre public.'], q:'Le contrat de Léa doit-il respecter la loi nouvelle ?', steps:[

      {l:'Le problème de droit', h:'Une loi nouvelle s’applique-t-elle à un contrat conclu avant son entrée en vigueur ?'},
      {l:'Les règles applicables', h:'Art. 2 C. civ. : la loi ne dispose que pour l’avenir. En principe, effet immédiat sur les effets futurs des situations en cours. <b>Exception</b> : les contrats en cours restent régis par la loi du jour de leur conclusion, sauf loi d’ordre public.'},

    {id:'efd1_c2', title:'Tom et la loi plus douce', tag:'Rétroactivité', facts:['En janvier, Tom commet une infraction punie de 2 ans d’emprisonnement.', 'Le 1er mars, une loi nouvelle réduit la peine maximale à 1 an. Le procès de Tom a lieu en mai.'], q:'Quelle peine maximale Tom encourt-il ?', steps:[
      {l:'Les faits', h:'Une infraction est commise avant une loi qui adoucit la peine ; le jugement intervient après.'},
      {l:'Le problème de droit', h:'Une loi pénale plus douce s’applique-t-elle à des faits commis avant son entrée en vigueur ?'},
      {l:'Les règles applicables', h:'Principe : non-rétroactivité (art. 2 C. civ.). Exception : les lois pénales plus douces s’appliquent aux faits commis avant leur entrée en vigueur, s’ils n’ont pas encore été jugés. À l’inverse, une loi plus sévère n’est jamais rétroactive.'},
      {l:'L’application aux faits', h:'La loi du 1er mars est plus douce, et Tom n’a pas encore été jugé.'},
      {l:'La conclusion', h:'Tom encourt au maximum <b>1 an</b>. Si la loi avait aggravé la peine, il serait resté soumis aux 2 ans de la loi ancienne.'}]},
    {id:'efd1_c3', title:'Karim contre l’arrêté du maire', tag:'Contrôle des règlements', facts:['Un arrêté municipal publié il y a trois mois interdit le stationnement des camionnettes dans une rue. Karim, artisan, est poursuivi pour ne pas l’avoir respecté.', 'Il est persuadé que cet arrêté est contraire à la loi.'], q:'Comment Karim peut-il contester cet arrêté, et avec quel résultat ?', steps:[

      {l:'Le problème de droit', h:'Comment contester la légalité d’un règlement publié depuis plus de deux mois ?'},
      {l:'Les règles applicables', h:'Deux voies : la <b>voie d’action</b> (recours pour excès de pouvoir devant le juge administratif, dans les 2 mois de la publication : annulation) et la <b>voie d’exception</b> (exception d’illégalité soulevée pendant un procès, sans délai : le règlement est écarté dans ce litige mais subsiste).'},

      {l:'La conclusion', h:'Karim doit invoquer l’<b>exception d’illégalité</b>. Si le juge lui donne raison, l’arrêté ne lui sera pas appliqué, mais il restera en vigueur pour les autres.'}]}
  ]

<script>
JLG.chapter({
  id:'efd2', subject:'efd', order:2, num:'2', added:'2026-10-06', minutes:30,
  kicker:'Chapitre 2', short:'Les droits subjectifs', title:'Les droits subjectifs', titleHtml:'Les droits <em>subjectifs</em>',
  intro:'Le droit objectif, c’est la règle du jeu. Les droits subjectifs, ce sont les cartes que chaque joueur a en main : les prérogatives que le droit reconnaît à une personne, sur des biens ou envers d’autres personnes.',
  objectives:['Définir le droit subjectif et le patrimoine', 'Distinguer droits patrimoniaux et extrapatrimoniaux', 'Distinguer droits réels (principaux, accessoires), personnels et intellectuels', 'Maîtriser usus, fructus, abusus et les démembrements de la propriété', 'Appliquer l’article 9 du Code civil (vie privée, image) dans un cas pratique'],
  traps:[
    {t:'Créancier chirographaire = aucune priorité', h:'Sans sûreté, il n’a ni droit de suite ni droit de préférence : il est payé à égalité avec les autres créanciers.'},
    {t:'Usage ≠ usufruit', h:'L’usufruitier peut louer et encaisser les loyers. L’usager ne prend les fruits que pour ses besoins, jamais pour en tirer des revenus.'},
    {t:'Gage ou nantissement ?', h:'Gage : un meuble que l’on peut toucher (voiture, bijou). Nantissement : un meuble incorporel (fonds de commerce, parts sociales).'},
    {t:'Même célèbre, on a une vie privée', h:'La notoriété justifie l’intérêt du public pour la carrière, pas pour la vie familiale, sentimentale ou la santé.'},
    {t:'Autorisation d’image = expresse et spéciale', h:'Une autorisation donnée pour une publicité ne vaut pas pour une autre utilisation.'},
    {t:'Un patrimoine même vide', h:'Toute personne a un patrimoine, même sans aucun bien, et même s’il est déficitaire.'}
  ],
  sections:[
    {id:'notion', n:'—', eyebrow:'Introduction', title:'Qu’est-ce qu’un droit subjectif ?', blocks:[
      {t:'def', term:'Droit subjectif', h:'Prérogative dont dispose une personne à l’égard de biens ou de personnes. Il est dit « subjectif » car il a un <b>titulaire</b>, qui en est le <b>sujet</b>.'},
      {t:'tip', k:'ex', h:'Le droit de propriété est un droit subjectif : il permet à son titulaire d’utiliser sa chose, de la louer, de la vendre…'},
      {t:'vs', a:{title:'Droit objectif', items:['L’ensemble des règles de droit', 'La règle du jeu, la même pour tous']}, b:{title:'Droits subjectifs', items:['Les prérogatives d’une personne', 'Accordés et sanctionnés par le droit objectif']}},
      {t:'tree', root:{l:'Les droits subjectifs', kids:[
        {l:'Droits patrimoniaux', h:'Évaluables en argent : ils entrent dans le patrimoine', kids:[
          {l:'Droits réels', h:'Sur une chose. Principaux (propriété, usufruit…) ou accessoires (hypothèque, gage, nantissement)'},
          {l:'Droits personnels', h:'Contre une personne : le droit de créance'},
          {l:'Droits intellectuels', h:'Sur une création ou une clientèle : droit d’auteur, brevet, fonds de commerce'}]},
        {l:'Droits extrapatrimoniaux', h:'Non évaluables en argent : vie privée, image, voix, droit moral de l’auteur…'}]}}
    ]},
    {id:'patrimoine', n:'I', eyebrow:'Le contenant', title:'Le patrimoine', blocks:[
      {t:'def', term:'Patrimoine', h:'L’ensemble des droits et obligations d’une personne <b>évaluables en argent</b>. Il comprend un <b>actif</b> (les droits) et un <b>passif</b> (les obligations, les dettes).'},
      {t:'widget', w:'patrimoine'},
      {t:'table', head:['', 'Exemples'], rows:[
        ['Actif immobilier', 'Terrains, maisons, appartements, immeubles'],
        ['Actif mobilier', 'Voiture, comptes bancaires, <b>actions</b> (une petite part d’une entreprise), <b>obligations</b> (un prêt consenti à un État ou à une grande entreprise)'],
        ['Passif', 'Crédit immobilier (long terme), crédit à la consommation, dettes fiscales, dettes de la vie courante']]},
      {t:'h3', h:'Une universalité juridique'},
      {t:'p', h:'Le patrimoine est un <b>tout</b>, distinct des éléments qui le composent : il réunit l’actif et le passif, et <b>l’actif répond du passif</b>. Un créancier impayé peut donc saisir n’importe quel bien de son débiteur, le faire vendre et se payer sur le prix.'},
      {t:'quote', ref:'Article 2284 du Code civil', h:'« Quiconque s’est obligé personnellement, est tenu de remplir son engagement sur tous ses biens mobiliers et immobiliers, présents et à venir. »'},
      {t:'def', term:'Créancier chirographaire', h:'Créancier qui n’a <b>aucune sûreté</b>. Il dispose seulement d’un <b>droit de gage général</b> sur tout le patrimoine de son débiteur (art. 2284).'},
      {t:'h3', h:'Un lien avec la personne'},
      {t:'list', num:true, items:['<b>Seules les personnes ont un patrimoine</b> : les personnes physiques et les personnes morales (sociétés, associations…).', '<b>Toute personne a nécessairement un patrimoine</b>, même vide. Il n’est donc pas transmissible entre vifs : on peut vendre ou donner des biens, mais pas son patrimoine dans sa globalité.', '<b>Une personne n’a qu’un seul patrimoine</b>.']},
      {t:'tip', k:'prof', h:'C’est la théorie classique d’<b>Aubry et Rau</b> (XIXe siècle). Elle connaît aujourd’hui des exceptions : depuis 2022, l’entrepreneur individuel a deux patrimoines (professionnel et personnel), et la fiducie crée un patrimoine affecté à un but.'},
      {t:'tip', k:'notaire', h:'Au décès, le patrimoine, actif <b>et</b> passif, est transmis aux héritiers : c’est tout l’enjeu du règlement d’une succession à l’étude (les héritiers peuvent aussi y renoncer).'}
    ]},
    {id:'patrimoniaux', n:'II', eyebrow:'Évaluables en argent', title:'Les droits patrimoniaux', blocks:[
      {t:'p', h:'Ils sont <b>évaluables en argent</b> et entrent donc dans le patrimoine. Ils sont <b>cessibles</b>, <b>saisissables</b> et <b>transmissibles</b>, entre vifs (vente, donation) ou à cause de mort.'},
      {t:'tip', k:'memo', h:'Patrimonial = je peux le <b>Céder</b>, il peut être <b>Saisi</b>, il se <b>Transmet</b>. Extrapatrimonial = les « 3 I » : <b>I</b>ncessible, <b>I</b>nsaisissable, <b>I</b>mprescriptible.'},
      {t:'h3', h:'Les droits réels', small:'A.'},
      {t:'def', term:'Droit réel', h:'Droit exercé <b>directement</b> par une personne <b>sur une chose</b> (du latin <i>res</i>, la chose).'},
      {t:'vs', a:{title:'Droit de suite', items:['Revendiquer la chose « en quelques mains qu’elle se trouve »', 'Je suis ma chose partout']}, b:{title:'Droit de préférence', items:['Être préféré à toute autre personne qui revendique la chose', 'Je passe devant les autres créanciers']}},
      {t:'tip', k:'ex', h:'Si un bien est saisi et vendu, le créancier qui a un droit réel accessoire (une hypothèque, par exemple) est payé <b>avant</b> les créanciers chirographaires.'},
      {t:'h3', h:'1°) Les droits réels principaux'},
      {t:'quote', ref:'Article 544 du Code civil', h:'« La propriété est le droit de jouir et disposer des choses de la manière la plus absolue, pourvu qu’on n’en fasse pas un usage prohibé par les lois ou par les règlements. »'},
      {t:'chips', groups:[{label:'Les 3 prérogatives du propriétaire', items:[
        {l:'Usus', h:'Le droit d’<b>utiliser</b> la chose : habiter sa maison, conduire sa voiture.'},
        {l:'Fructus', h:'Le droit d’en <b>percevoir les fruits</b> : les loyers d’un appartement loué, les récoltes d’un champ.'},
        {l:'Abusus', h:'Le droit d’en <b>disposer</b> : la vendre, la donner, voire la détruire.'}]}]},
      {t:'widget', w:'demembrement'},
      {t:'p', h:'Les <b>droits réels démembrés</b> ne confèrent qu’une ou deux de ces prérogatives :'},
      {t:'list', items:['<b>Usufruit</b> : usus + fructus ; le <b>nu-propriétaire</b> conserve l’abusus.', '<b>Usage</b> : user et percevoir les fruits, mais seulement <b>dans la limite de ses besoins</b>, pas pour en tirer des revenus.', '<b>Habitation</b> : un droit d’usage limité à l’<b>habitation familiale</b>.', '<b>Servitude</b> : le propriétaire d’un fonds use de certaines prérogatives sur le fonds voisin (passage, puisage, vue, écoulement des eaux). Celui qui en profite est le <b>fonds dominant</b>, celui qui la subit le <b>fonds servant</b>.', '<b>Emphytéose</b> : un bail de très longue durée, de <b>18 à 99 ans</b>.']},
      {t:'tip', k:'memo', h:'<b>USUFRUIT = USUS + FRUCTUS.</b> Le mot contient sa propre définition. Ce qui reste au propriétaire, l’abusus, est une propriété « toute nue » : la nue-propriété.'},
      {t:'tip', k:'notaire', h:'Classique en étude : des parents donnent la <b>nue-propriété</b> de leur maison à leurs enfants et en gardent l’<b>usufruit</b>. Ils y vivent (ou la louent) toute leur vie ; à leur décès, l’usufruit s’éteint et les enfants deviennent pleins propriétaires.'},
      {t:'h3', h:'2°) Les droits réels accessoires'},
      {t:'p', h:'Ils n’existent pas seuls : ils sont l’<b>accessoire d’une créance</b> qu’ils garantissent. On les appelle des <b>sûretés réelles</b>.'},
      {t:'table', head:['Sûreté', 'Porte sur', 'Exemple'], rows:[
        ['Hypothèque', 'Un <b>immeuble</b>', 'La banque prend une hypothèque sur la maison qu’elle finance'],
        ['Gage', 'Un <b>meuble corporel</b>', 'Une voiture, un bijou, un tableau'],
        ['Nantissement', 'Un <b>meuble incorporel</b>', 'Un fonds de commerce, des parts sociales']]},
      {t:'p', h:'Le créancier titulaire d’un gage ou d’une hypothèque a sur le bien un <b>droit de préférence</b> sur les autres créanciers, et un <b>droit de suite</b> : si le bien est vendu, la sûreté le suit, et le créancier peut le saisir entre les mains de l’acheteur.'},
      {t:'tip', k:'notaire', h:'Avant toute vente, le notaire vérifie au service de la publicité foncière si l’immeuble est grevé d’hypothèques : elles doivent être réglées pour que l’acheteur reçoive un bien libre.'},
      {t:'h3', h:'Les droits personnels', small:'B.'},
      {t:'def', term:'Droit personnel (de créance)', h:'Droit qui repose sur une relation entre deux personnes : il permet à l’une (le <b>créancier</b>) d’exiger quelque chose de l’autre (le <b>débiteur</b>). Il ne donne <b>ni droit de suite, ni droit de préférence</b>.'},
      {t:'tip', k:'ex', h:'Tu prêtes 500 € à un ami : tu as un droit personnel contre lui. S’il a d’autres dettes, tu passes au même rang que ses autres créanciers chirographaires.'},
      {t:'vs', a:{title:'Droit réel', items:['Sur une <b>chose</b>', 'Droit de suite + droit de préférence', 'Ex. : propriété, usufruit, hypothèque']}, b:{title:'Droit personnel', items:['Contre une <b>personne</b>', 'Ni suite, ni préférence', 'Ex. : se faire rembourser un prêt']}},
      {t:'h3', h:'Les droits intellectuels', small:'C.'},
      {t:'p', h:'Ils portent sur une <b>création intellectuelle</b> ou une <b>clientèle</b>. Leur objet est immatériel et ils confèrent un <b>droit exclusif d’exploitation</b>.'},
      {t:'list', items:['<b>L’auteur</b> (écrivain, compositeur…) exploite son œuvre et en tire profit. Il a aussi un <b>droit moral</b> pour veiller au respect de son œuvre : ce droit moral est <b>extrapatrimonial</b>.', '<b>L’inventeur</b> titulaire d’un <b>brevet</b> a un monopole d’exploitation : c’est la propriété industrielle.', '<b>Le titulaire d’un fonds de commerce</b> a un droit de clientèle : il l’exploite et peut la céder à son successeur.']}
    ]},
    {id:'extrapatrimoniaux', n:'III', eyebrow:'Hors du patrimoine', title:'Les droits extrapatrimoniaux', blocks:[
      {t:'p', h:'Ils ne sont <b>pas évaluables en argent</b> et n’entrent donc pas dans le patrimoine. Ils sont en principe <b>incessibles, insaisissables et imprescriptibles</b>. Ce sont des droits inhérents à la personne, qui protègent sa personnalité : les <b>droits de la personnalité</b>.'},
      {t:'chips', groups:[{label:'Exemples', items:[
        {l:'Vie privée', h:'Le droit au respect de sa vie privée (art. 9 C. civ.).'},
        {l:'Image', h:'Le droit de s’opposer à la diffusion de son image sans autorisation.'},
        {l:'Voix', h:'Comme l’image, la voix est protégée par la jurisprudence sur le fondement de l’article 9.'},
        {l:'Vie familiale', h:'Le respect de la vie familiale, mais aussi des convictions politiques et de la vie professionnelle.'}]}]},
      {t:'tip', k:'info', title:'Une frontière qui n’est pas étanche', h:'Un droit extrapatrimonial peut produire des effets en argent : un artiste <b>vend</b> à un magazine les photos de son mariage (sa vie privée devient rémunérée) ; une atteinte à la vie privée se répare par des <b>dommages-intérêts</b>. La distinction reste claire et utile.'},
      {t:'h3', h:'Le droit au respect de la vie privée'},
      {t:'quote', ref:'Article 9 du Code civil', h:'« Chacun a droit au respect de sa vie privée. Les juges peuvent, sans préjudice de la réparation du dommage subi, prescrire toutes mesures, telles que séquestre, saisie et autres, propres à empêcher ou faire cesser une atteinte à l’intimité de la vie privée : ces mesures peuvent, s’il y a urgence, être ordonnées en référé. »'},
      {t:'p', h:'La Cour de cassation précise que <b>toute personne</b>, quels que soient son rang, sa naissance, sa fortune ou ses fonctions, a droit au respect de sa vie privée. Le simple constat de l’atteinte ouvre droit à <b>réparation</b>.'},
      {t:'p', h:'La loi ne définit pas la vie privée : ce sont les juges qui en ont fixé les contours.'},
      {t:'list', items:['Vie sentimentale et sexuelle, vie familiale', 'État de santé', 'Domicile', 'Patrimoine des particuliers (les responsables politiques, eux, doivent publier une déclaration de patrimoine)', 'Adhésion à un syndicat ou à un parti politique', 'Numéro de téléphone, numéro de sécurité sociale, correspondances', 'Profil de réseau social, adresse IP d’un ordinateur']},
      {t:'p', h:'<b>Ce n’est pas un droit absolu.</b> Il faut le concilier avec d’autres valeurs d’égale importance : le <b>droit à l’information</b> du public et le <b>droit à la preuve</b>. Le juge exerce un <b>contrôle de proportionnalité</b>.'},
      {t:'tip', k:'ex', h:'La filature d’un salarié organisée par son employeur pour surveiller son activité est un <b>moyen de preuve illicite</b> dès lors qu’elle porte atteinte à sa vie privée.'},
      {t:'h3', h:'Le droit à l’image'},
      {t:'def', term:'Image', h:'La représentation d’une personne, ou même d’un bien, par quelque moyen que ce soit.'},
      {t:'p', h:'Aucun texte ne consacre le droit à l’image : la jurisprudence l’a construit à partir de l’<b>article 9</b>, qui permet de dégager de nouveaux droits (l’image, la voix).'},
      {t:'list', num:true, items:['<b>Principe</b> : publier l’image d’une personne exige son <b>autorisation expresse et spéciale</b> (pour un mineur : celle de ses parents).', '<b>Exception, la liberté d’information</b> : la personne se trouve dans un <b>événement d’actualité</b> ou d’<b>intérêt général</b>…', '… et l’image est <b>pertinente</b>, c’est-à-dire utilisée pour relater cet événement.']},
      {t:'tip', k:'astuce', title:'Repère pratique', h:'Dans un lieu public, une photo de foule où personne n’est isolé pose rarement problème. Un portrait isolé d’un particulier exige son accord. Une personnalité publique peut être montrée dans l’exercice de ses fonctions publiques, pas dans sa vie privée.'}

  essentials:[
    'Un <b>droit subjectif</b> est une prérogative reconnue à une personne, accordée et sanctionnée par le droit objectif.',
    'Le <b>patrimoine</b> = actif + passif évaluables en argent. Universalité : l’actif répond du passif (droit de gage général, art. 2284).',
    'Toute personne a un patrimoine, un seul, intransmissible entre vifs dans sa globalité.',
    'Droits <b>patrimoniaux</b> : cessibles, saisissables, transmissibles. <b>Extrapatrimoniaux</b> : incessibles, insaisissables, imprescriptibles.',
    '<b>Droit réel</b> : sur une chose, avec droit de suite et de préférence. Principaux : propriété (art. 544 : usus, fructus, abusus) et démembrements. Accessoires : hypothèque, gage, nantissement.',
    'Usufruit = usus + fructus ; usage = limité aux besoins ; habitation = logement familial ; servitude = fonds dominant / servant ; emphytéose = 18 à 99 ans.',
    '<b>Droit personnel</b> : contre une personne, sans suite ni préférence. <b>Droits intellectuels</b> : auteur, brevet, clientèle.',
    'Art. 9 : chacun a droit au respect de sa vie privée, même célèbre. Pas absolu : contrôle de proportionnalité.',
    'Image : autorisation <b>expresse et spéciale</b>, sauf événement d’actualité ou d’intérêt général avec image pertinente.'
  ],
  flashcards:[
    {q:'Qu’est-ce qu’un droit subjectif ?', a:'Une prérogative dont dispose une personne (son titulaire, le « sujet ») à l’égard de biens ou de personnes. Ex. : le droit de propriété.'},
    {q:'Droit objectif ou droits subjectifs ?', a:'Le droit objectif est l’ensemble des règles ; les droits subjectifs sont les prérogatives qu’il accorde et sanctionne au profit de chacun.'},
    {q:'Qu’est-ce que le patrimoine ?', a:'L’ensemble des droits et obligations d’une personne évaluables en argent : un actif (droits) et un passif (dettes).'},
    {q:'Pourquoi dit-on que le patrimoine est une universalité juridique ?', a:'C’est un tout distinct de ses éléments, où l’actif répond du passif : un créancier impayé peut saisir n’importe quel bien de son débiteur.'},
    {q:'Que prévoit l’article 2284 du Code civil ?', a:'Celui qui s’est obligé doit remplir son engagement sur tous ses biens, mobiliers et immobiliers, présents et à venir : c’est le droit de gage général des créanciers.'},
    {q:'Qu’est-ce qu’un créancier chirographaire ?', a:'Un créancier sans sûreté : il n’a qu’un droit de gage général, sans droit de suite ni de préférence.'},
    {q:'Les 3 conséquences du lien entre patrimoine et personne ?', a:'Seules les personnes ont un patrimoine ; toute personne en a un ; une personne n’en a qu’un seul.'},
    {q:'Peut-on vendre son patrimoine de son vivant ?', a:'Non. On peut vendre ou donner des biens, mais pas son patrimoine dans sa globalité : il ne se transmet qu’au décès.'},
    {q:'Exemples d’actif et de passif ?', a:'Actif : maison, terrain, voiture, comptes, actions, obligations. Passif : crédit immobilier, crédit conso, dettes fiscales, dettes courantes.'},
    {q:'Caractères des droits patrimoniaux ?', a:'Évaluables en argent, cessibles, saisissables, transmissibles (entre vifs ou à cause de mort).'},
    {q:'Qu’est-ce qu’un droit réel ?', a:'Un droit exercé directement par une personne sur une chose. Il donne un droit de suite et un droit de préférence.'},
    {q:'Le droit de suite ?', a:'Le droit de revendiquer la chose en quelques mains qu’elle se trouve.'},
    {q:'Le droit de préférence ?', a:'Le droit d’être préféré à toute autre personne qui revendique la chose : par exemple, être payé avant les créanciers chirographaires.'},
    {q:'Que dit l’article 544 du Code civil ?', a:'La propriété est le droit de jouir et disposer des choses de la manière la plus absolue, pourvu qu’on n’en fasse pas un usage prohibé par les lois ou les règlements.'},
    {q:'Usus, fructus, abusus ?', a:'Usus : utiliser. Fructus : percevoir les fruits (loyers, récoltes). Abusus : disposer (vendre, donner, détruire).'},
    {q:'L’usufruit ?', a:'Usus + fructus. Le nu-propriétaire conserve l’abusus.'},
    {q:'Le droit d’usage ?', a:'User de la chose et en percevoir les fruits, mais seulement dans la limite de ses besoins, jamais pour en tirer des revenus.'},
    {q:'Le droit d’habitation ?', a:'Un droit d’usage limité à l’habitation familiale.'},
    {q:'Fonds dominant et fonds servant ?', a:'Le fonds dominant profite de la servitude (ex. : il passe chez le voisin) ; le fonds servant la subit.'},
    {q:'L’emphytéose ?', a:'Un bail de très longue durée, de 18 à 99 ans, qui confère un droit réel.'},
    {q:'Les droits réels accessoires ?', a:'Les sûretés réelles, accessoires d’une créance : hypothèque (immeuble), gage (meuble corporel), nantissement (meuble incorporel).'},
    {q:'Que se passe-t-il si un bien hypothéqué est vendu ?', a:'Le créancier garde son droit de suite : la sûreté suit le bien, et il peut le saisir entre les mains de l’acheteur. Il garde aussi son droit de préférence.'},
    {q:'Qu’est-ce qu’un droit personnel ?', a:'Un droit de créance : une relation entre un créancier et un débiteur. Il ne donne ni droit de suite, ni droit de préférence.'},
    {q:'Les droits intellectuels ?', a:'Des droits sur une création intellectuelle ou une clientèle, à objet immatériel, qui donnent un droit exclusif d’exploitation : droit d’auteur, brevet, droit de clientèle.'},
    {q:'Le droit moral de l’auteur est-il patrimonial ?', a:'Non : il permet de veiller au respect de l’œuvre et il est extrapatrimonial. Ce sont les droits d’exploitation qui sont patrimoniaux.'},
    {q:'Les droits extrapatrimoniaux ?', a:'Non évaluables en argent, hors du patrimoine : incessibles, insaisissables, imprescriptibles. Ce sont les droits de la personnalité.'},
    {q:'Que dit l’article 9 du Code civil ?', a:'« Chacun a droit au respect de sa vie privée. » Les juges peuvent ordonner des mesures (séquestre, saisie…), en référé s’il y a urgence, en plus de la réparation.'},
    {q:'Que recouvre la vie privée ?', a:'Vie sentimentale, familiale, santé, domicile, patrimoine des particuliers, appartenance syndicale ou politique, téléphone, n° de sécurité sociale, correspondances, profil de réseau social, adresse IP…'},
    {q:'Le droit à la vie privée est-il absolu ?', a:'Non : il se concilie avec le droit à l’information et le droit à la preuve. Le juge exerce un contrôle de proportionnalité.'},
    {q:'D’où vient le droit à l’image ?', a:'D’aucun texte : la jurisprudence l’a construit sur l’article 9 du Code civil (comme le droit à la voix).'},
    {q:'Quand peut-on publier l’image d’une personne sans son accord ?', a:'Si elle se trouve dans un événement d’actualité ou d’intérêt général, et que l’image est pertinente pour relater cet événement. Sinon : autorisation expresse et spéciale.'},
    {q:'Une filature du salarié par son employeur ?', a:'C’est un moyen de preuve illicite dès lors qu’elle porte atteinte à la vie privée du salarié.'}
  ],

  cases:[
    {id:'efd2_c1', title:'Marius et les poubelles', tag:'Vie privée · art. 9', facts:['Marius vient de remporter l’Eurovision : il est désormais célèbre. Quelques jours après son retour, il constate que quelqu’un a fouillé ses poubelles déposées dans la rue : le test de grossesse de sa compagne a disparu. Elle venait de lui annoncer qu’elle attendait un enfant.', 'Le lundi suivant, un journal à scandale publie un article de deux pages sur sa future paternité.'], q:'Y a-t-il atteinte à la vie privée ?', steps:[
      {l:'Les faits', h:'Une personne devenue célèbre voit sa future paternité révélée par la presse, grâce à des informations récupérées en fouillant ses poubelles, à son insu.'},
      {l:'Le problème de droit', h:'La révélation par la presse de la future paternité d’une personne célèbre, obtenue en fouillant ses poubelles, constitue-t-elle une atteinte à sa vie privée ?'},
      {l:'Les règles applicables', h:'<p>Art. 9 C. civ. : « Chacun a droit au respect de sa vie privée. » Toute personne, quels que soient son rang ou sa notoriété, est protégée. La vie privée comprend la <b>vie familiale</b> et l’<b>état de santé</b>.</p><p>La jurisprudence (1995, vue en cours) a jugé que fouiller les poubelles d’une personne pour révéler sa vie privée dans un journal porte atteinte à celle-ci.</p><p>Le droit à la vie privée se concilie avec la liberté d’information : il faut un intérêt général.</p>'},
      {l:'L’application aux faits', h:'<p>La paternité relève de la vie familiale de Marius, et la grossesse touche aussi la vie privée de sa compagne. La notoriété de Marius justifie l’intérêt du public pour sa carrière, pas pour sa vie familiale.</p><p>L’information a été obtenue à son insu ; les poubelles étaient dans la rue, mais leur contenu reste privé tant qu’elles n’ont pas été ramassées. Aucune actualité d’intérêt général ne justifie cette révélation sensationnaliste.</p>'},
      {l:'La conclusion', h:'L’atteinte à la vie privée est caractérisée. Marius, et sa compagne, peuvent demander des <b>dommages-intérêts</b> et des mesures pour faire cesser la diffusion (saisie, retrait), <b>en référé</b> s’il y a urgence.'}]},
    {id:'efd2_c2', title:'Ronan et la loi nouvelle', tag:'Loi dans le temps', facts:['Antoine et Julie ont un fils, Ronan. Un cousin l’engage pour une campagne de publicité photo. Le jour même, il leur remet un chèque de 1 500 €, encaissé sur leur compte joint.', 'Trois semaines plus tard, une loi nouvelle exige l’autorisation d’un juge pour toute utilisation de photographies d’un enfant. Le shooting a lieu une semaine après cette loi ; un second versement de 1 500 € est prévu 15 jours après.', 'On considère que cette loi n’est pas d’ordre public.'], q:'La loi nouvelle s’applique-t-elle à ce contrat ?', steps:[
      {l:'Les faits', h:'Un contrat est conclu et commence à s’exécuter (premier paiement) avant une loi nouvelle ; la suite (shooting, second paiement) a lieu après.'},
      {l:'Le problème de droit', h:'Une loi nouvelle s’applique-t-elle aux effets futurs d’un contrat conclu avant son entrée en vigueur ?'},
      {l:'Les règles applicables', h:'Art. 2 C. civ. : la loi ne dispose que pour l’avenir. Les contrats en cours restent régis par la loi en vigueur au jour de leur conclusion (survie de la loi ancienne), <b>sauf</b> si la loi nouvelle est d’ordre public : elle s’applique alors aux effets futurs.'},
      {l:'L’application aux faits', h:'Le contrat a été conclu avant la loi. Celle-ci n’est pas d’ordre public : elle ne s’impose pas au contrat, même pour le shooting et le second versement qui ont lieu après.'},
      {l:'La conclusion', h:'Le contrat reste soumis à la <b>loi ancienne</b> : l’autorisation du juge n’est pas nécessaire. Si la loi avait été d’ordre public, le shooting aurait exigé cette autorisation.'}]},
    {id:'efd2_c3', title:'La photo de Ronan, des années plus tard', tag:'Droit à l’image', facts:['Quelques années plus tard, chez sa coiffeuse, Julie feuillette un magazine. Elle découvre la photo de Ronan, à 5 ans, dans les bras d’une célèbre comédienne, pour la campagne de promotion de son dernier film.', 'Les parents n’ont jamais autorisé cette utilisation.'], q:'Est-il possible de demander des dommages-intérêts ?', steps:[
      {l:'Les faits', h:'L’image d’un mineur, autorisée pour une campagne précise, est réutilisée des années plus tard pour une autre campagne, sans l’accord des parents.'},
      {l:'Le problème de droit', h:'L’utilisation de l’image d’un enfant au-delà de l’usage autorisé par ses parents porte-t-elle atteinte à son droit à l’image ?'},
      {l:'Les règles applicables', h:'Le droit à l’image, dégagé par la jurisprudence sur le fondement de l’art. 9 C. civ., exige une autorisation <b>expresse et spéciale</b> : elle ne vaut que pour l’utilisation prévue. Pour un mineur, ce sont ses parents qui consentent.'},
      {l:'L’application aux faits', h:'Les parents avaient accepté la publicité du cousin, pas la promotion d’un film. Il s’agit d’une nouvelle utilisation, commerciale, sans aucun lien avec un événement d’actualité.'},
      {l:'La conclusion', h:'Il y a atteinte au droit à l’image de Ronan : ses parents peuvent demander, en son nom, des <b>dommages-intérêts</b> et le retrait de la campagne.'}]},
    {id:'efd2_c4', title:'Monsieur Gilles et le reportage', tag:'Image, voix, vie privée', facts:['Monsieur Gilles dirige une société dans le secteur des énergies renouvelables. Une chaîne de télévision le filme pour un reportage sur ce sujet. Il a autorisé uniquement la diffusion de son image non floutée.', 'En regardant le reportage, il découvre que son nom a été divulgué, et que des propos qu’il a tenus hors caméra ont été diffusés.'], q:'Monsieur Gilles peut-il se plaindre d’une atteinte à ses droits ?', steps:[
      {l:'Les faits', h:'Un dirigeant d’entreprise, filmé avec son accord pour un reportage sur son secteur, voit diffuser son nom et des propos tenus hors caméra, au-delà de l’autorisation donnée.'},
      {l:'Le problème de droit', h:'La diffusion d’éléments qui dépassent l’autorisation donnée (nom, propos hors caméra) porte-t-elle atteinte aux droits de la personnalité ?'},
      {l:'Les règles applicables', h:'Art. 9 C. civ. : droit à la vie privée, à l’image et à la voix. L’autorisation est <b>expresse et spéciale</b>. La liberté d’information permet de parler d’un sujet d’intérêt général, si les éléments diffusés sont pertinents.'},
      {l:'L’application aux faits', h:'<p><b>Le nom</b> : il apparaît dans le cadre de son activité professionnelle, dans un reportage sur son secteur. L’atteinte à la vie privée est peu probable (c’est la position retenue en cours).</p><p><b>Les propos hors caméra</b> : il n’a pas consenti à leur diffusion. S’ils touchent à sa vie privée ou sont sortis de leur contexte, l’atteinte est possible. Il faut vérifier leur contenu et leur lien avec le sujet du reportage.</p>'},
      {l:'La conclusion', h:'Monsieur Gilles peut demander à la chaîne le retrait ou la modification du reportage et, selon le contenu des propos et son préjudice, agir en justice.'}]},
    {id:'efd2_c5', title:'Le faux profil', tag:'Vie privée · identité', facts:['Une ancienne salariée de Monsieur Gilles crée, sur un réseau social, un faux profil à son nom.', 'Elle y diffuse des informations laissant croire qu’il entretient une relation extraconjugale.'], q:'Ce comportement est-il condamnable ?', steps:[
      {l:'Les faits', h:'Une personne utilise l’identité d’une autre sur un réseau social pour lui prêter une liaison imaginaire.'},
      {l:'Le problème de droit', h:'La création d’un faux profil diffusant de fausses informations sur la vie sentimentale d’une personne est-elle sanctionnée ?'},
      {l:'Les règles applicables', h:'<p>Art. 9 C. civ. : la vie sentimentale fait partie de la vie privée, tout comme un profil de réseau social.</p><p>Le + du prof : usurper l’identité d’autrui, même en ligne, pour troubler sa tranquillité ou porter atteinte à son honneur est un délit (art. 226-4-1 du Code pénal).</p>'},
      {l:'L’application aux faits', h:'L’ex-salariée utilise le nom de Monsieur Gilles sans son accord et lui attribue une relation extraconjugale : elle touche à sa vie sentimentale et à son honneur.'},
      {l:'La conclusion', h:'Le comportement est condamnable. Monsieur Gilles doit <b>conserver les preuves</b> (captures d’écran, adresse du profil, dates), <b>signaler</b> le compte à la plateforme, puis <b>porter plainte</b> et demander réparation, avec l’aide d’un avocat.'}]},
    {id:'efd2_c6', title:'Magalie et le secret médical', tag:'Santé · vie privée', facts:['Magalie, contrôleuse de gestion, apprend par son médecin qu’elle est atteinte d’une maladie grave. Elle sera arrêtée trois mois.', 'Elle devait devenir directrice financière et craint que son médecin révèle son état à son employeur si celui-ci le contacte.'], q:'Le médecin peut-il révéler l’état de santé de Magalie à son employeur ?', steps:[
      {l:'Les faits', h:'Une salariée en arrêt maladie craint que son médecin informe son employeur de sa maladie.'},
      {l:'Le problème de droit', h:'Un médecin peut-il révéler à l’employeur l’état de santé d’une salariée ?'},
      {l:'Les règles applicables', h:'<p>L’<b>état de santé</b> fait partie de la vie privée (art. 9 C. civ.).</p><p>Le médecin est tenu au <b>secret médical</b> : il ne peut rien révéler, même si l’employeur le contacte.</p><p>Le + du prof : l’arrêt de travail transmis à l’employeur ne mentionne pas la maladie, et écarter un salarié d’une promotion en raison de sa santé serait une discrimination interdite.</p>'},
      {l:'L’application aux faits', h:'L’employeur de Magalie n’a pas à connaître son diagnostic pour gérer son absence. Pour les questions liées à son poste, l’interlocuteur est le médecin du travail.'},
      {l:'La conclusion', h:'Le médecin ne peut rien révéler. Magalie peut le lui rappeler. Son inquiétude pour sa promotion est compréhensible, mais rien dans les faits ne montre une discrimination pour l’instant.'}]},
    {id:'efd2_c7', title:'Paul et son message sur un réseau social', tag:'Vie privée · travail', facts:['Paul, 24 ans, reçoit une convocation à un entretien préalable à un licenciement pour faute grave.', 'Il avait critiqué sur un réseau social le management rigide de son employeur : « tous des nuls dans cette boîte, il faudrait y mettre le feu ».'], q:'Paul peut-il être licencié pour ce message ?', steps:[
      {l:'Les faits', h:'Un salarié publie sur un réseau social des propos dénigrants et excessifs sur son entreprise ; l’employeur engage une procédure de licenciement.'},
      {l:'Le problème de droit', h:'Un salarié peut-il être sanctionné pour des propos dénigrants publiés sur un réseau social ?'},
      {l:'Les règles applicables', h:'<p>Art. 9 C. civ. : les correspondances et les échanges privés relèvent de la vie privée. Le salarié garde sa liberté d’expression, sauf abus (propos injurieux, excessifs, menaçants).</p><p>La Cour de cassation a jugé en 2018 que des propos tenus dans un groupe fermé réservé à quelques personnes relevaient d’une conversation de nature privée et ne justifiaient pas un licenciement pour faute grave.</p>'},
      {l:'L’application aux faits', h:'Tout dépend du <b>paramétrage</b> : si le message était réservé à un cercle restreint, il relève de sa vie privée. S’il était public, l’employeur peut en tenir compte. Le contenu, avec un appel à « mettre le feu », est excessif et aggrave son cas.'},
      {l:'La conclusion', h:'Si le message était <b>public</b>, une sanction, voire une faute grave, est envisageable. S’il était <b>privé</b>, Paul peut contester son licenciement en invoquant son droit au respect de sa vie privée.'}]}
  ]
});

</script>
